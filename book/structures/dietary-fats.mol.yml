id: dietary-fats
title: "The shape of dietary fats"
intro: >
  Choose a fatty acid and rotate it to compare the shape of its chain.
molecules:
  - id: oleic
    name: "Oleic acid (cis-unsaturated)"
    sdf: /structures/oleic-acid.sdf
    svg: /structures/oleic-acid.svg
    note: >
      One cis double bond, at carbon 9, kinks the chain, the hallmark of most healthy
      unsaturated fats; oleic acid is the main fat in olive oil. The bend stops the molecules
      packing tightly, so these fats are liquid at room temperature.
  - id: elaidic
    name: "Elaidic acid (trans-unsaturated)"
    sdf: /structures/elaidic-acid.sdf
    svg: /structures/elaidic-acid.svg
    note: >
      Same atoms as oleic acid, but the trans double bond leaves the chain almost straight,
      so it packs tightly and behaves like a saturated fat. Elaidic acid is the classic
      industrial trans fat, and industrial trans fat carries the clearest dietary harm signal.
  - id: stearic
    name: "Stearic acid (saturated)"
    sdf: /structures/stearic-acid.sdf
    svg: /structures/stearic-acid.svg
    note: >
      No double bonds: a fully saturated, straight chain that packs tightly and is solid at
      room temperature (common in animal fats). Its straight shape is close to that of
      elaidic acid.
