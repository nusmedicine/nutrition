id: bile-salt
title: "Bile: a molecule with two faces"
intro: >
  Rotate the model of cholic acid and find the face that carries its hydroxyl
  (–OH) groups.
molecules:
  - id: cholic-acid
    name: "Cholic acid (a bile acid)"
    sdf: /structures/cholic-acid.sdf
    svg: /structures/cholic-acid.svg
    note: >
      The main bile acid made by the liver from cholesterol. Its three –OH groups
      cluster on one face, which is hydrophilic (water-loving), while the steroid back is
      hydrophobic (fat-loving).
