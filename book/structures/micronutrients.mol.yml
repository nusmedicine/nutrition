id: micronutrients
title: "Fat-soluble or water-soluble? Look at the structure"
intro: >
  Start with the 2D formula, then rotate the 3D model. Count the hydroxyl (–OH) groups on
  each vitamin.
molecules:
  - id: ascorbic-acid
    name: "Vitamin C (ascorbic acid, water-soluble)"
    sdf: /structures/ascorbic-acid.sdf
    svg: /structures/ascorbic-acid.svg
    note: >
      A small molecule covered in hydroxyl (–OH) groups, so it dissolves in water, is not
      stored and needs regular intake from food. The two –OH groups on the carbon–carbon
      double bond (the enediol) are the reactive part: they make vitamin C an antioxidant
      and let it keep dietary iron in its more absorbable form.
  - id: retinol
    name: "Vitamin A (retinol, fat-soluble)"
    sdf: /structures/retinol.sdf
    svg: /structures/retinol.svg
    note: >
      A long carbon chain with a single –OH at one end. It is mostly hydrocarbon, so it
      dissolves in fat and is stored in the liver. Storage cuts both ways: deficiency
      develops slowly, but high-dose supplements can accumulate to harmful levels, which in
      early pregnancy can cause birth defects.
  - id: cholecalciferol
    name: "Vitamin D (cholecalciferol, fat-soluble)"
    sdf: /structures/cholecalciferol.sdf
    svg: /structures/cholecalciferol.svg
    note: >
      Built on a modified cholesterol skeleton and, like retinol, mostly hydrocarbon, so it
      is fat-soluble and stored.
