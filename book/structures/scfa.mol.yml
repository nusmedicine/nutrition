id: scfa
title: "The three short-chain fatty acids"
intro: >
  Choose a molecule and rotate it. Acetate, propionate and butyrate are small, volatile acids of two,
  three and four carbons.
molecules:
  - id: acetic-acid
    name: "Acetate (acetic acid, C2)"
    sdf: /structures/acetic-acid.sdf
    svg: /structures/acetic-acid.svg
    note: >
      The most abundant SCFA (~60%). Two carbons; it is poorly extracted by the liver, so it travels
      systemically to peripheral tissues.
  - id: propionic-acid
    name: "Propionate (propionic acid, C3)"
    sdf: /structures/propionic-acid.sdf
    svg: /structures/propionic-acid.svg
    note: >
      Three carbons. Taken up by the liver via the portal vein, where it is a substrate for
      gluconeogenesis.
  - id: butyric-acid
    name: "Butyrate (butyric acid, C4)"
    sdf: /structures/butyric-acid.sdf
    svg: /structures/butyric-acid.svg
    note: >
      Four carbons. The least abundant SCFA yet the main one used locally: the preferred fuel of
      the colonocytes that line the colon.
