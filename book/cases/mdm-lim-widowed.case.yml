id: mdm-lim-widowed
title: "Mdm Lim, 78: the widow who eats alone"
objectives:
  - "Recognise unintentional weight loss (looser clothing) in an older adult, especially in the months after widowhood, as the main red flag, not \"normal ageing\"."
  - "Apply do-no-harm: avoid a restrictive diet in a thin older adult who is losing weight, and fortify familiar foods instead."
  - "Recognise the at-risk B12 profile (long-term metformin, a PPI and poor intake) and check or refer instead of blanket-supplementing."
  - "Reconnect the isolated older adult to a shared meal and refer appropriately, without managing malnutrition here."
difficulty: intro
estimatedMinutes: 11
tags: [nutrition, healthy-ageing, undernutrition, social-isolation, do-no-harm, singapore]
start: intro
variables: { quality: 0 }

persona:
  name: "Mdm Lim (with daughter Serene)"
  age: 78
  sex: female
  occupation: "Retired; widowed 4 months ago; lives alone in an HDB flat"
  presentation: "A quiet 78-year-old brought by her daughter Serene, who works full-time. Since her husband died 4 months ago, Mdm Lim 'can't be bothered to cook for one', often skips lunch, and her cheongsam now hangs loose. Long-term metformin and a stomach-acid tablet (PPI). No coughing or choking on food."
  voice: "Subdued, a little withdrawn since bereavement; says she 'isn't very hungry these days'."

nodes:
  - id: intro
    type: info
    emotion: concerned
    title: "\"Her clothes just hang off her now\""
    body: |
      Serene brings her mother in. Since being widowed four months ago, Mdm Lim eats little, skips meals, and
      cooks less "for just one person". Her cheongsam is visibly loose. She's on long-term metformin and a
      PPI, and has no swallowing trouble. Work through the visit.
    next: q-recognise

  - id: q-recognise
    type: mcq
    emotion: concerned
    stem: "*Serene:* \"She's just getting old, right? Should we just let her be?\" What is the most important red flag here?"
    options:
      - id: a
        text: "The unintentional weight loss since she was widowed, which needs evaluation."
        correct: true
        feedback: "Unintentional weight loss of around 5% or more is never \"just ageing\", and widowhood is a classic trigger. The loose cheongsam is the signal that ageing in health has tipped into something to act on."
        effects: { quality: +1 }
        reaction: neutral
        goto: q-advice
      - id: b
        text: "Nothing: weight loss is normal in ageing, so reassure and review in a year."
        correct: false
        feedback: "Weight loss without trying flags malignancy, depression, dental, swallowing or medication problems, so it warrants evaluation now, not a year's wait."
        goto: q-advice
      - id: c
        text: "Only her grief, which will pass without further action."
        correct: false
        feedback: "Grief is part of it, but the weight loss cannot be put down to bereavement and left there: the loss itself needs evaluating, and her low intake needs support now."
        goto: q-advice

  - id: q-advice
    type: mcq
    emotion: concerned
    stem: "*Serene:* \"Should I put her on a low-fat, low-salt healthy diet to be safe?\" What's the best first nutrition advice?"
    options:
      - id: a
        text: "\"The opposite: make her food richer and get her eating with others.\""
        correct: true
        feedback: "Raise nutrient density and avoid restriction: fortify familiar foods so a small appetite still delivers protein and energy, and address her eating alone by reconnecting her to a shared meal."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-b12
      - id: b
        text: "\"Yes, a low-fat, low-salt diet is the healthy thing to do.\""
        correct: false
        feedback: "Restricting the diet of a thin older woman who is losing weight strips intake and flavour and can tip her into malnutrition. This is the do-no-harm trap: she needs density and flavour, not restriction."
        reaction: concerned
        goto: remedial
      - id: c
        text: "\"Just buy her supplement drinks and leave it at that.\""
        correct: false
        feedback: "Food-first fortification of the meals she already eats comes before supplement drinks, and drinks alone leave out the main modifiable factor: she eats alone."
        goto: q-b12

  - id: q-b12
    type: mcq
    emotion: neutral
    stem: "*You review her medicines.* Given long-term metformin and a PPI plus poor intake, what is appropriate?"
    options:
      - id: a
        text: "Consider checking her B12 or referring for it, given her risk profile."
        correct: true
        feedback: "Low stomach acid, made lower by the PPI, and long-term metformin both impair B12 absorption, so she fits the profile to test. Targeting the at-risk nutrient beats blanket supplementation."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-refer
      - id: b
        text: "Start a full panel of vitamin and mineral supplements to be thorough."
        correct: false
        feedback: "Blanket supplementation is not targeted: her metformin and PPI raise B12 risk specifically, so check that nutrient instead of everything."
        goto: q-refer
      - id: c
        text: "Check nothing, since her diet is the only issue."
        correct: false
        feedback: "Her drugs matter: metformin and PPIs impair B12 absorption independently of diet. In this at-risk profile, B12 is worth checking."
        goto: q-refer

  - id: q-refer
    type: mcq
    emotion: neutral
    stem: "What is the appropriate overall plan at this stage of training?"
    options:
      - id: a
        text: "Refer her (GP or polyclinic, dietitian) and link her to communal meals."
        correct: true
        feedback: "Recognise and refer, and act on the social cause: linking her to an Active Ageing Centre for communal meals is an intervention you can start now. The full malnutrition assessment and management belong to the specialist (see the *Undernutrition & malnutrition* chapter)."
        effects: { quality: +1 }
        reaction: relieved
        goto: route
      - id: b
        text: "Handle the full malnutrition assessment and feeding plan yourself today."
        correct: false
        feedback: "The formal screening tools, the multidisciplinary team and any supplement or feeding plan lie beyond this role (see the *Undernutrition & malnutrition* chapter). Recognise, support intake and refer."
        goto: route
      - id: c
        text: "Send her home with advice to \"eat more\" and no follow-up."
        correct: false
        feedback: "A one-line instruction will not shift an isolated, grieving older woman with a poor appetite; she needs referral and a concrete social connection such as a communal meal."
        goto: route

  - id: route
    type: branch
    rules:
      - if: "quality >= 4"
        goto: end-good
    else: remedial

  - id: remedial
    type: info
    emotion: concerned
    title: "Raise nutrient density, avoid restriction, and refer"
    body: |
      Unintentional weight loss (loose clothes) after widowhood is the red flag, not "normal ageing". The
      tempting low-fat, low-salt "healthy diet" is the do-no-harm trap: a thin older woman who is losing
      weight needs her food made richer and more flavourful (fortify her usual porridge with egg, fish or
      tofu), not stricter. Her metformin and PPI put her at risk of B12 deficiency, which is worth checking.
      A key modifiable factor is that she eats alone, so reconnect her to a shared meal. Then refer (GP,
      dietitian) instead of managing malnutrition here. Replay and run it through.
    next: end-partial

  - id: end-good
    type: end
    outcome: success
    title: "Recognised, supported, referred"
    body: |
      You saw the weight loss for what it was, resisted the reflex to restrict a frail older woman's diet,
      chose food-first fortification and a shared meal over a "healthy diet", flagged her B12 risk and
      referred appropriately. At this stage the job is to anticipate the shifting needs of ageing, recognise
      when a normal shift has tipped into a problem, and refer, while making the small food-first and social
      moves that help straight away. (The malnutrition assessment and management belong to the
      *Undernutrition & malnutrition* chapter.)
    debrief:
      objectivesMet: [1, 2, 3, 4]
      keyPoints:
        - "Unintentional weight loss (about 5% or more, or loose clothes), especially after widowhood, is a red flag, not normal ageing. Recognise and refer."
        - "Do no harm: never put a thin older adult who is losing weight on a restrictive diet; fortify familiar foods instead."
        - "Long-term metformin, a PPI and poor intake put her at risk of B12 deficiency through malabsorption: check or refer, and don't blanket-supplement."
        - "Eating alone is a powerful, modifiable risk factor: reconnect her to a shared meal (an Active Ageing Centre) and refer for the rest."

  - id: end-partial
    type: end
    outcome: partial
    title: "Most of the way there"
    body: |
      You helped Mdm Lim but slipped on at least one point: recognising the weight loss, the do-no-harm decision
      (no restrictive diet), the B12 risk, or the refer-and-reconnect plan. Replay and run the safe path:
      recognise the unintentional weight loss, fortify familiar foods to raise nutrient density without restriction, check B12
      given her metformin and PPI, reconnect her to a shared meal, and refer.
    debrief:
      objectivesMet: [1]
      keyPoints:
        - "Unintentional weight loss after widowhood is a red flag: recognise and refer."
        - "Raise nutrient density without restriction: fortify familiar foods, and never put a thin, frail older adult on a restrictive diet."
        - "Eating alone is a modifiable risk factor: reconnect her to a shared meal, and check B12 given her metformin and PPI."
