id: rachel-athlete
title: "Rachel, 14: the netball player who \"should go on a diet\""
objectives:
  - "Apply the do-no-harm rule: never prescribe a diet or dismiss red flags in an adolescent, and address weight through healthy habits."
  - "Recognise the pattern of low energy availability and the female-athlete triad (amenorrhoea, a stress fracture, restriction and a heavy training load) as a bone-health red flag."
  - "Recognise that a normal weight does not exclude a problem, and that the safe action at this stage is to refer for work-up."
  - "Frame the message as fuel-don't-restrict, and know the limits of the role."
difficulty: intro
estimatedMinutes: 10
tags: [nutrition, adolescence, do-no-harm, female-athlete-triad, eating-disorder, singapore]
start: intro
variables: { quality: 0 }

persona:
  name: "Rachel (with mother Mrs Tan)"
  age: 14
  sex: female
  occupation: "Secondary-3 student; competitive netball player"
  presentation: "A fit-looking 14-year-old brought by her mother, who is worried Rachel has 'put on weight' and 'should slim down for netball'. Rachel trains most days; her periods stopped a few months ago. Her weight is in the normal range."
  voice: "Quiet, a little defensive; keen on her sport and used to being told she should be leaner."

nodes:
  - id: intro
    type: info
    emotion: neutral
    title: "\"Can you tell her to go on a diet?\""
    body: |
      Rachel is 14 and plays competitive netball, training most days. Her mother has brought her in, worried
      she has "put on weight" and "should slim down". In passing, her mother mentions Rachel's periods
      "stopped a few months ago". Rachel looks fit and her weight is in the normal range.
    next: q-first-move

  - id: q-first-move
    type: mcq
    emotion: concerned
    stem: "*Mrs Tan:* \"She's got heavier this year. Can you just put her on a diet to tone up for netball?\" What do you do first?"
    options:
      - id: a
        text: "Take a focused history (training, eating, the stopped periods) before discussing weight."
        correct: true
        feedback: "The presenting request (\"put her on a diet\") is a trap: dieting in adolescence predicts both eating disorders *and* weight gain. Understand the whole picture, especially the absent periods, before advising anything."
        effects: { quality: +1 }
        reaction: neutral
        goto: q-pattern
      - id: b
        text: "Agree, and give Rachel a calorie-restricted meal plan to \"tone up\"."
        correct: false
        feedback: "Prescribing a diet to an adolescent, especially one already training hard with absent periods, raises the risk of an eating disorder *and* tends to backfire on weight. This is the harmful option: never prescribe a diet here."
        reaction: concerned
        goto: remedial
      - id: c
        text: "Reassure them both that periods often stop in athletes as a sign of fitness, and send them home."
        correct: false
        feedback: "Amenorrhoea in an athlete is a red flag: it can signal under-fuelling that is harming her bones without symptoms. Dismissing it misses a serious, progressive problem."
        reaction: concerned
        goto: remedial

  - id: q-pattern
    type: mcq
    emotion: concerned
    stem: "History: Rachel has been \"eating clean\", cutting out rice and most snacks \"to stay lean for netball\", trains 5–6 times a week, and had a foot stress fracture last season. Her periods stopped around then. What does this pattern suggest?"
    options:
      - id: a
        text: "Under-fuelling: her intake isn't matching her training, which threatens her bones."
        correct: true
        feedback: "This is the recognisable pattern of low energy availability (too little energy left over after training): restriction, a heavy load, amenorrhoea and a stress fracture. The low energy is likely why her periods stopped and why she fractured, and it puts her bone accrual, and so her peak bone mass, at risk."
        effects: { quality: +1 }
        reaction: neutral
        goto: q-refer
      - id: b
        text: "Nothing concerning; cutting rice and snacks is sensible eating for an athlete."
        correct: false
        feedback: "In the context of amenorrhoea, a stress fracture and a heavy training load, this level of restriction is a warning sign of under-fuelling."
        reaction: concerned
        goto: q-refer
      - id: c
        text: "Probably low iron from her periods; start an iron supplement and review."
        correct: false
        feedback: "Iron is worth checking, but it doesn't explain the stopped periods or the stress fracture. The underlying problem is under-fuelling (low energy availability), and an iron tablet would distract from it."
        reaction: concerned
        goto: q-refer

  - id: q-refer
    type: mcq
    emotion: concerned
    stem: "You recognise under-fuelling threatening her bones and periods. What is the appropriate action at your level?"
    options:
      - id: a
        text: "Refer her for proper assessment, reassuring her the goal is to fuel her training."
        correct: true
        feedback: "Recognise and refer, without attempting the work-up or a diagnosis yourself, and advise her to eat enough to fuel her training. Detailed assessment, bone-health work-up and management belong to the specialist team."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-message
      - id: b
        text: "Start a calcium and vitamin D supplement and review her in 6 months."
        correct: false
        feedback: "A supplement doesn't fix the underlying problem (too little energy lowering her hormone levels), and 6 months is far too long to watch a bone-health red flag. She needs referral now."
        reaction: concerned
        goto: q-message
      - id: c
        text: "Tell her to \"just eat a bit more and it'll sort itself out\", and leave it there."
        correct: false
        feedback: "Under-fuelling with amenorrhoea and a stress fracture is beyond a one-line reassurance. She needs a proper assessment: recognise the limits of what to handle alone, and refer."
        reaction: concerned
        goto: q-message

  - id: q-message
    type: mcq
    emotion: neutral
    stem: "*Mrs Tan, still anxious:* \"So should she be eating *less* to get her weight down?\" How do you frame it?"
    options:
      - id: a
        text: "\"Actually, the opposite. Right now Rachel needs to eat enough to match her training.\""
        correct: true
        feedback: "Reframe from weight to fuelling and health, and keep it blame-free: this is about her health and her bones, and the team will help her get the balance right. The reframe protects Rachel from the diet-talk that drives disordered eating, and gets the mother on side."
        effects: { quality: +1 }
        reaction: relieved
        goto: route
      - id: b
        text: "\"Yes, a bit less wouldn't hurt while we look into it.\""
        correct: false
        feedback: "Endorsing *any* restriction here compounds the under-fuelling and the diet-talk that are part of the problem. The message is to eat enough to match her training."
        reaction: concerned
        goto: route

  - id: route
    type: branch
    rules:
      - if: "quality >= 4"
        goto: end-good
    else: remedial

  - id: remedial
    type: info
    emotion: concerned
    title: "The safe approach: recognise, don't restrict, refer"
    body: |
      A mother's request to "put her on a diet" is the tempting wrong answer: dieting in adolescence
      predicts both eating disorders and weight gain, and a **normal weight does not mean safe**.
      Amenorrhoea plus a stress fracture in a hard-training teenager is low energy availability threatening
      her bones, a red flag to recognise and refer, with advice to eat enough to fuel her training. A
      stricter diet or "wait and see" would add to the harm. Replay and take the safe path.
    next: end-partial

  - id: end-good
    type: end
    outcome: success
    title: "Recognised, reframed, referred"
    body: |
      You resisted the request to prescribe a diet, took a history that surfaced the underlying problem, recognised
      under-fuelling threatening Rachel's bones and periods, referred appropriately, and reframed the whole
      conversation from weight to *fuelling for health*. That is the job at this stage: recognise the
      pattern, protect the teenager from harmful diet-talk, and hand the detailed work to the team.
      (Assessment and management of the female-athlete triad and of eating disorders belong to the
      specialist team; the do-no-harm conversation about weight is in the *Assessing diet and talking
      to patients* chapter.)
    debrief:
      objectivesMet: [1, 2, 3, 4]
      keyPoints:
        - "Never prescribe a diet to an adolescent: dieting predicts both eating disorders and weight gain, and a normal weight does not exclude a problem."
        - "Amenorrhoea, a stress fracture, restriction and heavy training together point to low energy availability threatening bone accrual and peak bone mass: a red flag."
        - "The safe action is recognise-and-refer, with advice to eat enough to fuel her training. 'Eat less' and 'wait and see' are unsafe."
        - "Detailed assessment and management belong to the specialist team."

  - id: end-partial
    type: end
    outcome: partial
    title: "Most of the way there"
    body: |
      You helped Rachel but slipped on at least one point: the do-no-harm decision (no diet, don't dismiss the
      amenorrhoea), recognising the under-fuelling pattern, referring her now, or
      reframing from weight to fuelling. Replay and take the safe path: take a history, recognise low energy
      availability threatening her bones, refer, and advise her to eat enough to fuel her training.
    debrief:
      objectivesMet: [1]
      keyPoints:
        - "Agreeing to 'put her on a diet' is the harmful answer; address weight through healthy habits, never restriction."
        - "Absent periods and a stress fracture in a hard-training teen point to low energy availability threatening bone."
        - "Recognise and refer, and advise her to eat enough to fuel her training."
