id: rahmat-shift-runner
title: "Rahmat, 34: the shift-working weekend runner"
objectives:
  - "Right-size exercise fuelling for a recreational adult: ordinary food and water, not carb-loading or shakes."
  - "Give a calibrated protein message (~1.2–1.6 g/kg from food; safe for healthy kidneys, the exception is kidney disease)."
  - "Give evidence-based shift-work advice: weight meals toward the daytime."
  - "Address weight creep with small, sustainable habits, not crash dieting."
  - "Deliver the current alcohol message and act on the ALDH2 flush (ask, advise, screen, refer); never advise drinking for the heart."
difficulty: intro
estimatedMinutes: 12
tags: [nutrition, adulthood, sports-nutrition, shift-work, alcohol, do-no-harm, singapore]
start: intro
variables: { quality: 0 }

persona:
  name: "Rahmat"
  age: 34
  sex: male
  occupation: "Rotating-shift ICU nurse; runs 10–15 km most weekends"
  presentation: "A fit-looking 34-year-old at a routine visit, full of questions from running forums and workmates. He does rotating shifts, runs at weekends, drinks after work three or four nights a week, has crept up ~4 kg over three years, and mentions he 'goes bright red' after just one beer."
  voice: "Enthusiastic, a bit anxious to 'optimise', primed by online fitness advice."

nodes:
  - id: intro
    type: info
    emotion: neutral
    title: "\"I just want to do this properly\""
    body: |
      Rahmat is 34, a rotating-shift ICU nurse who runs 10–15 km most weekends. He has a list of questions:
      should he carb-load and take protein shakes, how to eat on night shifts, and what to do about ~4 kg of
      weight creep over three years. In passing he mentions he "goes red" after one beer but drinks most
      evenings after work. Notice how much of the advice he *expects* he does not need, and where the one
      real red flag is hiding.
    next: q-fuel

  - id: q-fuel
    type: mcq
    emotion: neutral
    stem: "*\"For my weekend runs, should I carb-load the night before and use a sports drink during?\"*"
    options:
      - id: a
        text: "\"Normal meals and water cover that distance; carb-loading and sports drinks are for longer, harder events.\""
        correct: true
        feedback: "A 1- to 1.5-hour recreational run is covered by ordinary food and water; carb-loading is athlete guidance for events over about 90 minutes, and carbohydrate during exercise is a performance strategy for training or racing athletes."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-protein
      - id: b
        text: "\"Yes, carb-load with 10–12 g/kg the day before and take a sports drink every session to be safe.\""
        correct: false
        feedback: "Carb-loading and during-exercise sports drinks are athlete guidance for long endurance efforts; for a weekend run they add energy he does not need. Normal food and water suffice."
        goto: q-protein
      - id: c
        text: "\"Definitely use gels and a recovery shake after every run, or the training is wasted.\""
        correct: false
        feedback: "Gels and recovery shakes are for high endurance volume or twice-daily training; for a weekend runner, ordinary meals do the job."
        goto: q-protein

  - id: q-protein
    type: mcq
    emotion: neutral
    stem: "*\"How much protein should I get, and will lots of protein wreck my kidneys? Someone said 3 grams per kilo.\"*"
    options:
      - id: a
        text: "\"About 1.2–1.6 g per kilo a day from food is plenty, and safe for normal kidneys.\""
        correct: true
        feedback: "Benefit plateaus near 1.6 g/kg, so 3 g/kg builds no extra muscle, and the range comes easily from ordinary food. Higher protein is safe for healthy kidneys; the worry belongs to established kidney disease."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-shift
      - id: b
        text: "\"Yes, aim for 3 g/kg with shakes, since more protein always means more muscle.\""
        correct: false
        feedback: "At 3 g/kg there is no extra muscle, because benefit plateaus around 1.6 g/kg. Muscle also needs the resistance-exercise stimulus; protein alone does little."
        goto: q-shift
      - id: c
        text: "\"Actually, keep protein low, because high protein damages everyone's kidneys.\""
        correct: false
        feedback: "Healthy kidneys show no harm at higher intakes; the caveat is established kidney disease. Under-eating protein would undercut his training."
        goto: q-shift

  - id: q-shift
    type: mcq
    emotion: concerned
    stem: "*\"On night shifts I end up eating a big meal around 3 a.m. Is that okay?\"*"
    options:
      - id: a
        text: "\"Move your main meals to the daytime and eat lightly at night.\""
        correct: true
        feedback: "Food eaten overnight is handled less well metabolically (poorer glucose tolerance), so daytime-weighted eating is the better pattern for shift workers. Shift work is linked to higher diabetes risk through circadian misalignment, and weighting meals toward the day is the most evidence-aligned practical change."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-weight
      - id: b
        text: "\"A big 3 a.m. meal is fine; energy is energy, whatever the hour.\""
        correct: false
        feedback: "Timing matters here: heavy eating in the small hours worsens the metabolic picture for shift workers. Weight the main meals toward the daytime instead."
        goto: q-weight
      - id: c
        text: "\"Just skip food entirely on night shifts.\""
        correct: false
        feedback: "Fasting through every shift is not necessary, and it is hard to sustain and can backfire; the useful change is meal timing, weighted toward the daytime."
        goto: q-weight

  - id: q-weight
    type: mcq
    emotion: concerned
    stem: "*\"And the 4 kg: should I go on a crash diet to get it off fast?\"*"
    options:
      - id: a
        text: "\"Small changes you can keep, starting with fewer drinks, beat a crash diet.\""
        correct: true
        feedback: "Weight creep is a small chronic surplus, best undone by durable small changes and self-weighing, not cycles of restriction. Lower Asian BMI cut-offs mean a few kilograms matter, so it is worth addressing."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-alcohol
      - id: b
        text: "\"Yes, a strict crash diet now, then back to normal once the weight's off.\""
        correct: false
        feedback: "Crash-and-rebound rarely holds and sets up weight cycling. The evidence favours small, sustainable habits, starting with the most obvious surplus: the drinks."
        goto: q-alcohol
      - id: c
        text: "\"Don't worry about 4 kg; just train harder, since you can out-run any diet.\""
        correct: false
        feedback: "Activity has a weak effect on weight once excess has accumulated, so a surplus cannot reliably be out-trained. The intake side (those drinks) matters more here."
        goto: q-alcohol

  - id: q-alcohol
    type: mcq
    emotion: concerned
    stem: "*\"Last thing: I drink most evenings to unwind, but I read a daily drink is good for the heart. And yeah, I go red after one beer, but that's normal for me. All fine?\"*"
    options:
      - id: a
        text: "\"Two things: the heart claim no longer holds, and the flushing matters. Can I ask about your drinking?\""
        correct: true
        feedback: "This combines the current alcohol message with action on the ALDH2 flush. The flush means a raised oesophageal-cancer risk if he keeps drinking, so advise cutting down, screen briefly, and refer if drinking is hazardous. It is the one real red flag in the visit."
        effects: { quality: +1 }
        reaction: relieved
        goto: route
      - id: b
        text: "\"A daily drink is fine, even good for your heart, so keep it up; the flushing's harmless.\""
        correct: false
        feedback: "Both halves are unsafe. Mendelian randomisation studies, which remove the bias behind the heart claim, find no benefit, and the flush is a red flag: acetaldehyde build-up that raises oesophageal-cancer risk. Never endorse drinking for the heart, and never wave away the flush."
        reaction: concerned
        goto: remedial
      - id: c
        text: "\"The heart benefit is real, so don't stop, but maybe drink a little less.\""
        correct: false
        feedback: "The 'heart benefit' claim has been overturned, so do not reinforce it. This answer also misses the flush, the important cue here (raised oesophageal-cancer risk). Drop the cardioprotection line and act on the flushing."
        reaction: concerned
        goto: remedial

  - id: route
    type: branch
    rules:
      - if: "quality >= 5"
        goto: end-good
    else: remedial

  - id: remedial
    type: info
    emotion: concerned
    title: "Right-size the advice, and catch the real red flag"
    body: |
      Most of what Rahmat expects, he does not need. A weekend run needs ordinary food and water, not
      carb-loading or shakes; about 1.2–1.6 g/kg of protein from food is plenty and safe for healthy
      kidneys; shift eating is best weighted to the daytime; and weight creep responds to small,
      steady habits, not a crash diet. The one real red flag is the alcohol: the "good for the heart" claim
      no longer holds (never endorse it), and the flush signals a raised oesophageal-cancer risk, so ask,
      advise cutting down, screen briefly, and refer if drinking is hazardous. Replay and run it through.
    next: end-partial

  - id: end-good
    type: end
    outcome: success
    title: "Right-sized, and the red flag caught"
    body: |
      You talked Rahmat out of unnecessary sports nutrition, gave him a sensible protein and shift-eating
      plan, and steered him to small, sustainable changes for the creep. On the point that mattered most,
      you did not endorse "drinking for the heart", and you acted on the flush, screening him and advising
      him to cut down. The task at this stage is to right-size the popular advice and recognise the one
      thing that matters. *(He does not need detailed sports programming at this level; hazardous
      drinking, if screening flags it, is referred to addiction services.)*
    debrief:
      objectivesMet: [1, 2, 3, 4, 5]
      keyPoints:
        - "Everyday active adults need ordinary food and water; carb-loading, sports drinks and shakes are for high endurance volume, not weekend runs."
        - "Protein ~1.2–1.6 g/kg from food is plenty (benefit plateaus); safe for healthy kidneys, the exception is kidney disease."
        - "Shift eating: weight the main meals toward the daytime; weight creep: small, steady habits over crash dieting."
        - "Current alcohol message: don't advise drinking for the heart; the ALDH2 flush is a red flag (oesophageal-cancer risk), so ask, advise, screen, refer."

  - id: end-partial
    type: end
    outcome: partial
    title: "Most of the way there"
    body: |
      You helped Rahmat but slipped on at least one point: over-fuelling a recreational runner, the protein
      or kidney message, shift-meal timing, the crash-diet trap, or, most important, the alcohol question.
      Replay and run the safe path: ordinary food and water for his runs, about 1.2–1.6 g/kg protein from
      food, daytime-weighted shift eating, small steady habits for the creep, and never endorse "drinking
      for the heart", while acting on the flush.
    debrief:
      objectivesMet: [1]
      keyPoints:
        - "Right-size fuelling: ordinary food and water for recreational training."
        - "Protein ~1.2–1.6 g/kg from food; safe for healthy kidneys (not in kidney disease)."
        - "Never advise drinking for the heart; the alcohol flush is a red flag, so ask, advise, screen, refer."
