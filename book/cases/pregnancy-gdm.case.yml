id: pregnancy-gdm
title: "Mrs Devi, 26 weeks: the test she'd rather skip"
objectives:
  - "Justify Singapore's universal GDM screening, and recognise that withholding the test from a woman who feels well is the error."
  - "Distinguish physiological haemodilution from true iron-deficiency anaemia."
  - "Respond to a GDM diagnosis with dietary first-line plus team referral, without starting insulin yourself."
  - "Explain foetal hyperinsulinaemia and its consequences, and arrange postpartum follow-up for future type 2 diabetes risk."
difficulty: intro
estimatedMinutes: 12
tags: [nutrition, pregnancy, gdm, singapore, do-no-harm]
start: intro
variables: { quality: 0 }

persona:
  name: "Mrs Devi"
  age: 31
  sex: female
  occupation: "primary-school teacher"
  presentation: "First pregnancy, 26 weeks. BMI 27, and her mother has type 2 diabetes. She feels completely well and is a little reluctant about 'yet another test'."
  voice: "Warm and busy; wants to do right by the baby but would rather skip anything that feels unnecessary."

nodes:
  - id: intro
    type: info
    emotion: neutral
    title: "\"Do I really need that glucose test?\""
    body: |
      Mrs Devi is 26 weeks into her first pregnancy and feels well. Her BMI is 27 and her mother has
      type 2 diabetes. A friend mentioned a glucose test, but Mrs Devi feels fine and would rather not
      fast for it.
    next: q-screen

  - id: q-screen
    type: mcq
    emotion: neutral
    stem: "*\"I feel perfectly well, doctor. Do I really need the glucose test?\"*"
    options:
      - id: a
        text: "\"Yes. We offer it in every pregnancy, because diabetes in pregnancy is common and feeling well doesn't rule it out.\""
        correct: true
        feedback: "Singapore screens universally: GDM is common here and usually causes no symptoms, so feeling well doesn't rule it out. In the local GUSTO cohort, testing only 'high-risk' women would have missed about half of cases, because risk factors predict GDM poorly in Asian women. Every pregnancy is offered the test at 24 to 28 weeks."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-haemo
      - id: b
        text: "\"You feel well and you're young, so let's not bother with the fasting test; we'll only test you if symptoms appear.\""
        correct: false
        feedback: "Waiting for symptoms means missing GDM, which is usually symptomless and common (about 1 in 5 locally). Withholding universal screening from a woman who feels well is the harmful choice here."
        reaction: concerned
        goto: remedial
      - id: c
        text: "\"Given your BMI and family history you're high-risk, so yes, we'll test you for that reason.\""
        correct: false
        feedback: "Testing her because of her risk factors endorses risk-based screening, which Singapore does not rely on because it would miss about half of cases. Every pregnancy is offered the test, whatever the risk profile."
        reaction: skeptical
        goto: q-haemo

  - id: q-haemo
    type: mcq
    emotion: concerned
    stem: "Her blood count shows haemoglobin has fallen from 12.5 to 10.8 g/dL since her first antenatal visit. She has no symptoms. What is the most likely explanation, and what should you do?"
    options:
      - id: a
        text: "Probably physiological dilution; check ferritin before deciding on iron."
        correct: true
        feedback: "Plasma volume expands faster than red cells, so a mid-pregnancy haemoglobin almost always falls by dilution. Confirm true iron deficiency with ferritin and pregnancy-specific cut-offs before treating, remembering that real deficiency is common here."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-result
      - id: b
        text: "Clear iron-deficiency anaemia; start high-dose iron straight away."
        correct: false
        feedback: "The dilutional fall is expected, so a low haemoglobin alone does not prove deficiency; check ferritin first. If she is truly deficient, counsel iron with a vitamin-C source, away from tea and calcium, and consider alternate-day dosing for tolerability."
        goto: q-result
      - id: c
        text: "A dangerous drop; arrange an urgent transfusion."
        correct: false
        feedback: "A fall to about 10.8 g/dL in mid-pregnancy is common and usually dilutional, and it does not call for a transfusion. Check ferritin first."
        goto: q-result

  - id: q-result
    type: mcq
    emotion: concerned
    stem: "Her glucose test comes back positive for gestational diabetes, and she's anxious. What should you do first?"
    options:
      - id: a
        text: "Reassure her, start dietary changes within her usual meals, and bring in the antenatal team."
        correct: true
        feedback: "First-line management is dietary, delivered with the team (obstetrician, dietitian, diabetes nurse), and it works best within familiar food: brown rice or wholegrain *bee hoon* for white rice, and water or a Nutri-Grade A/B drink for the sweet one. In a local cohort, women eating a seafood-and-noodle pattern were less likely to have GDM. Your part is to reassure, guide swaps and refer."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-chain
      - id: b
        text: "Start her on insulin now and set her daily glucose targets yourself."
        correct: false
        feedback: "Reaching for insulin at a first consult over-reaches: insulin and glucose targets are decided by the obstetric and diabetes team, by referral, when diet isn't enough. Dietary management comes first."
        goto: q-chain
      - id: c
        text: "Tell her it's mild and nothing to worry about, and carry on as normal."
        correct: false
        feedback: "GDM does need action: untreated, it raises the risk of a large baby and of a difficult delivery (shoulder dystocia). Dietary first-line plus team referral is the response."
        goto: q-chain

  - id: q-chain
    type: mcq
    emotion: neutral
    stem: "*\"Why would my baby have low blood sugar right after birth if it's my sugar that's high?\"*"
    options:
      - id: a
        text: "\"Your sugar raises the baby's insulin, which stays high after birth and lowers the baby's sugar.\""
        correct: true
        feedback: "Maternal glucose crosses to the baby and stimulates the baby's pancreas to make extra insulin; after birth the glucose supply stops but the insulin lingers, so the baby's glucose dips. Macrosomia and neonatal hypoglycaemia are two consequences of this one mechanism, and the answer puts it in plain words, without jargon."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-postpartum
      - id: b
        text: "\"The baby has inherited diabetes from you, so it can't control its sugar.\""
        correct: false
        feedback: "The low sugar is transient: the baby's own insulin, raised in response to the mother's glucose, stays high briefly after delivery and lowers the baby's glucose. It is not inherited diabetes."
        goto: q-postpartum
      - id: c
        text: "\"Because the baby is small and underfed, it runs out of sugar after birth.\""
        correct: false
        feedback: "These babies are usually large, and the hypoglycaemia comes from their own high insulin after the maternal glucose supply is cut."
        goto: q-postpartum

  - id: q-postpartum
    type: mcq
    emotion: neutral
    stem: "*\"So once the baby is born, this all just goes away, right?\"*"
    options:
      - id: a
        text: "\"It usually settles, but your diabetes risk stays raised: a test at 6 to 12 weeks, then regular checks.\""
        correct: true
        feedback: "GDM usually resolves, but it signals a roughly seven-fold future risk of type 2 diabetes, so postpartum testing at 6 to 12 weeks and screening every 1 to 3 years matter. This is the direct tie to Singapore's War on Diabetes."
        effects: { quality: +1 }
        reaction: relieved
        goto: route
      - id: b
        text: "\"Yes, once the baby's out it's completely gone, no follow-up needed.\""
        correct: false
        feedback: "The high sugar usually settles, but GDM predicts future type 2 diabetes, so she needs a postpartum glucose test and ongoing screening. Skipping follow-up misses a prevention window."
        goto: route
      - id: c
        text: "\"No, you have diabetes for life now and will need medication from here on.\""
        correct: false
        feedback: "Overstated and frightening: GDM usually resolves after delivery. The message is future *risk*, managed with follow-up testing and lifestyle."
        goto: route

  - id: route
    type: branch
    rules:
      - if: "quality >= 5"
        goto: end-good
    else: remedial

  - id: remedial
    type: info
    emotion: concerned
    title: "Screen everyone, interpret the blood count, refer, follow up"
    body: |
      Offer the test to every pregnancy, because feeling well doesn't rule
      GDM out and risk-based screening misses about half of local cases. Read a mid-pregnancy
      haemoglobin fall as likely dilution, but confirm with ferritin. Meet a positive result with
      dietary first-line plus the team, and leave insulin to them. Explain the baby's transient
      low sugar as the effect of foetal insulin. Arrange postpartum follow-up for the future
      type 2 diabetes risk.

      Replay and take the safe path.
    next: end-partial

  - id: end-good
    type: end
    outcome: success
    title: "Anticipate, screen, recognise, refer"
    body: |
      You offered the test even though she felt well and would rather have skipped it, read the falling haemoglobin
      correctly, met the diagnosis with dietary first-line plus the team,
      explained the baby's low sugar in plain language, and flagged the postpartum follow-up that links
      gestational diabetes to future type 2 diabetes. That is the role at this stage: anticipate, screen,
      recognise and refer. *(Insulin, glucose targets and detailed management are decided by the obstetric and
      diabetes team.)*
    debrief:
      objectivesMet: [1, 2, 3, 4]
      keyPoints:
        - "Singapore screens every pregnancy for GDM at 24–28 weeks: risk-based screening would miss about half of local cases, and feeling well doesn't rule it out."
        - "A mid-pregnancy haemoglobin fall is usually dilutional; confirm true iron deficiency with ferritin before treating, and counsel iron for tolerability (vitamin C, away from tea/calcium, alternate-day)."
        - "A GDM diagnosis: reassure, dietary first-line within familiar food, refer to the team, and don't start insulin yourself."
        - "Explain the consequences of foetal hyperinsulinaemia (macrosomia, then neonatal hypoglycaemia), and arrange postpartum glucose testing for the roughly seven-fold future type 2 diabetes risk."

  - id: end-partial
    type: end
    outcome: partial
    title: "Most of the way there"
    body: |
      You helped Mrs Devi but slipped on at least one point: offering universal screening, reading the
      haemoglobin, the first step after diagnosis, the baby's low sugar, or the postpartum follow-up.
      Replay and take the safe path: screen everyone, confirm anaemia before treating, dietary first-line
      plus refer, and postpartum testing.
    debrief:
      objectivesMet: [1]
      keyPoints:
        - "Offer GDM screening to every pregnancy; feeling well doesn't rule it out."
        - "Read a mid-pregnancy haemoglobin fall as likely dilution; confirm with ferritin."
        - "GDM: dietary first-line + team referral; don't titrate insulin yourself."
        - "Explain the baby's transient low sugar (foetal insulin) and arrange postpartum follow-up."
