id: infancy-feeding
title: "Baby Aidan: a new-parent feeding clinic"
objectives:
  - "Advise on starting solids around 6 months (readiness cues, iron-rich first foods) and correct over-rigid readings of the guideline."
  - "Counsel early, not delayed, allergen introduction, and refer high-risk infants."
  - "Apply the infant food-safety do-no-harm rules: no honey before 12 months; cow's milk as a main drink only from ~12 months."
  - "Reassure non-judgementally on formula (premium and toddler milks are unnecessary) and name the one routine supplement (vitamin D)."
difficulty: intro
estimatedMinutes: 12
tags: [nutrition, infancy, weaning, allergy, singapore, do-no-harm]
start: intro
variables: { quality: 0 }

persona:
  name: "Baby Aidan (mother Wei Ling)"
  age: 0
  sex: male
  occupation: "5-month-old; mother is a first-time parent"
  presentation: "A thriving, exclusively breastfed 5-month-old at a routine visit. His mother has read online that starting solids and peanut early cause allergies; his grandmother wants to add honey to his porridge; a neighbour suggests switching to fresh cow's milk and a premium formula 'for extra nutrients'."
  voice: "Anxious first-time mother, trying to do everything right, pulled between online advice and family tradition."

nodes:
  - id: intro
    type: info
    emotion: concerned
    title: "\"I just want to get it right\""
    body: |
      Aidan is 5 months old, breastfed, and growing well. His mother Wei Ling has a list of worries from
      the internet and from family: when to start solids, whether to delay allergens, her mother-in-law's
      honey, and a neighbour's advice to switch to cow's milk and a premium formula. Help her sort the
      evidence from the tradition, kindly.
    next: q-solids

  - id: q-solids
    type: mcq
    emotion: concerned
    stem: "*\"When should I start solids, and with what? I read I should wait for exactly 6 months.\"*"
    options:
      - id: a
        text: "\"You can start in a few weeks once he's ready, beginning with iron-rich foods, and keep breastfeeding.\""
        correct: true
        feedback: "'About 6 months' has a 4-month floor for the ready baby (readiness cues: sitting with support, good head control, reaching for food). First foods should be iron-rich (iron-fortified cereal, minced meat, egg) because his iron stores are running low. Watch the baby, not the calendar."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-allergen
      - id: b
        text: "\"Wait strictly until he's exactly 6 months, and don't give anything before then whatever happens.\""
        correct: false
        feedback: "A fixed date is more rigid than the guideline: 'about 6 months' is a range with a 4-month floor, so solids (including allergens) can begin from 4 months in a developmentally ready infant. Readiness cues matter more than the date."
        goto: q-allergen
      - id: c
        text: "\"Start with fruit purée, since babies like sweet tastes and it's gentle.\""
        correct: false
        feedback: "His iron stores are depleting, so first foods should be iron-rich; fruit purée misses that point and also nudges a sweet preference."
        goto: q-allergen

  - id: q-allergen
    type: mcq
    emotion: concerned
    stem: "*\"But if I give peanut or egg early, won't that cause allergies? I was going to wait until he's 1.\"*"
    options:
      - id: a
        text: "\"Introducing them early, once solids start, lowers the risk. Try smooth peanut butter and well-cooked egg.\""
        correct: true
        feedback: "Early oral exposure builds tolerance, and the LEAP and EAT trials reversed the old advice to delay; delaying now increases risk. Peanut goes in as smooth peanut butter, never whole nuts (a choking hazard). If a baby has severe eczema or egg allergy, refer for specialist-guided peanut introduction; the ~80% risk reduction comes from these high-risk infants."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-honey
      - id: b
        text: "\"Yes, best to be safe: avoid all peanut and egg until he's at least 12 months.\""
        correct: false
        feedback: "Delaying allergens was the advice for years, and the trials reversed it: delay increases allergy risk, and early introduction once solids start is protective."
        goto: q-honey
      - id: c
        text: "\"Give him whole peanuts and a boiled egg daily starting now.\""
        correct: false
        feedback: "The timing is right but the form is not: whole peanuts are a choking hazard. Use smooth peanut butter and well-cooked egg."
        goto: q-honey

  - id: q-honey
    type: mcq
    emotion: concerned
    stem: "*\"My mother-in-law wants to stir a little honey into his porridge, for energy and taste. That's harmless, right?\"*"
    options:
      - id: a
        text: "\"Please hold off on honey until he's 12 months; after his first birthday it's fine.\""
        correct: true
        feedback: "Honey can carry spores that cause infant botulism: the immature gut lacks the protective gut microbes that would stop them colonising and making toxin. Explaining the 'why' kindly helps the grandmother come along."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-milk
      - id: b
        text: "\"A small amount of honey is fine, since it's natural and just for taste and energy.\""
        correct: false
        feedback: "Even small amounts of honey can cause infant botulism before 12 months, a serious and avoidable harm, so the no-honey rule holds however well-meant the tradition."
        reaction: concerned
        goto: remedial
      - id: c
        text: "\"Only manuka honey is risky; ordinary honey is fine.\""
        correct: false
        feedback: "All honey can carry the spores, so the rule covers honey of any kind before 12 months. Endorsing any honey for an infant breaks a do-no-harm rule."
        reaction: concerned
        goto: remedial

  - id: q-milk
    type: mcq
    emotion: neutral
    stem: "*\"And should I switch him to fresh cow's milk, or the premium formula my neighbour uses, for extra nutrients?\"*"
    options:
      - id: a
        text: "\"Keep breast milk or ordinary formula as his main drink until about 12 months, and skip the premium one.\""
        correct: true
        feedback: "Cow's milk before ~12 months is iron-poor and can cause gut blood loss, so it waits as the *main drink* (yoghurt and cheese as foods are fine now). Every formula sold here meets the same standard, so premium and toddler milks are marketing, not nutrition, and a cheaper standard formula is equivalent."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-supplement
      - id: b
        text: "\"Fresh cow's milk is fine now as his main drink; it's healthy and full of calcium.\""
        correct: false
        feedback: "As his *main drink*, cow's milk comes too early: it is iron-poor and causes occult gut blood loss in infancy, risking iron deficiency. Keep breast milk or formula as the drink until ~12 months (dairy foods are fine)."
        goto: q-supplement
      - id: c
        text: "\"Yes, switch to the premium formula, since the extra ingredients are worth it.\""
        correct: false
        feedback: "All infant formula sold in Singapore meets identical standards; 'premium' reflects marketing and price, not better nutrition. Reassure her a standard brand is equivalent."
        goto: q-supplement

  - id: q-supplement
    type: mcq
    emotion: neutral
    stem: "*\"Is there any supplement he actually needs?\"*"
    options:
      - id: a
        text: "\"Yes: vitamin D, 400 units a day, because breast milk is low in it.\""
        correct: true
        feedback: "Vitamin D is the one routine daily supplement for a breastfed baby. (He also had his vitamin K injection at birth, and he'll get iron from those iron-rich first foods.) It matters here despite the sunshine, because infants are rightly kept out of direct sun."
        effects: { quality: +1 }
        reaction: relieved
        goto: route
      - id: b
        text: "\"Iron drops every day from birth.\""
        correct: false
        feedback: "His stores last ~6 months, and iron then comes from iron-rich solids, not drops from birth. The routine daily supplement is vitamin D."
        goto: route
      - id: c
        text: "\"None, since it's sunny in Singapore and he'll make plenty of vitamin D.\""
        correct: false
        feedback: "Infants are rightly kept out of direct sun, and breast milk is low in vitamin D, so a breastfed baby needs 400 IU/day regardless of the climate."
        goto: route

  - id: route
    type: branch
    rules:
      - if: "quality >= 5"
        goto: end-good
    else: remedial

  - id: remedial
    type: info
    emotion: concerned
    title: "Evidence over tradition, kindly"
    body: |
      The safe path has five parts. Solids start at about 6 months (readiness cues, 4-month floor),
      with iron-rich first foods. Allergens go in early, not late; refer the high-risk infant.
      **No honey before 12 months** (infant botulism); never endorse it, however well-meant the
      offer. Breast milk or formula stays the main drink until ~12 months; reassure her that premium
      and toddler milks are unnecessary. Vitamin D 400 IU/day is the one routine supplement.

      And always recognise a baby whose growth is faltering, and refer. Replay and run the safe path.
    next: end-partial

  - id: end-good
    type: end
    outcome: success
    title: "Evidence sorted from tradition"
    body: |
      You started Aidan on solids at the right time with the right (iron-rich) foods, turned the
      allergen worry around, held the line on honey without alienating the grandmother, kept cow's milk
      and premium formula in their place, and named the one supplement that matters. The work at this
      stage is to anticipate the real needs, correct tempting traditions kindly and know when to refer.
    debrief:
      objectivesMet: [1, 2, 3, 4]
      keyPoints:
        - "Start solids ~6 months (readiness cues; 4-month floor) with iron-rich first foods: the iron clock sets the default, and readiness, not the calendar, sets each baby's start."
        - "Introduce allergens (smooth peanut, well-cooked egg) early once solids begin; delaying increases risk. Refer high-risk infants for guided peanut introduction."
        - "Do-no-harm rules: no honey before 12 months (botulism); cow's milk as a main drink only from ~12 months; no added salt or sugar; mind food form for choking."
        - "Formula is safe, and premium and toddler milks are unnecessary; the one routine supplement is vitamin D 400 IU/day. Recognise faltering growth and refer."

  - id: end-partial
    type: end
    outcome: partial
    title: "Most of the way there"
    body: |
      You helped Wei Ling but slipped on at least one point: when and what to start, the allergen
      reversal, the honey rule, the cow's-milk and formula question, or the vitamin D supplement. Replay
      and run the safe path: iron-rich solids ~6 months, allergens early, no honey under 1, breast milk
      or formula as the main drink to ~12 months, and vitamin D 400 IU/day.
    debrief:
      objectivesMet: [1]
      keyPoints:
        - "Solids ~6 months, iron-rich first foods; watch readiness as well as the date."
        - "Introduce allergens early, not late; refer the high-risk infant."
        - "No honey before 12 months; cow's milk as main drink only from ~12 months."
        - "Premium and toddler milks are unnecessary; vitamin D 400 IU/day is the routine supplement."
