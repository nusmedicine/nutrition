id: two-kopi-a-day
title: "The two kopi gao a day"
objectives:
  - "Open a change conversation with permission and reflective listening, resisting the righting reflex."
  - "Evoke and reinforce change talk, then co-write one small, owned SMART goal with an if-then plan."
  - "Recognise a disordered-eating red flag and respond safely (pause the goal, screen, refer) without reinforcing restriction."
difficulty: intro
estimatedMinutes: 10
tags: [nutrition, counselling, motivational-interviewing, singapore, safety]
start: intro
variables: { quality: 0 }

persona:
  name: "Mr Tan"
  age: 52
  sex: male
  occupation: "taxi driver"
  presentation: "Borderline HbA1c on a health screen. Drinks two or three sweet kopi gao a day plus a packet drink, mostly to get through long shifts. Feels well and isn't asking to change anything. Friendly but a bit defensive about his one daily pleasure."
  voice: "Warm, tired, proud of his independence; bristles at being told what to do; opens up when listened to."

nodes:
  - id: intro
    type: info
    emotion: neutral
    title: "\"I feel fine, doctor\""
    body: |
      Mr Tan's screening HbA1c is borderline. He drinks two or three sweet kopi gao a day and a packet
      drink, and he isn't asking to change: the kopi is what gets him through twelve-hour shifts. You
      have a few minutes. Start a change he'll own, and stay alert for the point where pushing would
      do harm.
    next: q-open

  - id: q-open
    type: mcq
    emotion: skeptical
    stem: "*\"The kopi is my only pleasure driving all day.\"* How do you open?"
    options:
      - id: a
        text: "\"It keeps you going, and it sounds like the sugar worries you a bit. OK to talk?\""
        correct: true
        feedback: "Reflecting both sides and asking permission lets you resist the urge to fix, so he stays engaged instead of defending himself."
        effects: { quality: +1 }
        reaction: neutral
        goto: q-changetalk
      - id: b
        text: "\"You really need to stop the sugar; it's what's pushing your blood sugar up.\""
        correct: false
        feedback: "Jumping to fix is the righting reflex. The warning is true, but it makes him defensive ('everyone says that') and he digs in. Reflect and ask permission first."
        goto: q-changetalk
      - id: c
        text: "\"Let me tell you everything that can go wrong with diabetes.\""
        correct: false
        feedback: "A lecture is the righting reflex in its purest form: it provokes resistance and shuts down the conversation before it starts."
        goto: q-changetalk

  - id: q-changetalk
    type: mcq
    emotion: concerned
    stem: "He softens: *\"My father had diabetes. Lost his foot in the end. I don't want that, but the kopi's such a habit.\"* What do you say?"
    options:
      - id: a
        text: "\"That shows how much your family matters. Seeing your dad makes this feel real.\""
        correct: true
        feedback: "An affirmation plus a reflection catches his change talk and strengthens it, and he offers even more ('my daughter's getting married next year')."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-goal
      - id: b
        text: "\"Exactly, so you must cut it out now, before it's too late.\""
        correct: false
        feedback: "He just handed you real motivation and the righting reflex buries it. Rushing to instruct flips him from 'I want to' back to 'don't push me'."
        goto: q-goal
      - id: c
        text: "\"Do you know your latest HbA1c number?\""
        correct: false
        feedback: "Not wrong, but a data question pulls the conversation back to numbers just as he opens up emotionally. Reflect or affirm first; the number can wait."
        goto: q-goal

  - id: q-goal
    type: mcq
    emotion: neutral
    stem: "*\"Maybe I could cut down a bit. But I don't know if I can. It's just what I do.\"* How do you help him set a goal?"
    options:
      - id: a
        text: "\"What's one small change you think you could actually stick to?\""
        correct: true
        feedback: "Letting him choose the change gives a small, owned goal, which you then shape into a SMART goal with an if-then plan for the obstacle (kopi siu dai on workday mornings; if the auntie forgets, he'll remind her)."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-safety
      - id: b
        text: "\"Good. From tomorrow, no more kopi: plain water all day.\""
        correct: false
        feedback: "A total ban is too big, and it is imposed by you, not chosen by him, so he'll abandon it within a week. Aim for one small change he owns."
        goto: q-safety
      - id: c
        text: "\"Don't worry about it. Just try your best.\""
        correct: false
        feedback: "Vague reassurance lets the moment slip. He was ready to plan something concrete, so this is the point to co-write one small, specific goal and arrange follow-up."
        goto: q-safety

  - id: q-safety
    type: mcq
    emotion: concerned
    stem: "As you finish, he adds: *\"Some days I just skip meals completely to make up for the kopi and snacks. And I feel bad about eating.\"* What now?"
    options:
      - id: a
        text: "Pause the kopi goal, ask gently about the skipping and consider referral."
        correct: true
        feedback: "Skipping meals to 'make up' and guilt around eating are red flags. On average, structured behavioural weight management does not increase eating-disorder symptoms, but for this patient another restriction could do harm, so screen gently and refer instead of pushing the goal."
        effects: { quality: +1 }
        reaction: relieved
        goto: route
      - id: b
        text: "\"That's good discipline. Skipping meals will help you cut down even faster.\""
        correct: false
        feedback: "Praising meal-skipping reinforces restriction in someone showing disordered-eating red flags, which is the harm to avoid. Recognise the signal and switch to support and referral."
        goto: remedial
      - id: c
        text: "Brush past it and confirm the kopi goal: one thing at a time."
        correct: false
        feedback: "Letting this pass is a do-no-harm failure. Compensatory meal-skipping and guilt outrank the kopi goal, so pause it and address them."
        goto: remedial

  - id: route
    type: branch
    rules:
      - if: "quality >= 3"
        goto: end-good
    else: remedial

  - id: remedial
    type: info
    emotion: concerned
    title: "Start the change, and do no harm"
    body: |
      Resist the righting reflex (reflect and ask, don't fix), draw out and affirm his own reasons,
      and help him choose one small, owned goal with an if-then plan. The moment food talk turns to
      compensatory skipping and guilt, **stop pressing and refer**. Replay and take the path that
      starts a change without causing harm.
    next: end-partial

  - id: end-good
    type: end
    outcome: success
    title: "One small change he owns"
    body: |
      You opened with a reflection and permission instead of a lecture, caught and strengthened his
      change talk, and helped him choose one small SMART goal (kopi siu dai on workday mornings, with
      an if-then plan) rather than imposing a ban. And when he revealed compensatory meal-skipping and
      guilt, you recognised the red flag and shifted to support and referral instead of reinforcing
      restriction. (Whole consultations with a live simulated patient are practised in the
      *Everyday and preventive counselling* chapter.)
    debrief:
      objectivesMet: [1, 2, 3]
      keyPoints:
        - "Resist the righting reflex: reflect, affirm and ask permission, and let the patient voice their own reasons to change."
        - "Co-write one small, owned SMART goal with an if-then plan; a small, chosen goal works better than a large, imposed one."
        - "Do no harm: compensatory meal-skipping and guilt are eating-disorder red flags, so pause the goal, screen and refer; never reinforce restriction."

  - id: end-partial
    type: end
    outcome: partial
    title: "Most of the way"
    body: |
      You worked with Mr Tan but slipped on at least one turn: lecturing instead of listening,
      imposing a goal instead of evoking one, or missing the red flag. Replay and run the safe path:
      reflect and ask, affirm his change talk, co-set one small owned goal, and step back to refer when
      restriction and guilt appear.
    debrief:
      objectivesMet: [1]
      keyPoints:
        - "Reflect and ask permission; don't fix or lecture."
        - "Evoke change talk, then co-set one small, owned goal with an if-then plan."
        - "Compensatory meal-skipping and guilt are red flags: screen and refer, and don't reinforce restriction."
