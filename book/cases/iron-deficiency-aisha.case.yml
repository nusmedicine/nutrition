id: iron-deficiency-aisha
title: "\"Tired all the time\""
objectives:
  - "Recognise the classic pattern of iron-deficiency anaemia."
  - "Identify the at-risk group and the likely underlying cause."
  - "Give food-first advice and explain why the cause of the iron loss matters."
difficulty: intro
estimatedMinutes: 8
tags: [nutrition, micronutrients, iron, anaemia, recognition]
start: intro
variables: { quality: 0 }

persona:
  name: "Aisha"
  age: 24
  sex: female
  occupation: "polytechnic graduate, new office job"
  sprite: /figures/personas/aisha
  presentation: "Three months of fatigue and breathlessness climbing stairs. On gentle questioning: heavy periods ('I change protection very often') and a mostly noodle-and-bread diet with little red meat."
  voice: "Plays down her symptoms, busy, assumes she is 'just stressed and not sleeping enough'."

nodes:
  - id: intro
    type: info
    emotion: concerned
    title: "More than just tired"
    body: |
      Aisha, 24, has felt **tired for three months** and gets **breathless climbing
      stairs**. She looks a little pale. On gentle questioning, she mentions **heavy
      periods** (*"I change protection very often"*) and a diet built around **noodles
      and bread**, with little red meat.
    next: q-notice

  - id: q-notice
    type: mcq
    stem: "What do you notice first?"
    options:
      - id: a
        text: "Pallor plus heavy menstrual bleeding."
        correct: true
        feedback: "Fatigue, pallor, exertional breathlessness and heavy periods are the classic picture of iron deficiency."
        effects: { quality: +1 }
        goto: reveal-group
      - id: b
        text: "Probably stress and overwork, so reassure her."
        correct: false
        feedback: "Stress is plausible on the surface, but it ignores a classic, recognisable pattern with a treatable cause."
        goto: reveal-group
      - id: c
        text: "She needs an urgent blood transfusion now."
        correct: false
        feedback: "Transfusion would be over-escalation, and it is not the call to make here. Recognise the pattern and take the appropriate next step."
        goto: reveal-group

  - id: reveal-group
    type: info
    emotion: concerned
    title: "The at-risk group"
    body: |
      Aisha sits squarely in the **classic at-risk group**: menstruating women. Globally,
      nearly **one in three** women aged 15–49 are anaemic, with iron
      deficiency the most common nutritional cause, and heavy menstrual bleeding is a major driver. The cause matters
      as much as the iron itself.
    next: q-diet

  - id: q-diet
    type: mcq
    stem: "Her diet is mostly noodles and bread with little meat. Why does that matter for her iron?"
    options:
      - id: a
        text: "Plant (non-haem) iron is absorbed less well than haem iron."
        correct: true
        feedback: "Non-haem iron, from plants, is poorly and variably absorbed, whereas the haem iron in meat and fish is well absorbed, so a meat-light diet is a genuine risk factor."
        effects: { quality: +1 }
        goto: q-absorption
      - id: b
        text: "Plant foods contain no iron at all, so she is getting none."
        correct: false
        feedback: "Plants do contain iron, in the non-haem form; the problem is that it is absorbed less efficiently."
        goto: q-absorption
      - id: c
        text: "Refined bread and noodles are actually rich in well-absorbed iron."
        correct: false
        feedback: "Refined staples are low in bioavailable iron; the well-absorbed haem form comes from meat and fish, which she eats little of."
        goto: q-absorption

  - id: q-absorption
    type: mcq
    stem: "Alongside more iron-rich foods, which simple dietary tip helps her absorb iron?"
    options:
      - id: a
        text: "Pair iron-rich foods with a vitamin C source, such as fruit."
        correct: true
        feedback: "Vitamin C increases the absorption of non-haem (plant) iron, so fruit or vegetables with an iron-rich meal help."
        effects: { quality: +1 }
        goto: q-action
      - id: b
        text: "Take the iron-rich meal with strong tea or coffee."
        correct: false
        feedback: "Tannins in tea and coffee reduce non-haem iron absorption, so these drinks are better taken between meals."
        goto: q-action
      - id: c
        text: "Avoid all vegetables, as they block iron."
        correct: false
        feedback: "Vegetables do not block iron: their vitamin C helps absorption, and they provide some iron themselves."
        goto: q-action

  - id: q-action
    type: mcq
    stem: "Why do her heavy periods matter as much as her diet?"
    options:
      - id: a
        text: "They are the ongoing source of her iron loss."
        correct: true
        feedback: "Heavy menstrual bleeding keeps draining iron, so better food alone may not keep up; the cause of the loss needs attention as well as the intake."
        effects: { quality: +1 }
        goto: route
      - id: b
        text: "They stop mattering once she eats more meat."
        correct: false
        feedback: "More iron-rich food helps, but if the heavy bleeding continues she keeps losing iron; the cause needs attention too."
        goto: route
      - id: c
        text: "They only matter if she becomes pregnant."
        correct: false
        feedback: "Heavy periods matter now: monthly blood loss is a major driver of iron deficiency in women of reproductive age."
        goto: route

  - id: route
    type: branch
    rules:
      - if: "quality >= 3"
        goto: end-good
    else: remedial

  - id: remedial
    type: info
    emotion: concerned
    title: "Back to the pattern"
    body: |
      For a recognisable deficiency, the sequence is: **recognise the pattern, name the
      at-risk group, give food-first advice and look at the cause of the iron loss**. Here
      that cause is her heavy periods, which better food alone cannot fix.
    next: end-partial

  - id: end-good
    type: end
    outcome: success
    title: "Recognise and refer"
    body: |
      You recognised iron-deficiency anaemia, placed Aisha in the classic at-risk group,
      gave practical food-first advice, and saw that her heavy periods need attention too;
      she will need testing and a referral for that. (For when and how to refer, see the
      *Interprofessional Practice & Referral* chapter.)
    debrief:
      objectivesMet: [1, 2, 3]
      keyPoints:
        - "Fatigue, pallor, breathlessness and heavy periods suggest iron deficiency."
        - "Menstruating women are the classic at-risk group; address the cause of the iron loss as well as the iron."
        - "At this stage the task is to recognise, give food-first advice and refer for investigation and treatment."
      references: ["@stevens2022anaemia"]

  - id: end-partial
    type: end
    outcome: partial
    title: "Nearly there"
    body: |
      You engaged with the case, but some steps were off target.
      Replay and aim for the sequence: recognise the pattern, name the at-risk group,
      give food-first advice and look at the cause of the iron loss.
    debrief:
      objectivesMet: [1]
      keyPoints:
        - "Match the pattern to the likely deficiency before acting."
        - "Food-first advice (iron-rich foods with vitamin C) is within scope; dosing is not."
        - "Recognise and refer; do not over- or under-treat."
