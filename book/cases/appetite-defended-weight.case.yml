id: appetite-defended-weight
title: "Why did it come back?"
objectives:
  - "Recognise weight regain as the predicted output of a biologically defended system, not a willpower failure."
  - "Name the three arms of the regain response: falling leptin, rising hunger hormones, adaptive thermogenesis."
  - "Explain it to a patient without blame, and answer the 'is my metabolism damaged?' question accurately."
difficulty: intro
estimatedMinutes: 7
tags: [nutrition, appetite, weight-regulation, defended-weight, non-stigmatising, recognition]
start: intro
variables: { quality: 0 }

persona:
  name: "Mr Chua"
  age: 46
  sex: male
  occupation: "office manager"
  presentation: "Lost 12 kg last year on a strict diet, felt great, then regained 9 kg over the following year despite 'eating less than before'. He's discouraged and blames his own willpower."
  voice: "Deflated and self-critical; assumes the regain is his personal failure."

nodes:
  - id: intro
    type: info
    title: "\"I just don't have the willpower\""
    body: |
      Mr Chua, 46, lost 12 kg last year on a strict diet and felt great. Over the following
      year he regained 9 kg, despite, he says, *"eating less than before"*. He's convinced
      it's a personal failure of willpower and is close to giving up. Before any advice about
      diet, name what his body has been doing.
    next: q-why

  - id: q-why
    type: mcq
    stem: "What is the best explanation for his regain?"
    options:
      - id: a
        text: "His body defended its weight and pushed to regain the fat."
        correct: true
        feedback: "Body weight is actively defended, and the defence fights weight loss hard. Regain is the predicted output of a regulated system: biology reasserting itself, not a moral failing."
        effects: { quality: +1 }
        goto: q-arms
      - id: b
        text: "He simply lacks the discipline to maintain the diet."
        correct: false
        feedback: "Blaming discipline misses what happened: his body mounted a coordinated biological response to the weight loss, and discipline alone is fighting physiology."
        goto: q-arms
      - id: c
        text: "The weight he lost was only water, so it came back on its own."
        correct: false
        feedback: "Real fat was lost. The regain is driven by a defended system, not by water shifts."
        goto: q-arms

  - id: q-arms
    type: mcq
    stem: "Which set of changes drives the regain after weight loss?"
    options:
      - id: a
        text: "Leptin falls, hunger hormones rise and energy expenditure drops."
        correct: true
        feedback: "Three coordinated arms push to reclaim the lost fat: falling leptin makes the brain read 'starving', hunger-hormone shifts persist for a year or more, and expenditure drops more than the smaller body predicts (adaptive thermogenesis)."
        effects: { quality: +1 }
        goto: q-damaged
      - id: b
        text: "Leptin rises and suppresses appetite, so regain is simply overeating."
        correct: false
        feedback: "After weight loss leptin falls (there is less fat), and the brain reads the fall as starvation, which drives hunger up, not down."
        goto: q-damaged
      - id: c
        text: "Nothing measurable changes; the body treats all weights the same."
        correct: false
        feedback: "Leptin, hunger hormones and energy expenditure all shift together after weight loss to defend the prior weight."
        goto: q-damaged

  - id: q-damaged
    type: mcq
    stem: "Mr Chua asks, \"So dieting permanently wrecked my metabolism?\" Your best answer?"
    options:
      - id: a
        text: "No, it slows only a little, and mostly recovers."
        correct: true
        feedback: "Metabolic adaptation is real but modest and largely reversible. It makes maintenance harder, but it does not make weight loss impossible or his metabolism 'broken'. The 'permanent damage' story comes from an extreme outlier study and is better explained by sustained activity than by damage."
        effects: { quality: +1 }
        goto: q-say
      - id: b
        text: "Yes, it is permanently lower, so losing weight is now impossible."
        correct: false
        feedback: "This overstates the effect and would demoralise him. Adaptation is modest and largely reversible in ordinary dieters; the large, lasting drop behind that claim comes from an extreme outlier (the Biggest Loser study)."
        goto: q-say
      - id: c
        text: "No, metabolism never adapts to weight loss at all."
        correct: false
        feedback: "Adaptive thermogenesis is real: expenditure does drop more than body size predicts. It is modest and largely reversible, not permanent damage."
        goto: q-say

  - id: q-say
    type: mcq
    stem: "How should you frame this for Mr Chua?"
    options:
      - id: a
        text: "Explain the regain as biology, not weakness; change environment and habits."
        correct: true
        feedback: "Moving from willpower to the environment and habits (protein, fibre, sleep, portion defaults) is practical and avoids blame. For a strongly defended weight, specialist help or medication is legitimate, not a moral failing."
        effects: { quality: +1 }
        goto: route
      - id: b
        text: "Tell him he just needs to try harder and show more willpower next time."
        correct: false
        feedback: "Urging more willpower ignores the physiology and reinforces the stigma; willpower alone is fighting a defended system."
        goto: route
      - id: c
        text: "Tell him weight is entirely genetic and nothing he does will matter."
        correct: false
        feedback: "Genetic fatalism swaps one unhelpful message for another: the environment and habits do matter, and a defended weight can be worked with and, for some, medically supported."
        goto: route

  - id: route
    type: branch
    rules:
      - if: "quality >= 3"
        goto: end-good
    else: remedial

  - id: remedial
    type: info
    title: "The defended-weight message"
    body: |
      The core idea: body weight is **biologically defended**, and the defence fights weight loss
      hard. After Mr Chua lost fat, leptin fell (the brain read starvation), hunger hormones rose
      and stayed raised for a year, and energy expenditure dropped more than his smaller body
      predicted. Regain is the predicted output of that system, not a willpower failure. His
      metabolism is not "permanently wrecked" either: adaptation is real but modest and largely
      reversible. The useful move is to change the environment and habits, without blame.
    next: end-partial

  - id: end-good
    type: end
    outcome: success
    title: "Biology, not blame"
    body: |
      You reframed Mr Chua's regain as a defended system doing what it evolved to do (falling
      leptin, rising hunger hormones and adaptive thermogenesis, all pushing to reclaim lost fat)
      instead of a personal failure. You answered the "damaged metabolism" question accurately
      (real but modest and largely reversible), and shifted the plan from willpower to
      environment, habits and, where the biology is strongly defended, legitimate medical support.
    debrief:
      objectivesMet: [1, 2, 3]
      keyPoints:
        - "Weight regain is the predicted output of a biologically defended system, not a willpower failure."
        - "Three arms drive it: leptin falls, hunger hormones rise (for a year or more), and energy expenditure drops (adaptive thermogenesis)."
        - "Metabolic adaptation is real but modest and largely reversible: reframe from blame to environment, habits and, where needed, medical support."

  - id: end-partial
    type: end
    outcome: partial
    title: "Nearly there"
    body: |
      You worked through it, but the framing slipped. The take-home: Mr Chua's regain is biology,
      not weakness: a defended system (leptin down, hunger hormones up, expenditure down) pushing
      to reclaim lost fat. His metabolism isn't permanently damaged. Replay and focus on explaining
      it without blame.
    debrief:
      objectivesMet: [1]
      keyPoints:
        - "Regain reflects a defended system, not a lack of willpower."
        - "Name the three arms: leptin down, hunger hormones up, adaptive thermogenesis."
        - "Metabolic adaptation is modest and largely reversible: reframe from blame to environment and habits."
