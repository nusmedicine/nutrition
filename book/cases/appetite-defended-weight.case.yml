id: appetite-defended-weight
title: "Why did it come back?"
objectives:
  - "Recognise weight regain as the predicted outcome of body-weight regulation."
  - "Name the three arms of the regain response: falling leptin, rising hunger hormones, adaptive thermogenesis."
  - "Explain it to a patient without blame, and answer the 'is my metabolism damaged?' question accurately."
difficulty: intro
estimatedMinutes: 7
tags: [nutrition, appetite, weight-regulation, defended-weight, non-stigmatising, recognition]
start: intro
variables: { quality: 0 }

persona:
  name: "Mr Chua"
  age: 46
  sex: male
  occupation: "office manager"
  presentation: "Lost 12 kg last year on a strict diet, felt great, then regained 9 kg over the following year despite 'eating less than before'. He's discouraged and blames his own willpower."
  voice: "Deflated and self-critical; assumes the regain is his personal failure."

nodes:
  - id: intro
    type: info
    title: "\"I just don't have the willpower\""
    body: |
      Mr Chua, 46, lost 12 kg last year on a strict diet and felt great. Over the following
      year he regained 9 kg, despite, he says, *"eating less than before"*. He's convinced
      it's a personal failure of willpower and is close to giving up. Before any advice about
      diet, name the physiology behind his regain.
    next: q-why

  - id: q-why
    type: mcq
    stem: "What is the best explanation for his regain?"
    options:
      - id: a
        text: "Hormonal and metabolic changes after weight loss drove regain."
        correct: true
        feedback: "Body weight is actively regulated, and the responses that oppose weight loss are strong. Regain is the predicted outcome of a regulated system."
        effects: { quality: +1 }
        goto: q-arms
      - id: b
        text: "He simply lacks the discipline to maintain the diet."
        correct: false
        feedback: "Blaming discipline misses what happened: the weight loss triggered a coordinated biological response, and relying on discipline alone means working against physiology."
        goto: q-arms
      - id: c
        text: "The weight he lost was only water, so it came back on its own."
        correct: false
        feedback: "Real fat was lost. The regain is driven by body-weight regulation."
        goto: q-arms

  - id: q-arms
    type: mcq
    stem: "Which set of changes drives the regain after weight loss?"
    options:
      - id: a
        text: "Leptin falls, hunger hormones rise and energy expenditure drops."
        correct: true
        feedback: "Three coordinated arms favour regaining the lost fat: falling leptin signals starvation to the hypothalamus, hunger-hormone shifts persist for a year or more, and expenditure drops more than the smaller body predicts (adaptive thermogenesis, or metabolic adaptation)."
        effects: { quality: +1 }
        goto: q-damaged
      - id: b
        text: "Leptin rises and suppresses appetite, so regain is simply overeating."
        correct: false
        feedback: "After weight loss leptin falls (there is less fat), and the fall acts as a starvation signal, which drives hunger up."
        goto: q-damaged
      - id: c
        text: "Nothing measurable changes; the body treats all weights the same."
        correct: false
        feedback: "Leptin, hunger hormones and energy expenditure all shift together after weight loss in the direction that favours regaining the prior weight."
        goto: q-damaged

  - id: q-damaged
    type: mcq
    stem: "Mr Chua asks, \"So dieting permanently wrecked my metabolism?\" Your best answer?"
    options:
      - id: a
        text: "No, it slows only a little, and mostly recovers."
        correct: true
        feedback: "Metabolic adaptation is real but modest and largely reversible. It makes maintenance harder, but weight loss remains possible. The 'permanent damage' claim comes from an extreme outlier study, whose finding is better explained by sustained activity."
        effects: { quality: +1 }
        goto: q-say
      - id: b
        text: "Yes, it is permanently lower, so losing weight is now impossible."
        correct: false
        feedback: "This overstates the effect and would demoralise him. Adaptation is modest and largely reversible in ordinary dieters; the large, lasting drop behind that claim comes from an extreme outlier (the Biggest Loser study)."
        goto: q-say
      - id: c
        text: "No, metabolism never adapts to weight loss at all."
        correct: false
        feedback: "Adaptive thermogenesis is real: expenditure does drop more than body size predicts. It is modest and largely reversible."
        goto: q-say

  - id: q-say
    type: mcq
    stem: "How should you frame this for Mr Chua?"
    options:
      - id: a
        text: "Explain the regain as biology; shift the plan to environment and habits."
        correct: true
        feedback: "Moving from willpower to the environment and habits (protein, fibre, sleep, portion defaults) is practical and avoids blame. Where the regulatory responses are strong, specialist help or medication is a legitimate option."
        effects: { quality: +1 }
        goto: route
      - id: b
        text: "Tell him he just needs to try harder and show more willpower next time."
        correct: false
        feedback: "Urging more willpower leaves out the physiology and reinforces the stigma; a patient relying on willpower alone is working against body-weight regulation."
        goto: route
      - id: c
        text: "Tell him weight is entirely genetic and nothing he does will matter."
        correct: false
        feedback: "Genetic fatalism swaps one unhelpful message for another: the environment and habits do matter, and body-weight regulation can be worked with and, for some, medically supported."
        goto: route

  - id: route
    type: branch
    rules:
      - if: "quality >= 3"
        goto: end-good
    else: remedial

  - id: remedial
    type: info
    title: "Body-weight regulation and regain"
    body: |
      The core idea: body weight is **biologically regulated**, and the responses that oppose weight
      loss are strong. After Mr Chua lost fat, leptin fell (signalling starvation), hunger hormones rose
      and stayed raised for a year, and energy expenditure dropped more than his smaller body
      predicted. Regain is the predicted outcome of that system. Metabolic adaptation is real but
      modest and largely reversible, so his metabolism is not "permanently wrecked". The useful step is to change the environment and habits, without blame.
    next: end-partial

  - id: end-good
    type: end
    outcome: success
    title: "Explaining regain without blame"
    body: |
      You reframed Mr Chua's regain as body-weight regulation working as it evolved to (falling
      leptin, rising hunger hormones and adaptive thermogenesis, all favouring regain of lost fat).
      You answered the "damaged metabolism" question accurately
      (real but modest and largely reversible), and shifted the plan from willpower to
      environment, habits and, where the regulatory responses are strong, legitimate medical support.
    debrief:
      objectivesMet: [1, 2, 3]
      keyPoints:
        - "Weight regain is the predicted outcome of body-weight regulation."
        - "Three arms drive it: leptin falls, hunger hormones rise (for a year or more), and energy expenditure drops (adaptive thermogenesis)."
        - "Metabolic adaptation is real but modest and largely reversible: reframe from blame to environment, habits and, where needed, medical support."

  - id: end-partial
    type: end
    outcome: partial
    title: "Nearly there"
    body: |
      You worked through it, but the framing slipped. The take-home: Mr Chua's regain is biology:
      body-weight regulation (leptin down, hunger hormones up, expenditure down)
      favours regain of lost fat. His metabolism isn't permanently damaged. Replay and focus on explaining
      it without blame.
    debrief:
      objectivesMet: [1]
      keyPoints:
        - "Regain reflects body-weight regulation. It is not a lack of willpower."
        - "Name the three arms: leptin down, hunger hormones up, adaptive thermogenesis."
        - "Metabolic adaptation is modest and largely reversible: reframe from blame to environment and habits."
