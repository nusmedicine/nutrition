id: mr-tan-obesity
title: "Mr Tan, 45: two sets of BMI cut-offs"
objectives:
  - "Classify an Asian adult using the right cut-offs (Singapore's ≥27.5 high-risk action point, not the WHO ≥30 cut-off) and read waist against the Asian central-obesity cut-off."
  - "Tally the metabolic-syndrome components (≥3 of 5) and treat the label as a risk marker of clustered risk, not a disease with its own drug."
  - "Work through all five areas of lifestyle change (diet quality, activity, sleep, stress, behaviour change) instead of reaching for a drug or for blame."
  - "Turn the plan into realistic, person-first swaps aimed at a modest ~5–10% loss, framed with permission rather than shame."
difficulty: core
estimatedMinutes: 12
tags: [nutrition, obesity, metabolic-syndrome, singapore, do-no-harm, weight-inclusive]
start: intro
variables: { quality: 0 }

persona:
  name: "Mr Tan"
  age: 45
  sex: male
  occupation: "office worker (CBD); mostly desk-bound"
  sprite: /figures/personas/mr-tan
  presentation: "Routine review. BMI 28 kg/m², waist 98 cm, BP 138/86 mmHg, fasting glucose nudged up, HDL low. Daily hawker lunch (char kway teow), kopi-C twice a day, fewer than 5,000 steps a day, sleeps about six hours, snacks through deadlines. Feels well and thinks his weight is 'not that bad'."
  voice: "Easy-going, a little defensive about his weight, busy; enjoys his kopi and his hawker lunch."

nodes:
  - id: intro
    type: info
    emotion: neutral
    title: "\"Doctor, my weight is not that bad, right?\""
    body: |
      Mr Tan is 45, a Chinese office worker who sits at a desk most of the day. He feels well and has come
      in for a routine review. His numbers: BMI 28 kg/m², waist 98 cm, blood pressure 138/86 mmHg, fasting
      glucose nudged up, and a low HDL ("good cholesterol"). He has a hawker lunch daily (char kway teow)
      and kopi-C twice a day, walks fewer than 5,000 steps, sleeps about six hours, and snacks through work
      deadlines.

      *"BMI 28? That's under 30, so I'm not really obese, right?"* Work through the visit: classify him using the
      right cut-offs, decide whether his findings cluster, find the modifiable factors, and notice where reaching
      for a drug first, or for a blaming word, would be the wrong approach.
    next: q-classify

  - id: q-classify
    type: mcq
    emotion: concerned
    title: "Classify"
    stem: |
      How would you classify Mr Tan's weight status?
    options:
      - id: a
        text: "High-risk: past the Singapore ≥27.5 point, with central obesity."
        correct: true
        feedback: "There are two sets of BMI cut-offs. Singapore acts earlier than the WHO figures because Asians carry more body fat, and more of it central, at a given BMI. His BMI of 28 is past the ≥27.5 high-risk action point, and a waist of 98 cm is over the Asian cut-off (≥90 cm in men), so he has central obesity too. BMI and waist are read together, never BMI alone."
        effects: { quality: +1 }
        reaction: relieved
        goto: reveal-numberlines
      - id: b
        text: "Normal: his BMI is under the WHO cut-off of 30, so he isn't obese."
        correct: false
        feedback: "The WHO ≥30 cut-off under-detects risk in Asian patients. Singapore's clinical action points are lower (intervene at ≥23, high risk at ≥27.5) because Singaporeans carry more, and more central, body fat at a given BMI. A BMI of 28 with a 98 cm waist is high-risk with central obesity, not 'normal'."
        reaction: skeptical
        goto: reveal-numberlines
      - id: c
        text: "Unclear: BMI and waist aren't enough without a body-fat scan."
        correct: false
        feedback: "A scan is not needed to act. BMI plus waist circumference is exactly the bedside pairing that classifies him: BMI 28 is past the ≥27.5 high-risk point, and a 98 cm waist exceeds the Asian central-obesity cut-off. Waiting for a scan delays first-line care."
        reaction: skeptical
        goto: reveal-numberlines

  - id: reveal-numberlines
    type: info
    emotion: neutral
    body: |
      Mr Tan falls in Singapore's high-risk band (≥27.5; intervention starts at ≥23) with central obesity
      by the Asian waist cut-off (≥90 cm in men). Now look at the rest of his findings together.
    next: q-mets

  - id: q-mets
    type: mcq
    emotion: concerned
    title: "Do the findings cluster?"
    stem: |
      Central obesity (waist 98 cm), low HDL, blood pressure 138/86 mmHg, and a raised fasting glucose.
      What does this add up to?
    options:
      - id: a
        text: "Four of five: he meets criteria; a risk marker, not a disease with its own drug."
        correct: true
        feedback: "Central obesity, low HDL, raised blood pressure and raised fasting glucose make four of five (only triglycerides are untested), past the any-three-of-five threshold. Insulin resistance and central fat, the common underlying abnormalities, tie them together, which is why the syndrome is a risk marker for type 2 diabetes and cardiovascular disease, not an entity treated with a single 'metabolic-syndrome' drug. Detailed diabetes, lipid and blood-pressure management belongs to the *Type 2 diabetes* and *Cardiovascular disease & hypertension* chapters."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-levers
      - id: b
        text: "Nothing to label yet: all five are needed, and triglycerides are unmeasured."
        correct: false
        feedback: "The definition is any three of five, with no obligatory component. He already has four (central obesity, low HDL, raised blood pressure, raised fasting glucose), so the missing triglyceride result doesn't change the tally: he meets criteria."
        reaction: concerned
        goto: q-levers
      - id: c
        text: "He has 'metabolic syndrome disease': start a drug aimed at the syndrome itself."
        correct: false
        feedback: "Metabolic syndrome is a clustering of risks around insulin resistance and central fat, not a single disease with a single drug. The label prompts action on the common underlying abnormalities (lifestyle first) and management of each component in its own chapter, not a prescription 'for the syndrome'."
        reaction: concerned
        goto: q-levers

  - id: q-levers
    type: mcq
    emotion: concerned
    title: "Which factors are modifiable?"
    stem: |
      Mr Tan meets metabolic-syndrome criteria and feels well. He asks, *"So what now? Is there a jab or a
      pill for this?"* What should you do first?
    options:
      - id: a
        text: "Map all five areas of lifestyle change and start a lifestyle-first plan."
        correct: true
        feedback: "Lifestyle change is the cornerstone, and his own history supplies the modifiable factors: diet quality (char kway teow, kopi-C twice a day), activity (under 5,000 steps), sleep (six hours raises next-day intake) and stress (deadline snacking), with behaviour change to make them stick. Medication and surgery are real tiers, but they come after lifestyle change and are added by specialists: recognise and refer, and don't reach for them first."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-plan
      - id: b
        text: "Start a weight-loss drug now, since lifestyle advice rarely works anyway."
        correct: false
        feedback: "Reaching for a drug first is not safe practice. Anti-obesity medication (including the newer GLP-1 receptor agonists) and metabolic-bariatric surgery are specialist tiers added on top of lifestyle, not in place of it. The task here is to recognise that they exist and refer, not to prescribe or select them. Lifestyle-first care is where you start, and his history is full of modifiable factors."
        reaction: concerned
        goto: remedial-donoharm
      - id: c
        text: "Tell him it's down to willpower: eat less and stop being lazy."
        correct: false
        feedback: "This is the do-no-harm trap. Shaming doesn't motivate. It raises stress and comfort-eating and drives patients to avoid care, so it can make weight worse; weight-inclusive, person-first framing is part of the treatment, not a courtesy. Telling him to 'eat less' also leaves out diet quality, sleep and stress, the modifiable factors here."
        reaction: concerned
        goto: remedial-donoharm

  - id: remedial-donoharm
    type: info
    emotion: concerned
    title: "Two things to correct before we plan"
    body: |
      Two corrections before Mr Tan gets a plan.

      **First, order of care.** Lifestyle change is first-line and the cornerstone. Anti-obesity medication
      and metabolic-bariatric surgery are genuine tiers, but they come after lifestyle change and are added by specialists.
      The task at this stage is to recognise that they exist and refer, not to prescribe or pick one.
      A strong answer elsewhere does not make up for reaching for a drug first.

      **Second, framing.** Shame and blame ("just eat less, it's willpower") backfire: stigma is itself a
      stressor that raises cortisol and comfort-eating and drives people to avoid appointments, so it can
      make weight worse. Use person-first, permission-based language and target health behaviours, not
      the scale alone.

      With those corrections, the modifiable factors are all in his own history: diet quality, activity, sleep and stress,
      with behaviour change to make them stick. Next comes the plan.
    next: q-plan

  - id: q-plan
    type: mcq
    emotion: neutral
    title: "The first-line plan"
    stem: |
      You have permission to talk about his health. Which opening plan is realistic, person-first, and
      aimed at a modest target with a worthwhile metabolic benefit?
    options:
      - id: a
        text: "Agree a few realistic swaps and small activity and sleep goals for ~5–10% loss."
        correct: true
        feedback: "A sustained, gradual 5–10% loss yields a disproportionate cardiometabolic benefit (better glucose, blood pressure and lipids). The swaps are specific and realistic at the hawker centre (half-rice plus vegetables, kopi-o kosong, a lunchtime walk, a sleep target), they address several of these areas at once, and they are agreed with him, not dictated, and reviewed together. Point him to My Healthy Plate and Nutri-Grade, and arrange follow-up through Healthier SG."
        effects: { quality: +1 }
        reaction: relieved
        goto: route
      - id: b
        text: "Start a strict very-low-calorie crash diet and ban rice, kopi and hawker food today."
        correct: false
        feedback: "This crash diet is too big and too abrupt to stick: bans tend to cause rebound eating and can damage rapport. The evidence favours a modest, sustained ~5–10% loss built from realistic pattern-level swaps (half-rice with vegetables, kopi-o kosong, a lunchtime walk), not an all-or-nothing crash he can't keep in his real food environment."
        reaction: concerned
        goto: route
      - id: c
        text: "Tell him to 'lose weight and exercise more' and return once he's lost 15 kg."
        correct: false
        feedback: "The advice is too vague and the target too big: 'exercise more' alone is a weak weight-loss strategy (nationally, activity rose while obesity still climbed), and a 15 kg target set as a condition for coming back invites failure and avoidance. Co-create a couple of specific swaps aimed at a modest 5–10% loss, and review together instead of sending him away until he's 'fixed it'."
        reaction: concerned
        goto: route

  - id: route
    type: branch
    rules:
      - if: "quality >= 4"
        goto: end-good
    else: end-partial

  - id: end-good
    type: end
    outcome: success
    title: "Recognised, clustered and lifestyle-first, without stigma"
    body: |
      You classified Mr Tan using the right cut-offs (high-risk by Singapore's ≥27.5 point, with central obesity by
      the Asian waist cut-off), recognised that his four findings cluster into metabolic syndrome as a risk
      marker and not a disease with its own drug, and worked through all five areas of lifestyle change. You kept medication and surgery
      as specialist referrals, not a first step, and framed the conversation with permission and
      respect instead of blame. The plan is a handful of realistic swaps aimed at a modest ~5–10% loss.
    debrief:
      objectivesMet: [1, 2, 3, 4]
      keyPoints:
        - "Two sets of BMI cut-offs: classify using Singapore's ≥27.5 high-risk action point (and ≥23 to intervene), read waist against the Asian central-obesity cut-off, and read BMI and waist together."
        - "Metabolic syndrome is any three of five components: a risk marker for type 2 diabetes and cardiovascular disease, not a disease treated with its own drug."
        - "Lifestyle change is first-line across five areas (diet quality, activity, sleep, stress, behaviour change); anti-obesity medication and surgery are specialist tiers: recognise and refer, don't prescribe."
        - "Aim for a modest, worthwhile ~5–10% loss with realistic swaps; frame it person-first and permission-based, because stigma is itself a metabolic stressor."
      references: ["@sgObesityBMI", "@who2020diet", "@hpbHealthyPlate", "@hpbNutriGrade", "@mohHealthierSG"]

  - id: end-partial
    type: end
    outcome: partial
    title: "Most of the way there"
    body: |
      You reached a plan for Mr Tan, but slipped on at least one point: the cut-offs used to classify him,
      whether the findings cluster (and that the syndrome is a risk marker, not a disease with its own drug), keeping
      medication and surgery as specialist referrals instead of a first step, or the person-first framing.
      Replay the safe path: classify using Singapore's ≥27.5 cut-off with the Asian waist cut-off; tally the
      any-three-of-five cluster; start lifestyle-first across all five areas of lifestyle change with realistic swaps aimed
      at ~5–10% loss; and never lead with a drug or with blame.
    debrief:
      objectivesMet: [1]
      keyPoints:
        - "Classify using Singapore's ≥27.5 high-risk point (BMI and waist together), not the WHO ≥30 cut-off."
        - "Metabolic syndrome is any three of five components: a risk marker, not a disease with its own drug."
        - "Lifestyle-first across all five areas; medication and surgery are for recognition and referral, and shame backfires."
