id: common-questions
title: "Everyday questions in one clinic: carbs, fat and protein"
objectives:
  - "Answer common lay questions on carbohydrate, fat and protein on quality-and-portion terms."
  - "Respond with the evidence to popular beliefs about coconut oil, dietary cholesterol and 'more protein = more muscle'."
  - "Give quality guidance, base it on My Healthy Plate, and recognise the boundary where a plan belongs with a dietitian (taught in later chapters)."
difficulty: intro
estimatedMinutes: 10
tags: [nutrition, macronutrients, counselling, common-beliefs]
start: intro
variables: { quality: 0 }

persona:
  name: "Mr Lim"
  age: 41
  sex: male
  occupation: "taxi driver"
  sprite: /figures/personas/mr-lim
  presentation: "Health screen showed a borderline fasting glucose and mildly high cholesterol. Feels well; eats mostly at hawker centres and coffee shops. Has picked up a lot of advice online and from friends."
  voice: "Chatty and well-meaning; trusts influencers and 'my friend also say'; wants clear yes/no answers; time-pressed."

nodes:
  - id: intro
    type: info
    emotion: neutral
    title: "\"Doctor, I got a few questions ah\""
    body: |
      Mr Lim's fasting glucose is borderline and his cholesterol is mildly up. He feels well
      and is motivated, but he has absorbed a lot of coffee-shop nutrition wisdom, and he
      rattles off his worries one after another: rice, eggs, cooking oils and his son's
      protein powder. Answer each on quality, not bans, and notice the principle that runs
      through all four.
    next: q-carb

  - id: q-carb
    type: mcq
    emotion: concerned
    stem: "*\"Is white rice the problem? Should I just cut all carbs? My friend went keto.\"*"
    options:
      - id: a
        text: "\"Yes, cut all rice and carbs; keto is best.\""
        correct: false
        feedback: "This throws out protective wholegrains, legumes and fibre along with the refined starch. Keto/low-carb can help weight and glucose *short-term* but has no proven long-term benefit, can push cholesterol up, and a strict plan needs a dietitian."
        goto: q-eggs
      - id: b
        text: "\"It's the type: swap some white rice for brown or red rice.\""
        correct: true
        feedback: "Swapping some white rice for brown or red rice is a quality upgrade available at hawker stalls, not a ban, and it fits My Healthy Plate: fill half the plate with vegetables and keep the portion sensible. Reassure him too that whole fruit is fine despite its sugar; it is sweet drinks (bubble tea, sweetened kopi, even juice) that behave like added sugar."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-eggs
      - id: c
        text: "\"Rice is fine; eat as much white rice as you like.\""
        correct: false
        feedback: "Large amounts of refined starch raise glucose, so portion and type still matter; this isn't a free pass."
        goto: q-eggs

  - id: q-eggs
    type: mcq
    emotion: concerned
    stem: "*\"So no more eggs for me? I heard eggs are full of cholesterol, and mine is already high.\"*"
    options:
      - id: a
        text: "\"Yes, stop eating eggs; they'll raise your cholesterol.\""
        correct: false
        feedback: "The cholesterol in food raises blood cholesterol far less than saturated and trans fat do. For most people eggs are fine in moderation; the fatty, fried sides they come with matter more."
        goto: q-fat
      - id: b
        text: "\"Eggs in moderation are fine for most people; we'll watch your results.\""
        correct: true
        feedback: "Saturated and trans fat raise blood cholesterol more than the cholesterol in the egg itself, so for most people eggs need no ban. Individualising, with his borderline results in view, is the sound approach."
        effects: { quality: +1 }
        reaction: surprised
        goto: q-fat
      - id: c
        text: "\"Cholesterol in food doesn't matter at all, so eat as many as you like.\""
        correct: false
        feedback: "Dietary cholesterol matters less than people fear, but 'doesn't matter at all' overshoots, and eggs are often eaten with fatty, fried extras. Moderation, and watch what they are eaten with."
        goto: q-fat

  - id: q-fat
    type: mcq
    emotion: skeptical
    stem: "*\"My friend says coconut oil is a superfood and butter is natural, so I switched to those. Better for me, right?\"*"
    options:
      - id: a
        text: "\"Yes, coconut oil and butter are healthy natural fats.\""
        correct: false
        feedback: "Coconut oil is ~90% saturated fat and raises cholesterol like other saturated fats, so the 'superfood' halo isn't supported; butter is roughly two-thirds saturated. Neither is a heart-healthy default; correct the belief kindly, without a ban."
        goto: q-protein
      - id: b
        text: "\"Avoid all fat; go fat-free.\""
        correct: false
        feedback: "The body needs some fat for the essential fatty acids and fat-soluble vitamins; the aim is to swap saturated for unsaturated fat, not to cut all fat."
        goto: q-protein
      - id: c
        text: "\"Keep some fat, but cook with unsaturated oils.\""
        correct: true
        feedback: "Type matters more than total. Unsaturated oils (peanut, canola, olive) should be the everyday default, and small amounts of coconut for flavour are fine. The default cooking fat is what matters, so the hype can be corrected without a ban."
        effects: { quality: +1 }
        reaction: relieved
        goto: q-protein

  - id: q-protein
    type: mcq
    emotion: neutral
    stem: "*\"Last one, doctor. My son takes protein powder and eats chicken breast all day to build muscle. Does more protein mean more muscle? Should I take some for energy?\"*"
    options:
      - id: a
        text: "\"Yes, the more protein, the more muscle.\""
        correct: false
        feedback: "Extra protein helps build muscle only with resistance training, and only up to roughly 1.6 g/kg/day; beyond that it is just extra energy."
        goto: route
      - id: b
        text: "\"Enough protein plus training builds muscle; food usually covers it.\""
        correct: true
        feedback: "Adequate protein plus training builds muscle. Whole foods come first (fish, egg, tofu, dhal, chicken), with powder a convenience, not a necessity, and the protein foods to cut back on are processed meats (luncheon meat, bacon, sausages)."
        effects: { quality: +1 }
        reaction: relieved
        goto: route
      - id: c
        text: "\"Protein powder gives energy; take a few scoops a day.\""
        correct: false
        feedback: "Protein isn't an energy supplement. Most people meet their needs from ordinary local food; there's no need to add powder."
        goto: route

  - id: route
    type: branch
    rules:
      - if: "quality >= 3"
        goto: end-good
    else: remedial

  - id: remedial
    type: info
    emotion: concerned
    title: "Re-centre on quality"
    body: |
      The principle across all four questions is the same: type and food source, not
      blanket bans or hype. Base advice on My Healthy Plate, correct mistaken beliefs
      plainly, and, when a plan turns restrictive or therapeutic or the patient is
      higher-risk, bring in a dietitian rather than prescribing it yourself.
    next: end-partial

  - id: end-good
    type: end
    outcome: success
    title: "Quality and portion, and where referral begins"
    body: |
      You answered a carbohydrate, a cholesterol, a fat and a protein question on
      quality-and-portion terms and corrected the coconut-oil, egg and 'more-protein'
      misconceptions. If Mr Lim still wants his friend's strict low-carb plan on top of
      borderline glucose and cholesterol, that is beyond everyday advice, and the step is to
      bring in a dietitian. (Assessing diet, counselling and referral are covered in the
      *Assessing diet and talking to patients*, *Behaviour-change counselling* and
      *Interprofessional practice, referral and looking after yourself* chapters.)
    debrief:
      objectivesMet: [1, 2, 3]
      keyPoints:
        - "Carbs, fat, cholesterol and protein all reduce to quality and food source, not blanket bans."
        - "Correct mistaken beliefs clearly: coconut oil raises cholesterol; the cholesterol in food matters less than saturated/trans fat; processed meat has the stronger evidence of harm; protein builds muscle only with training, up to a point."
        - "Give quality guidance and local tools; don't prescribe grams or restrictive plans; refer restrictive/therapeutic diets or higher-risk patients."

  - id: end-partial
    type: end
    outcome: partial
    title: "Most of the way"
    body: |
      You engaged all four questions but drifted toward all-or-nothing or hype on at least
      one. Replay and reframe each around quality and one realistic local swap, and
      remember to refer when a plan turns restrictive.
    debrief:
      objectivesMet: [1]
      keyPoints:
        - "Lead with quality and food source, not 'good vs bad'."
        - "Base advice on My Healthy Plate and Nutri-Grade."
        - "Refer restrictive or therapeutic diets to a dietitian."
