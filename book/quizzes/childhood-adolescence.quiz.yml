id: childhood-adolescence
title: "Quick check: childhood & adolescence"
questions:
  - id: q1
    stem: "A 12-year-old girl and a 12-year-old boy attend the same clinic. Who is more likely to be at or near peak nutritional demand right now, and why?"
    options:
      - text: "The girl, because her growth spurt comes earlier than a boy's"
        correct: true
        feedback: "Nutritional demand follows pubertal stage, not chronological age. Peak height velocity comes early in girls (before menarche) and later in boys, so at the same age she is often further into her spurt, and can be at peak demand while still looking like a child."
      - text: "The boy, because boys grow faster and need more at every age"
        correct: false
        feedback: "Boys do reach a higher *total* energy need eventually, but their spurt comes *later*. At 12, a girl is typically further into her spurt than a same-age boy."
      - text: "Neither, because needs depend only on age and are identical at 12"
        correct: false
        feedback: "Needs track pubertal stage, not chronological age, and puberty is timed differently in girls and boys, so two 12-year-olds can be at very different points."

  - id: q2
    stem: "A father asks whether his 15-year-old son needs protein powder to \"fuel his growth spurt\". What's the best reply?"
    options:
      - text: "Usually not; an ordinary diet meeting his energy needs meets his protein needs"
        correct: true
        feedback: "Protein needs *per kilogram* fall through adolescence toward the adult level; total grams rise only because he is bigger. Energy needs per kilogram fall too, even as total daily amounts rise. An ordinary diet that meets his energy needs therefore almost always meets his protein needs, so a normally eating adolescent does not need supplements."
      - text: "Yes; the spurt roughly doubles protein needs, which food alone can't meet"
        correct: false
        feedback: "Per-kilogram protein needs *fall*, not rise, and total intake from ordinary food is almost always sufficient, so supplements aren't needed for normal growth."
      - text: "Yes; his huge appetite is a sign that his body is short of protein"
        correct: false
        feedback: "A big appetite is a normal signal that tracks growth velocity, and mostly reflects a bigger body and more movement, not a protein shortfall. An ordinary diet that meets his energy needs almost always meets his protein needs."

  - id: q3
    stem: "Which adolescent is at highest risk of iron deficiency, and how is it caught early?"
    options:
      - text: "A menstruating girl on a meat-light diet; test iron before anaemia"
        correct: true
        feedback: "Menstruating adolescent girls are the classic at-risk group: iron need rises sharply at menarche as menstrual loss adds to the demands of growth. Deficiency develops before haemoglobin falls, so ferritin and iron studies (not haemoglobin alone) catch it earlier; suspect it in a tired, poorly concentrating or heavily menstruating girl."
      - text: "A boy in his growth spurt; boys have the highest iron needs"
        correct: false
        feedback: "Boys' iron need does rise transiently with the spurt, but girls' need jumps *higher* at menarche because of monthly menstrual loss; girls are the classic at-risk group."
      - text: "Only an anaemic teen; a normal haemoglobin rules deficiency out"
        correct: false
        feedback: "Iron can be depleted while haemoglobin is still normal, leaving a teen tired and under-performing, so deficiency is suspected early, not after anaemia appears."

  - id: q4
    stem: "The WHO advises keeping free sugars under 10% of energy. What is that threshold based on, and how strong is the sugary-drink-to-weight evidence?"
    options:
      - text: "It's based first on dental caries; the weight effect is real but modest"
        correct: true
        feedback: "Dental caries is the primary rationale. On weight, drink-swap trials show a genuine but modest effect that works mainly through the drinks' energy content, not a special toxicity of sugar, so sugary drinks are a risk to recognise and reduce, not a toxin."
      - text: "It's based on obesity; trials prove sugary drinks are its sole cause"
        correct: false
        feedback: "The threshold is based on *caries*, and the weight evidence, while real, is modest and multi-factorial: sugary drinks are one factor among many, not the sole cause."
      - text: "It's arbitrary; there's no real evidence behind the number"
        correct: false
        feedback: "Evidence exists, chiefly on dental caries, plus drink-swap trials showing a modest weight effect; the number reflects that evidence, not guesswork."

  - id: q5
    stem: "A mother asks you to tell her overweight-looking 14-year-old to \"go on a diet\". Why is this the wrong approach?"
    options:
      - text: "Because teenage dieting predicts both eating disorders and more weight gain"
        correct: true
        feedback: "In prospective studies, adolescents who diet are more likely to develop an eating disorder and to gain more weight, so a prescribed diet risks both. The safe approach is healthy habits, family meals and no weight-talk."
      - text: "Because 14-year-olds never have weight problems, so the concern is misplaced"
        correct: false
        feedback: "Weight problems are real at this age, but the answer is never a diet: dieting predicts both eating disorders and *more* weight gain, and framing advice around healthy habits is the safe approach."
      - text: "Because you should put her on a stricter, supervised diet instead"
        correct: false
        feedback: "Any dieting framing carries the same risks. The safe approach avoids weight-talk altogether and builds healthy habits and family meals."

  - id: q6
    stem: "A 15-year-old competitive runner has stopped having periods and had a stress fracture last season. She trains hard and eats little. What's happening, and what do you do?"
    options:
      - text: "Low energy availability driving the female-athlete triad; refer"
        correct: true
        feedback: "Amenorrhoea, a stress fracture, restriction and heavy training together are the pattern to recognise. Energy availability is intake minus the energy burned in training; when it is too low for her training load, reproductive hormone production (oestrogen) is suppressed, periods stop and bone suffers. The advice is to eat enough for her training, not to restrict (never a stricter diet), and the action is referral."
      - text: "Overtraining; tell her to push through and take a calcium tablet"
        correct: false
        feedback: "A calcium tablet won't fix the underlying problem (too little energy lowering her hormone levels), and 'pushing through' is harmful. This needs recognition and referral, and more fuel, not more restriction."
      - text: "Normal athletic amenorrhoea; reassure her and do nothing"
        correct: false
        feedback: "Absent periods in an athlete are a red flag, not a benign sign of fitness: they signal low energy availability threatening bone. Recognise and refer."

  - id: q7
    stem: "Which statement about recognising eating disorders in adolescents is correct?"
    options:
      - text: "They occur across the weight spectrum; a normal or high BMI doesn't exclude one"
        correct: true
        feedback: "Eating disorders are not confined to visibly underweight teens. A formerly heavier teen who loses weight fast can be seriously ill, and praising weight loss can mask one. Rapid weight loss, faltering growth, absent periods, a stress fracture or purging warrant referral whatever the current weight."
      - text: "You can safely exclude an eating disorder if the teen's weight is normal or high"
        correct: false
        feedback: "This is a dangerous misconception: a large share of presentations are at normal or high weight. Recognise the behaviours and red flags; the number on the scale cannot exclude a disorder."
      - text: "'Fussy eating' and eating disorders are the same thing and need the same referral"
        correct: false
        feedback: "Most fussy eating is normal, but when avoidance is driven by sensory aversion or fear *without* weight or shape concern it can be ARFID (avoidant/restrictive food intake disorder), a clinical pattern distinct from anorexia nervosa. Recognise which is which."

  - id: q8
    stem: "What best captures how to protect an adolescent's peak bone mass?"
    options:
      - text: "Food-first calcium, weight-bearing activity, and treating deficiency"
        correct: true
        feedback: "Weight-bearing activity and adequate calcium build the most bone; supplements help mainly the child who is genuinely deficient, not the already replete. The window is brief and largely closes by the early twenties, and genetics still determines most of the achievable peak."
      - text: "Supplement every child with calcium and vitamin D; more is better"
        correct: false
        feedback: "In a replete child, calcium supplements add only a small, fading benefit and vitamin D supplements add essentially nothing. The benefit is confined to children who were deficient, so the approach is food first and treating deficiency."
      - text: "Bone can be built up at any age, so adolescence isn't special"
        correct: false
        feedback: "Adolescence is special: roughly two-fifths of adult bone mineral is laid down in the few years around the spurt, and the window largely closes by the early twenties."
