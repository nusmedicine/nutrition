id: chronic-kidney-disease
title: "Quick check: chronic kidney disease"
questions:
  - id: q1
    stem: "A man's results show a low eGFR (category G3b) with heavy albuminuria (A3). On the CKD heat map, how should you classify and act?"
    options:
      - text: "High-risk CKD, so his nutrition care is now dietitian-led"
        correct: true
        feedback: "CKD is staged by cause, eGFR (G1–G5) and albuminuria (A1–A3) on a colour-coded heat map, and a low eGFR combined with heavy albuminuria falls in the high-risk category. The generalist's task is recognition: once CKD is confirmed, individualised nutrition is dietitian-led. Recognise and refer."
      - text: "Mild change, so no action is needed until symptoms appear"
        correct: false
        feedback: "Because CKD is largely silent and detected biochemically, waiting for symptoms misses the chance to intervene early. A low eGFR with heavy albuminuria is high-risk CKD that warrants recognition and referral now."
      - text: "Low risk, because a low eGFR with albuminuria is reassuring"
        correct: false
        feedback: "Reading these results as reassuring misreads the heat map. Falling eGFR and heavy albuminuria are the two axes that push a patient toward the high-risk end."
      - text: "Not CKD, because staging always needs a kidney biopsy first"
        correct: false
        feedback: "CKD is defined and staged from eGFR and albuminuria (with cause), without a biopsy. These results already classify him as high-risk CKD."

  - id: q2
    stem: "Which piece of standard healthy-eating advice can become dangerous in advanced CKD?"
    options:
      - text: "Eating more potassium or a potassium salt substitute"
        correct: true
        feedback: "For the general public, more potassium and a potassium salt substitute are sound, but the failing kidney cannot clear a potassium load, so both can precipitate life-threatening hyperkalaemia. The WHO potassium advice explicitly excludes CKD, and the salt-substitute trial deliberately excluded serious kidney disease."
      - text: "Cutting back on added salt and processed-food sodium"
        correct: false
        feedback: "Sodium reduction still applies in CKD: cutting sodium still lowers blood pressure, reduces albuminuria and helps kidney-protective drugs work. It is the change a generalist can safely reinforce."
      - text: "Choosing fresh foods over ultra-processed ones"
        correct: false
        feedback: "Choosing fresh foods stays good in CKD, and it also cuts hidden additive phosphate. It is not the advice that changes in CKD."
      - text: "Keeping to a healthy body weight over time"
        correct: false
        feedback: "Weight management remains sensible in CKD. The advice that turns dangerous is the potassium message."

  - id: q3
    stem: "How does protein advice change when a CKD patient starts dialysis?"
    options:
      - text: "It is raised again, because dialysis is itself catabolic"
        correct: true
        feedback: "Before dialysis, protein is modestly restricted to reduce the waste load on failing kidneys; once dialysis begins, itself a catabolic process that removes protein, the target is raised again. Opposite advice for the same patient at different stages is why the target is left to the renal dietitian."
      - text: "It is lowered further, since the kidneys have now failed"
        correct: false
        feedback: "Dialysis is catabolic and removes protein, so needs go up. Pushing protein lower at this point risks protein-energy wasting."
      - text: "It stays exactly the same at every stage of CKD"
        correct: false
        feedback: "Protein advice is stage-dependent: restricted before dialysis, liberalised on it. That reversal is why the target is dietitian-set."
      - text: "Protein is stopped entirely once dialysis begins"
        correct: false
        feedback: "Stopping protein would accelerate wasting, so protein is never stopped. On dialysis the target is higher than before dialysis."

  - id: q4
    stem: "A colleague says, \"The MDRD trial proved protein restriction slows CKD.\" What is the accurate response?"
    options:
      - text: "Its primary analysis gave only an equivocal result"
        correct: true
        feedback: "MDRD's primary analysis found only a small, statistically fragile effect; the confident 'protein restriction slows CKD' reading came from a later secondary analysis. The fair conclusion is a benefit with a caveat, which is part of why protein targets are individualised and supervised."
      - text: "It was a decisive positive trial with a hard endpoint"
        correct: false
        feedback: "Its primary endpoint was not clearly positive. Treating MDRD as decisive overstates it, because the supportive reading rests on a secondary analysis."
      - text: "It proved protein restriction is harmful and never useful"
        correct: false
        feedback: "MDRD did not show harm. Its primary result was equivocal, which is different from showing that restriction is dangerous, although unsupervised over-restriction does risk wasting."
      - text: "It was retracted, so protein has no role in CKD"
        correct: false
        feedback: "The trial was not retracted. Protein remains central to CKD nutrition, restricted before dialysis and raised on it, just not on the strength of a decisive primary result."

  - id: q5
    stem: "A dialysis patient following a strict self-imposed \"kidney diet\" has unintentional weight loss, low albumin and muscle wasting. What does this picture suggest?"
    options:
      - text: "Protein-energy wasting from an over-strict diet"
        correct: true
        feedback: "Low body and muscle mass, poor intake and abnormal blood chemistry define protein-energy wasting, which affects roughly a third to a half of dialysis patients and is strongly linked to death. A too-strict, unsupervised 'kidney diet' is a cause, so refer for individualised nutrition."
      - text: "Excellent renal-diet adherence that should be encouraged"
        correct: false
        feedback: "Weight loss, low albumin and muscle wasting signal protein-energy wasting, so the diet is doing harm."
      - text: "Simple dehydration that fluid will correct"
        correct: false
        feedback: "Dehydration does not explain muscle wasting or low albumin. This presentation indicates protein-energy wasting and needs dietetic assessment."
      - text: "A normal finding on dialysis needing no action"
        correct: false
        feedback: "Wasting is linked to mortality, so it is a clear trigger to refer for nutrition support."

  - id: q6
    stem: "Why can the phosphorus number on a food label understate the real phosphate load in CKD?"
    options:
      - text: "Inorganic additives are about 90–100% absorbed, often unlabelled"
        correct: true
        feedback: "Naturally occurring phosphate in whole foods is only partly absorbed (about 40–60%, less from plants), but the inorganic phosphate additives in processed and 'enhanced' foods are absorbed almost completely and are often absent from the label. The practical approach is preferring fresh over processed and scanning ingredient lists for '-PHOS' additives, which is a dietitian's skill."
      - text: "The labelled number always overstates what is absorbed"
        correct: false
        feedback: "The label usually understates the load, because hidden inorganic additives, nearly fully absorbed, are often missing from it."
      - text: "Phosphate from plants is absorbed more completely than additives"
        correct: false
        feedback: "Plant (phytate-bound) phosphate is the least available form, while inorganic additives are the most completely absorbed."
      - text: "Cooking destroys most phosphate before it is eaten"
        correct: false
        feedback: "Cooking does not reliably remove phosphate, and it does nothing about hidden additives. The issue is the near-complete absorption of unlabelled inorganic phosphate."

  - id: q7
    stem: "Which food must be avoided completely in CKD?"
    options:
      - text: "Star fruit or belimbing, which are neurotoxic in CKD"
        correct: true
        feedback: "Star fruit and belimbing (bilimbi) contain a neurotoxin that healthy kidneys clear but failing ones cannot, causing hiccups, confusion, seizures and death, with high mortality in kidney failure. They must therefore be avoided completely, unlike ordinary high-potassium foods, and this is a locally important warning in Singapore."
      - text: "White rice, whose potassium load is dangerous in CKD"
        correct: false
        feedback: "White rice is low in potassium and need not be avoided. The neurotoxic hazard is star fruit and belimbing."
      - text: "Banana, the most toxic fruit in kidney disease"
        correct: false
        feedback: "Bananas are high in potassium, so their portions are adjusted to blood potassium levels, but they need not be avoided completely. Star fruit and belimbing are the neurotoxic exception."
      - text: "Oily fish, whose phosphate makes it unsafe to eat"
        correct: false
        feedback: "Oily fish need not be avoided; its phosphate is natural and only partly absorbed. The foods to avoid completely are star fruit and belimbing."

  - id: q8
    stem: "In early CKD, which dietary change can a generalist reinforce, with the rest referred?"
    options:
      - text: "Cutting sodium, the advice that still applies in CKD"
        correct: true
        feedback: "Sodium reduction helps in CKD for the same reasons it helps in hypertension, and it also reduces albuminuria and lets kidney-protective drugs work. Unlike the potassium message, it still applies. Potassium, phosphate, fluid and protein quantities are individualised by a renal dietitian, so the generalist reinforces sodium, avoids the potassium and star-fruit hazards, and refers."
      - text: "Prescribing a fixed daily fluid restriction in millilitres"
        correct: false
        feedback: "Early CKD usually needs no fluid restriction, and any limit is individualised and specialist. Fluid limits are for referral."
      - text: "Setting an exact potassium and phosphate gram target"
        correct: false
        feedback: "Potassium and phosphate targets are individualised to blood levels by a dietitian."
      - text: "Starting a phosphate binder with every meal"
        correct: false
        feedback: "Binders are a specialist prescribing decision. The change to reinforce is sodium reduction."
