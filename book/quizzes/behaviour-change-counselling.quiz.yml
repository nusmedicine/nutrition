id: behaviour-change-counselling
title: "Quick check: behaviour-change counselling"
questions:
  - id: q1
    stem: "A patient says, \"The kopi is my only pleasure driving all day.\" What's the motivational-interviewing move?"
    options:
      - text: "Reflect both sides and let him voice his own reasons"
        correct: true
        feedback: "Reflecting both sides (\"the kopi keeps you going, and it sounds like the sugar worries you a bit\") resists the righting reflex and invites change talk, so he argues himself toward change instead of resisting you."
      - text: "Tell him firmly he must stop the sugar because it's dangerous"
        correct: false
        feedback: "This is the righting reflex, the urge to fix or warn. The warning is accurate, but it provokes resistance and he digs in ('don't tell me what to do')."
      - text: "Say nothing about it to avoid conflict"
        correct: false
        feedback: "Avoidance isn't the answer either: permission and reflection let you raise the topic without lecturing."

  - id: q2
    stem: "Which of these patient statements is change talk (the patient's own motivation to change)?"
    options:
      - text: "\"My father lost his foot to diabetes. I don't want that.\""
        correct: true
        feedback: "The statement voices his own reason to change, which is change talk. A reflection or affirmation reinforces it; a lecture buries it."
      - text: "\"The food is just too good, I can't help it.\""
        correct: false
        feedback: "This is sustain talk (arguments for staying the same). Acknowledge it without amplifying it, and draw out the change talk instead."
      - text: "\"Everyone tells me to eat better, it's annoying.\""
        correct: false
        feedback: "Resistance or sustain talk like this is often a sign someone has been pushed too hard. Reflect it and ease off the righting reflex."

  - id: q3
    stem: "Within the Advise step of the 5 A's, what should come before the advice itself?"
    options:
      - text: "Ask permission before sharing an idea"
        correct: true
        feedback: "Asking permission (\"would it be OK if I shared one idea?\") keeps clinician and patient partners rather than adversaries. Unasked-for advice, however good, tends to bounce off."
      - text: "Nothing; good advice should be given at once, and firmly"
        correct: false
        feedback: "Advice without permission or listening undermines partnership and provokes resistance. Assess and ask first."
      - text: "A full lecture on the complications of diabetes"
        correct: false
        feedback: "A lecture is the righting reflex, and it provokes resistance. Assess what they eat and are ready for, then advise briefly, with permission."

  - id: q4
    stem: "A patient wants to \"cut down on sugar\". Which is the strongest SMART goal?"
    options:
      - text: "\"Order kopi siu dai each workday, from Monday\""
        correct: true
        feedback: "It is Specific, Measurable, Achievable, Relevant and Time-bound, and it is the patient's own choice. Small and owned beats big and imposed."
      - text: "\"Be healthier and cut out sugar\""
        correct: false
        feedback: "This is too vague to check: it is not specific, measurable or time-bound, so it is a wish, not a goal."
      - text: "\"Never drink kopi again, starting today\""
        correct: false
        feedback: "A total ban is not achievable, and an over-big goal the patient did not choose is soon abandoned. Aim for one small, sustainable change."

  - id: q5
    stem: "You've agreed a small goal. What add-on improves the odds it happens?"
    options:
      - text: "An if-then plan deciding the when and where in advance"
        correct: true
        feedback: "An if-then plan (\"if the stall auntie forgets, then I'll remind her siu dai\") is an implementation intention, which has a medium-to-large effect on goal attainment. Planning for the obstacle in advance makes the goal more likely to happen."
      - text: "Setting five more goals at the same time"
        correct: false
        feedback: "Too many goals dilute the effort; one small, well-planned change beats five aspirational ones."
      - text: "Telling the patient it matters and they must try hard"
        correct: false
        feedback: "Exhortation doesn't change behaviour. A concrete if-then plan does far more than 'try harder'."

  - id: q6
    stem: "You use the stages-of-change model to tailor your approach. What caveat should you hold?"
    options:
      - text: "It is a useful heuristic but doesn't reliably predict sustained weight loss"
        correct: true
        feedback: "The model helps in choosing how to talk, but the evidence that it produces sustained weight loss is low-certainty. Use it to meet a patient where they are, not to label them or forecast success. Present it as a tool, not a proven fact."
      - text: "It reliably predicts success, so focus only on the 'ready' ones"
        correct: false
        feedback: "This overstates it: the Cochrane evidence that the model produces sustained weight loss is low-certainty, and the model is not a proven predictor of who will succeed. It tailors the style of the conversation, nothing more."
      - text: "It is proven superior to every other counselling approach"
        correct: false
        feedback: "It is an organising heuristic: even the evidence that it produces sustained weight loss is low-certainty, so it is far from a proven-best method."

  - id: q7
    stem: "Mid-consult, a patient reveals she skips meals to \"make up\" for eating and feels guilty afterwards. What now?"
    options:
      - text: "Pause the weight goals, screen gently and consider referral"
        correct: true
        feedback: "Compensatory meal-skipping and guilt are eating-disorder red flags. On average, structured behavioural weight management does not increase eating-disorder symptoms, but for this patient more restriction could do harm, so pause the weight and portion goals and offer support and referral."
      - text: "Praise her discipline and encourage her to keep cutting things out"
        correct: false
        feedback: "Praise reinforces restriction in someone showing red flags, which is the harm to avoid. Recognise the signal and switch to support and referral."
      - text: "Ignore it and press on with the diet plan"
        correct: false
        feedback: "Missing this is a do-no-harm failure. The red flags outrank the diet goal; screen gently and refer."
