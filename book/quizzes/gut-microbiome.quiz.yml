id: gut-microbiome-basics
title: "Quick check: the gut microbiome"
questions:
  - id: q-ratio
    stem: "Roughly how do gut bacteria compare in number to your own body cells?"
    options:
      - text: "About 1:1, roughly equal numbers."
        correct: true
        feedback: "A careful 2016 recount put it near 1:1 (about 38 trillion bacteria to 30 trillion human cells, most of which are red blood cells). Total bacterial mass is only about 0.2 kg."
      - text: "About 10:1, ten bacteria for every human cell."
        correct: false
        feedback: "This is the widely quoted figure, but it came from a 1970s back-of-envelope estimate. The recount puts the ratio at roughly 1:1."
      - text: "About 100:1, so bacteria vastly outnumber us."
        correct: false
        feedback: "The ratio is roughly 1:1. Even the old, superseded figure was only 10:1."
  - id: q-densest
    stem: "Where does the microbiome live in greatest density, and why there?"
    options:
      - text: "The colon, with slow transit and near-neutral pH."
        correct: true
        feedback: "Slow transit, near-neutral pH and little absorption make the colon the main site of microbial fermentation. Density climbs along the tract and peaks there, which is why fibre fermentation happens in the colon."
      - text: "The stomach, because the acid helps bacteria grow."
        correct: false
        feedback: "Stomach acid keeps microbial numbers low. The colon is the dense site."
      - text: "The small intestine, where most digestion happens."
        correct: false
        feedback: "The small intestine is relatively sparse (brisk transit, digestive juices). The colon is far denser."
  - id: q-ferment
    stem: "What is the key difference between digestion and fermentation?"
    options:
      - text: "Digestion is your own enzymes; fermentation is bacterial breakdown in the colon."
        correct: true
        feedback: "Digestion is the host's own enzymes breaking food down in the small intestine; fermentation is anaerobic bacterial metabolism, in the colon, of what those enzymes could not break down. Fibre escapes digestion and is fermented by colonic bacteria."
      - text: "They are two words for the same process."
        correct: false
        feedback: "They are different processes: digestion uses the host's enzymes, while fermentation is bacterial metabolism of what the host could not digest."
      - text: "Fermentation happens in the stomach using acid."
        correct: false
        feedback: "Fermentation is anaerobic bacterial metabolism in the colon, not acid digestion in the stomach."
  - id: q-butyrate
    stem: "Which short-chain fatty acid is the preferred fuel of the cells lining the colon?"
    options:
      - text: "Butyrate, because it fuels the colonocytes."
        correct: true
        feedback: "Butyrate is the least abundant of the three SCFAs but the most important locally, which makes this an easy question to get wrong by reasoning from abundance."
      - text: "Acetate, because it's the most abundant."
        correct: false
        feedback: "Acetate is the most abundant, but it travels systemically. The colonocyte's fuel is butyrate."
      - text: "Propionate, because it goes to the liver."
        correct: false
        feedback: "Propionate goes to the liver (gluconeogenesis). The colonocyte fuel is butyrate."
  - id: q-gas
    stem: "Why do beans, onions or too much milk give some people wind?"
    options:
      - text: "Colonic bacteria ferment the carbohydrate, producing gas."
        correct: true
        feedback: "Colonic bacteria ferment the fermentable carbohydrate (or undigested lactose), producing gas (H₂, CO₂, CH₄), which is usually a sign that fermentation is proceeding normally. Undigested lactose reaching the colon (see the *Digestion & Absorption* chapter) is a classic example."
      - text: "The stomach can't handle these foods, so acid escapes as gas."
        correct: false
        feedback: "The gas comes from bacterial fermentation in the colon, not from the stomach."
      - text: "It always means something is wrong with the microbiome."
        correct: false
        feedback: "Normal fermentation makes gas. Wind after these foods is usually a sign that fermentation is working."
  - id: q-diversity
    stem: "Why does eating a *variety* of plants matter for the microbiome, as well as the total amount of fibre?"
    options:
      - text: "Microbes cross-feed, so diverse fibres feed a diverse community."
        correct: true
        feedback: "Microbes cross-feed: one species breaks fibre into products that another uses. Many butyrate producers cannot break fibre down themselves and live on what primary degraders release, so diverse fibres feed a diverse, resilient community."
      - text: "Different plants each contain a different vitamin the microbiome needs."
        correct: false
        feedback: "The mechanism is cross-feeding among microbes, not plant vitamins. Diverse fibre substrates support a diverse microbial community."
      - text: "It doesn't; total fibre is all that matters."
        correct: false
        feedback: "Variety matters: diverse fibres support diverse microbes through cross-feeding, which makes the community more resilient."
  - id: q-b12
    stem: "Can you rely on your gut bacteria to supply your vitamin B12?"
    options:
      - text: "No, microbial synthesis is downstream of where B12 is absorbed."
        correct: true
        feedback: "Most microbial synthesis is in the colon, downstream of the terminal ileum where B12 is absorbed, and gut microbes are net consumers of B12. Dietary (animal-source) B12 is the functional supply: 'made in the gut' does not mean 'available to the host'."
      - text: "Yes, gut bacteria make all the B12 you need."
        correct: false
        feedback: "Colonic synthesis sits past the absorption site (terminal ileum), and microbes mostly consume B12. Diet is the functional source."
      - text: "Yes, but only if you take a probiotic."
        correct: false
        feedback: "The problem is anatomical (synthesis downstream of absorption), which a probiotic does not fix. Dietary B12 is the answer."
  - id: q-fermented
    stem: "Is a fermented food the same as a probiotic?"
    options:
      - text: "No, a probiotic must be live, defined, dosed microbes."
        correct: true
        feedback: "A fermented food is defined by its process, and many are cooked or pasteurised; a probiotic must be live, defined, dosed microbes shown to benefit health. Tempeh and boiled miso are fermented but carry few or no live microbes; they are still good foods."
      - text: "Yes, all fermented foods are probiotics."
        correct: false
        feedback: "Many fermented foods (tempeh, bread, cooked miso) have few or no live microbes. Only defined, dosed, live products meet the probiotic definition."
      - text: "Yes, as long as the food is plant-based."
        correct: false
        feedback: "Being plant-based is irrelevant. What matters is whether the food delivers live, defined, dosed microbes, and most fermented foods do not."
  - id: q-fmt
    stem: "Faecal microbiota transplant (FMT) is a proven, approved treatment for which single condition?"
    options:
      - text: "Recurrent Clostridioides difficile infection."
        correct: true
        feedback: "FMT cures the large majority of recurrent C. difficile cases and has FDA-approved products, but only for that indication."
      - text: "Obesity and weight loss."
        correct: false
        feedback: "Obesity is not a proven indication. The one proven indication for FMT is recurrent C. difficile infection."
      - text: "General wellness and 'resetting' the gut."
        correct: false
        feedback: "Wellness is not an indication: FMT is a medical therapy for recurrent C. difficile, and it carries a real risk of transmitting infection."
  - id: q-serotonin
    stem: "Your gut makes ~90–95% of your body's serotonin. Does that mean gut serotonin controls your mood?"
    options:
      - text: "No, peripheral serotonin does not cross the blood–brain barrier."
        correct: true
        feedback: "Gut serotonin regulates gut motility and cannot reach the brain directly. A gut–brain axis exists, but 'gut serotonin = happiness' is a metaphor without a mechanism."
      - text: "Yes, the gut serotonin travels to the brain and lifts your mood."
        correct: false
        feedback: "Peripheral serotonin does not cross the blood–brain barrier. Gut serotonin drives gut motility, not mood."
      - text: "Yes, which is why probiotics are proven antidepressants."
        correct: false
        feedback: "'Psychobiotic' mood benefits in humans are mostly unproven, and gut serotonin does not cross into the brain."
