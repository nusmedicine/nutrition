id: dietary-guidelines-patterns
title: "Quick check: guidelines & healthy patterns"
questions:
  - id: q1
    stem: "On My Healthy Plate (\"quarter, quarter, half\"), what fills the half?"
    options:
      - text: "Fruit and vegetables"
        correct: true
        feedback: "½ fruit & vegetables, ¼ wholegrains, ¼ protein. The vegetable half is the largest section, and most adults here eat less fruit and vegetables than recommended."
      - text: "Wholegrains"
        correct: false
        feedback: "Wholegrains fill a quarter of the plate."
      - text: "Protein"
        correct: false
        feedback: "Protein is a quarter; the half is fruit & vegetables."

  - id: q2
    stem: "A patient asks which dietary guideline is \"right\": WHO, the American Heart Association or the US guidelines. What is the best answer?"
    options:
      - text: "They broadly converge on the same core messages"
        correct: true
        feedback: "The differences are mostly wording and emphasis. A review of 90 national guidelines found near-universal agreement: variety, plenty of fruit and vegetables, wholegrains, legumes, and limits on sugar, salt and certain fats. That convergence is the reassuring answer."
      - text: "The US guidelines are the most scientific, so follow those"
        correct: false
        feedback: "The guidelines agree far more than they differ, and the shared core is what matters."
      - text: "They contradict each other, so guidelines aren't useful"
        correct: false
        feedback: "Their striking feature is how little they disagree on the core messages."

  - id: q3
    stem: "Why do modern guidelines increasingly emphasise whole dietary patterns?"
    options:
      - text: "Because foods act in combination (\"food synergy\")"
        correct: true
        feedback: "People eat foods, which act in combination, so a whole pattern can predict health better than any nutrient in isolation. Food synergy is a framework for interpreting evidence. It does not provide a precise effect size to quote."
      - text: "Because single nutrients have no effect on health"
        correct: false
        feedback: "Individual nutrients do matter, but their effects are best understood within the overall dietary pattern in which they are eaten."
      - text: "Because patterns are easier to sell to the public"
        correct: false
        feedback: "The reason is scientific (food synergy), although patterns are also easier to communicate."

  - id: q4
    stem: "A relative says: *\"PREDIMED proves the Mediterranean diet prevents heart attacks, guaranteed.\"* What is the most important caveat?"
    options:
      - text: "It was a relative effect on a composite endpoint"
        correct: true
        feedback: "PREDIMED's ~30% reduction was a relative effect on a stroke-dominated composite (heart attack and cardiovascular death were not individually significant), and the trial was retracted and re-published. A relative effect on a composite is good evidence for the pattern, but it cannot predict any individual outcome."
      - text: "PREDIMED found no benefit at all"
        correct: false
        feedback: "A benefit was found on the composite endpoint; the task is to state it accurately."
      - text: "Nothing: whoever follows the diet is guaranteed no heart attack"
        correct: false
        feedback: "This conflates relative with absolute risk, and a composite with a hard endpoint, which is the overclaim to avoid."

  - id: q5
    stem: "The DASH trial lowered blood pressure by about 5.5/3.0 mmHg. Which caveat matters most when citing it?"
    options:
      - text: "Blood pressure is a surrogate, measured over only ~8 weeks"
        correct: true
        feedback: "Blood pressure is a surrogate and the trial was short, so DASH shows that a pattern changes a risk factor. Whether it prevents cardiovascular events was not tested. Weight and sodium were held constant, so the fall came from the pattern itself."
      - text: "DASH is simply a low-salt diet"
        correct: false
        feedback: "Sodium was held constant in the trial, so the effect came from the whole pattern. Cutting salt on top of DASH lowers blood pressure further."
      - text: "The blood-pressure fall was too small to matter"
        correct: false
        feedback: "A 5.5/3.0 mmHg fall (and ~11.4/5.5 mmHg in participants with hypertension) is clinically meaningful. The caveat concerns the surrogate endpoint and the duration."

  - id: q6
    stem: "A vegetarian Indian family is told their diet lacks protein because they eat no meat. Using My Healthy Plate, what is the right response?"
    options:
      - text: "Dhal and other legumes fill the protein quarter"
        correct: true
        feedback: "Vegetarian does not mean protein-free. The plate is built around legumes, with a wholemeal chapati and a generous vegetable half: the aim is to adapt the family's own food to quarter-quarter-half."
      - text: "Switch them to a Mediterranean diet for protein"
        correct: false
        feedback: "Imposing an unfamiliar pattern is unnecessary: the family's own cuisine already supplies protein through legumes and dairy, and dietary patterns are principles to adapt to a family's own food."
      - text: "Meat is needed for enough protein"
        correct: false
        feedback: "Legumes, dairy and soy cover the protein quarter well within a vegetarian diet, so meat is unnecessary."

  - id: q7
    stem: "Singapore's National Nutrition Survey points to two major gaps in the local diet. Which pair?"
    options:
      - text: "Too few wholegrains and too much sodium"
        correct: true
        feedback: "Wholegrains are only ~4% of staples and most residents exceed the sodium limit, which makes the brown-rice swap and cutting salt and sugary drinks the two most useful changes."
      - text: "Too little protein and too little fat"
        correct: false
        feedback: "Neither is a main local gap; the survey points to the wholegrain shortfall and excess sodium."
      - text: "Too few supplements and superfoods"
        correct: false
        feedback: "The gaps are in everyday staples (wholegrains) and sodium."
