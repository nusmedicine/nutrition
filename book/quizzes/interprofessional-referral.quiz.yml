id: interprofessional-referral
title: "Quick check: interprofessional practice & referral"
questions:
  - id: q1
    stem: "Which patient most clearly needs referral to a dietitian rather than your general advice?"
    options:
      - text: "Newly diagnosed diabetes with early kidney impairment on three medicines"
        correct: true
        feedback: "Diabetes with early kidney impairment, on three medicines, needs an individualised, therapeutic plan (medical nutrition therapy), which is a dietitian's role. Give safe interim advice and refer."
      - text: "A well adult who asks for general tips on eating more healthily"
        correct: false
        feedback: "This is universal advice (My Healthy Plate, more vegetables, fewer sugary drinks), which is squarely in your scope. No referral is needed."
      - text: "A patient wondering whether to swap white rice for brown rice"
        correct: false
        feedback: "Swapping white rice for brown is a general dietary-pattern shift anyone can act on, so encourage it. It needs no individualised therapy and no referral."
  - id: q2
    stem: "A colleague's dietitian referral reads only \"please advise on diet\". What is the main problem?"
    options:
      - text: "It gives no diagnoses, medications, results, weight trend or goals to act on"
        correct: true
        feedback: "A vague referral wastes a scarce resource. A useful one carries the reason and urgency, diagnoses, medications, key results, the weight trend, and the patient's goals and social context."
      - text: "Referrals should never be written until the patient has failed advice first"
        correct: false
        feedback: "Referral is a competency and a safety behaviour, not a last resort. The problem here is that the note is uninformative, not that it was made."
      - text: "Diet is not something a dietitian should be asked about"
        correct: false
        feedback: "Individualised diet therapy is exactly the dietitian's role. The issue is the referral's lack of detail."
  - id: q3
    stem: "What best describes medical nutrition therapy (MNT)?"
    options:
      - text: "An individualised, therapeutic nutrition plan delivered by a dietitian"
        correct: true
        feedback: "MNT is a registered dietitian's structured, individualised cycle of assessment, diagnosis, intervention and monitoring for a medical condition. It is distinct from the universal advice any clinician gives."
      - text: "Any dietary advice at all given to a patient during a consultation"
        correct: false
        feedback: "That conflates the two: general healthy-eating guidance is not MNT. Treating all advice as MNT would leave a clinician too afraid to give safe basic advice."
      - text: "A fixed diet sheet handed out to everyone with the same diagnosis"
        correct: false
        feedback: "A one-size printout is universal advice, not therapy; MNT is individualised and monitored."
  - id: q4
    stem: "In a team caring for a patient with a chronic condition, whose core role is reviewing medications?"
    options:
      - text: "The pharmacist, working alongside the doctor"
        correct: true
        feedback: "The pharmacist reviews and reconciles medications, while the family doctor coordinates, the dietitian delivers MNT, and the nurse monitors and educates. Nutrition care is rarely a solo act."
      - text: "The dietitian, as part of the nutrition plan"
        correct: false
        feedback: "Dietitians deliver medical nutrition therapy; medication review is the pharmacist's core role."
      - text: "Whoever happens to see the patient first"
        correct: false
        feedback: "Team-based care works because roles are defined, not improvised. Medication review belongs to the pharmacist."
  - id: q5
    stem: "What does Singapore's Healthier SG model give every enrolled resident?"
    options:
      - text: "One enrolled family doctor and a personalised Health Plan"
        correct: true
        feedback: "Healthier SG anchors each enrolled resident to one family doctor and a personalised Health Plan, with hand-offs to the dietitian, nurse and pharmacist and social prescribing to community partners. It is the primary-care infrastructure that makes referral and follow-up happen."
      - text: "A guaranteed fully-funded course of dietitian visits for any concern"
        correct: false
        feedback: "The published funding centres on medications and care components and does not spell out a dedicated dietitian subsidy line. Explain the pathway, and check current figures, instead of promising a guaranteed benefit."
      - text: "A fixed diet plan issued automatically at enrolment"
        correct: false
        feedback: "Healthier SG provides a family doctor and a Health Plan, not an automatic diet. Any individualised plan would come via referral."
  - id: q6
    stem: "A patient read that a diet programme reversed diabetes. What is the accurate framing?"
    options:
      - text: "Those results came from intensive programmes in selected patients"
        correct: true
        feedback: "The headline results came from intensive, team-delivered programmes. DiRECT's remission used a structured total-diet-replacement programme in early, non-insulin-treated diabetes, and the Diabetes Prevention Program's effect came from a 16-session curriculum. Don't promise those outcomes from brief advice alone."
      - text: "A short chat about diet in clinic reliably produces the same remission"
        correct: false
        feedback: "Those outcomes needed intensive, multi-session, team-based programmes in selected groups, not a clinic conversation."
      - text: "Diet cannot influence diabetes, so the claim is meaningless"
        correct: false
        feedback: "Diet does matter in diabetes, but the specific remission results came from intensive structured programmes, not everyday advice."
  - id: q7
    stem: "How should you read the evidence on a clinician's own diet and activity habits?"
    options:
      - text: "They are associated with more preventive counselling"
        correct: true
        feedback: "Clinicians who look after their own health are observed to counsel more often, and arguably more credibly, though the evidence is associational, not proof of cause. Self-care is a professional and patient-safety issue, not an indulgence."
      - text: "They have been proven to directly cause better patient outcomes"
        correct: false
        feedback: "The role-model evidence is observational. Present it as plausible and consistent, not as proven cause and effect."
      - text: "They are a private matter with no bearing on practice"
        correct: false
        feedback: "Evidence suggests a clinician's own habits track with counselling behaviour and credibility, and short sleep affects their own metabolic health too."
