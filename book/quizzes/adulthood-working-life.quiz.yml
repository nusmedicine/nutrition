id: adulthood-working-life
title: "Quick check: adulthood & working life"
questions:
  - id: q1
    stem: "A 45-year-old says he's gaining weight because \"my metabolism has slowed down with age.\" What's the most accurate response?"
    options:
      - text: "Expenditure is broadly steady from about 20 to 60; the creep is a small chronic surplus"
        correct: true
        feedback: "Doubly labelled water data show stable expenditure through these decades; midlife weight creep comes from a small chronic surplus, usually from falling activity and muscle plus a little more intake. The aim is to stay active and preserve muscle."
      - text: "Yes, basal metabolic rate falls steadily from the thirties, so gain is inevitable"
        correct: false
        feedback: "This is the commonest explanation, but adjusted energy expenditure is stable from about 20 to 60 and falls only later in life; the creep comes from a small surplus, usually driven by declining activity and muscle."
      - text: "It's purely genetic, so changing behaviour would make no difference"
        correct: false
        feedback: "The surplus is small and modifiable. Small, sustainable habits and preserving muscle address it; the metabolism is not the cause."

  - id: q2
    stem: "A healthy adult does three 45-minute moderate gym sessions a week and asks what to eat and drink around them. Best advice?"
    options:
      - text: "An ordinary healthy plate and water; no sports drink, gel or powder"
        correct: true
        feedback: "At this common level of activity, normal food and water cover the need. High-carbohydrate and during-exercise advice is designed for athletes at true endurance training volumes."
      - text: "Carbohydrate-load the day before and drink a sports drink during each session"
        correct: false
        feedback: "This is athlete guidance applied out of context: carb-loading and during-exercise sports drinks are for long endurance efforts. Water is enough for a 45-minute gym session."
      - text: "A protein shake within 30 minutes of every session, or the workout is wasted"
        correct: false
        feedback: "The 'anabolic window' is far wider than marketed: once daily protein is adequate, precise timing barely matters, and food is sufficient."

  - id: q3
    stem: "An active adult wants to build a bit of muscle and asks about protein. Which is the evidence-based advice?"
    options:
      - text: "Around 1.2–1.6 g/kg/day, paired with resistance exercise"
        correct: true
        feedback: "About 1.2–1.6 g/kg/day, spread across meals and easily reached from food, is enough for muscle, and the benefit plateaus near there; the RDA (about 0.8 g/kg/day) is a minimum. Protein without a stimulus does little, so resistance exercise two or more times a week is also needed."
      - text: "3 g/kg/day or more, since extra protein always builds more muscle"
        correct: false
        feedback: "Benefit plateaus around 1.6 g/kg/day, so a very high intake adds nothing for muscle. A moderate range from food is enough."
      - text: "Protein alone will build muscle without needing to exercise"
        correct: false
        feedback: "Muscle needs a stimulus, which is resistance exercise; without it, extra protein does little."

  - id: q4
    stem: "A healthy 38-year-old with normal kidneys is worried that a higher-protein diet will \"damage her kidneys.\" What do you tell her?"
    options:
      - text: "Higher protein intakes are safe with normal kidney function"
        correct: true
        feedback: "Higher intakes show no harm to healthy kidneys. The exception is established kidney disease (see the *Chronic kidney disease* chapter)."
      - text: "Yes, any protein above the RDA damages healthy adults' kidneys"
        correct: false
        feedback: "Healthy kidneys tolerate higher protein; the concern applies to people who already have kidney disease."
      - text: "Only animal protein harms kidneys; plant protein is unlimited"
        correct: false
        feedback: "The reassurance about healthy kidneys applies to plant and animal protein alike, and for muscle, plant and animal protein are roughly equivalent when the total is adequate."

  - id: q5
    stem: "A patient mentions he drinks \"a glass of red wine most nights, for my heart.\" What's the current, evidence-based message?"
    options:
      - text: "The heart claim doesn't hold up, and there's no safe level for cancer risk"
        correct: true
        feedback: "Advice on alcohol has reversed. The claim came from biased comparisons: the 'abstainer' groups included ex-drinkers who had quit because of illness. Mendelian randomisation studies, which remove that bias, find no cardioprotection and harm even at low intake, and alcohol is a Group 1 carcinogen, so no one should be advised to drink for their heart."
      - text: "A daily glass of red wine protects the heart, so he should continue"
        correct: false
        feedback: "This was the older advice. The apparent benefit came from abstainer bias, and Mendelian randomisation studies that remove the bias find no protection. Never recommend drinking for cardiovascular benefit."
      - text: "Alcohol is only harmful in heavy drinkers, so light drinking carries no risk"
        correct: false
        feedback: "A meaningful share of alcohol-related cancers arise at light-to-moderate intake, and there is no established safe level for cancer risk."

  - id: q6
    stem: "A patient tells you he \"goes bright red\" after one beer but drinks regularly. Why does this matter?"
    options:
      - text: "The flush marks acetaldehyde build-up and raised oesophageal-cancer risk"
        correct: true
        feedback: "Acetaldehyde is a carcinogen, and the ALDH2 variant behind the flush is common in East Asians. Flushing combined with continued drinking carries the highest risk, so ask about flushing and advise cutting down."
      - text: "It means he can't hold his drink, so reassure him it's harmless"
        correct: false
        feedback: "The flush marks acetaldehyde build-up and a raised oesophageal-cancer risk with continued drinking, so it is a reason to advise cutting down."
      - text: "It means he's allergic to alcohol and should carry an adrenaline pen"
        correct: false
        feedback: "An enzyme (ALDH2) variant causes the acetaldehyde build-up, so this is not an allergy. The concern is long-term cancer risk."

  - id: q7
    stem: "A rotating-shift nurse asks how to eat better on nights. Which single change has the best evidence?"
    options:
      - text: "Eat main meals by day; avoid heavy eating in the small hours"
        correct: true
        feedback: "In a controlled trial, daytime-weighted eating prevented the glucose intolerance of simulated night work. Shift work is associated with higher diabetes risk through circadian misalignment, and moving intake toward the day is the best-supported practical change."
      - text: "Eat the largest meal at 3 a.m. to keep energy up through the shift"
        correct: false
        feedback: "Heavy eating in the small hours worsens metabolic health, so move meals toward the daytime."
      - text: "Skip eating entirely on night shifts"
        correct: false
        feedback: "Fasting through every shift is not needed or advisable; the useful change is meal *timing*, weighted toward the daytime."
