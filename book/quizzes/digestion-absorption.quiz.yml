id: digestion-absorption
title: "Quick check: digestion & absorption"
questions:
  - id: q1
    stem: "Where does most digestion and absorption of nutrients happen?"
    options:
      - text: "The small intestine"
        correct: true
        feedback: "The small intestine is the main site of both. The stomach mainly stores and mixes food and starts protein digestion."
      - text: "The stomach"
        correct: false
        feedback: "Protein digestion starts in the stomach, but most of it takes place in the small intestine."
      - text: "The large intestine"
        correct: false
        feedback: "The large intestine mainly reabsorbs water and forms stool; little nutrient digestion happens there."

  - id: q2
    stem: "Where does chemical digestion begin?"
    options:
      - text: "In the mouth, with salivary amylase"
        correct: true
        feedback: "Chewing plus salivary amylase (and a little lingual lipase) start digestion before food is swallowed."
      - text: "In the stomach, with acid"
        correct: false
        feedback: "The stomach continues digestion, but it begins in the mouth with salivary amylase."
      - text: "In the duodenum, with pancreatic enzymes"
        correct: false
        feedback: "Pancreatic enzymes carry out much of the digestion, but the first step is salivary amylase in the mouth."

  - id: q3
    stem: "Which pair correctly describes the two main gut movements?"
    options:
      - text: "Peristalsis pushes food along; segmentation mixes it"
        correct: true
        feedback: "Peristalsis is a set of propulsive waves; segmentation is back-and-forth mixing, mainly in the small intestine."
      - text: "Peristalsis mixes food; segmentation pushes it along"
        correct: false
        feedback: "This reverses the two: peristalsis pushes, segmentation mixes."
      - text: "Both push food along at the same speed"
        correct: false
        feedback: "They have different functions: one propels, the other mixes."

  - id: q4
    stem: "The pancreas secretes its protein-digesting enzymes in an inactive form. Why?"
    options:
      - text: "So the enzymes don't digest the pancreas itself"
        correct: true
        feedback: "Proteases are secreted as inactive precursors (zymogens) and activated only after they reach the intestine."
      - text: "Because inactive enzymes are cheaper for the body to make"
        correct: false
        feedback: "The reason is safety: active proteases in the pancreas would damage it."
      - text: "Because they only work in the acidic stomach"
        correct: false
        feedback: "Pancreatic enzymes need the near-neutral pH that bicarbonate produces in the duodenum."

  - id: q5
    stem: "Which hormone triggers the pancreas to release bicarbonate to neutralise stomach acid?"
    options:
      - text: "Secretin"
        correct: true
        feedback: "Acid entering the duodenum releases secretin, which drives bicarbonate secretion to neutralise the acid."
      - text: "Gastrin"
        correct: false
        feedback: "Gastrin does the opposite: it increases stomach acid."
      - text: "Motilin"
        correct: false
        feedback: "Motilin drives the migrating motor complex between meals; secretin triggers bicarbonate release."

  - id: q6
    stem: "A fatty meal arrives in the duodenum. Which hormone contracts the gallbladder and stimulates pancreatic enzyme secretion?"
    options:
      - text: "CCK"
        correct: true
        feedback: "CCK contracts the gallbladder (releasing bile) and stimulates pancreatic enzymes; it also slows gastric emptying."
      - text: "Secretin"
        correct: false
        feedback: "Secretin stimulates bicarbonate secretion; CCK stimulates bile release and enzyme secretion."
      - text: "Insulin"
        correct: false
        feedback: "Insulin acts on blood glucose after absorption; it is not the gallbladder signal."

  - id: q7
    stem: "About 95% of Singapore-born Chinese adults are lactase-deficient. What does that mean in practice?"
    options:
      - text: "Low lactase, which is neither intolerance nor allergy"
        correct: true
        feedback: "Deficient (low lactase) is not the same as intolerant (symptoms from a given amount), and both differ from allergic (an immune reaction to milk protein). Most still tolerate about a cup of milk."
      - text: "Almost all will have symptoms after any dairy"
        correct: false
        feedback: "Only about a third get symptoms on ordinary amounts, and most tolerate roughly a cup of milk."
      - text: "They are allergic to milk protein"
        correct: false
        feedback: "Lactase deficiency concerns digesting a sugar; milk allergy is a separate immune reaction to milk protein."

  - id: q8
    stem: "How big is the small intestine's absorptive surface?"
    options:
      - text: "About 30–40 m², roughly half a badminton court"
        correct: true
        feedback: "Careful measurement gives about 30–40 m². The older 'tennis court' figure has been revised downwards."
      - text: "About 200–300 m², a full tennis court"
        correct: false
        feedback: "That is the older textbook figure; measured carefully, the area is much smaller (about 30–40 m²)."
      - text: "About 1–2 m², the same as the skin"
        correct: false
        feedback: "Folds, villi and microvilli amplify it far beyond skin area, to roughly 30–40 m²."

  - id: q9
    stem: "How is glucose absorbed across the gut lining?"
    options:
      - text: "By secondary active transport, via SGLT1"
        correct: true
        feedback: "A sodium gradient, maintained by the sodium pump, powers SGLT1, which carries glucose in alongside sodium. Fructose, by contrast, crosses by facilitated diffusion (GLUT5)."
      - text: "By simple passive diffusion, like water"
        correct: false
        feedback: "Glucose crosses by secondary active transport through SGLT1, coupled to sodium; oral rehydration relies on that coupling."
      - text: "It isn't absorbed in the small intestine"
        correct: false
        feedback: "The small intestine absorbs glucose via SGLT1, and the glucose then exits to the portal blood."

  - id: q10
    stem: "After absorption, how does most dietary fat reach the bloodstream?"
    options:
      - text: "Packaged into chylomicrons that enter the lymph"
        correct: true
        feedback: "Long-chain fat is re-esterified, packed into chylomicrons and carried by the lymph (via the lacteals), bypassing the liver's first pass. Short- and medium-chain fatty acids are the small exception, entering blood directly."
      - text: "Dissolved directly in the blood plasma like glucose"
        correct: false
        feedback: "Fat does not dissolve in water; it travels as chylomicrons in lymph, then blood."
      - text: "Absorbed unchanged as whole triglyceride droplets"
        correct: false
        feedback: "Triglyceride is first digested to fatty acids and monoglycerides, carried by micelles, then re-esterified and packaged as chylomicrons."

  - id: q11
    stem: "Where is bile made, and what happens to it after a meal?"
    options:
      - text: "Made by the liver; most is reabsorbed and recycled"
        correct: true
        feedback: "The liver makes bile, the gallbladder stores it, and about 95% of bile salts are reclaimed at the terminal ileum and reused (the enterohepatic circulation)."
      - text: "Made by the gallbladder; used up with each meal"
        correct: false
        feedback: "Bile is only stored and concentrated in the gallbladder; the liver makes it, and about 95% of the bile salts are recycled."
      - text: "Made by the pancreas; all lost in stool"
        correct: false
        feedback: "The liver makes bile, and most is reabsorbed and recycled."

  - id: q12
    stem: "Oral rehydration salts contain glucose and sodium. Why not plain water?"
    options:
      - text: "SGLT1 carries glucose and sodium in, and water follows"
        correct: true
        feedback: "SGLT1 cotransports glucose with sodium, and water follows the sodium by osmosis. Plain water lacks both, which is why ORS works better."
      - text: "The glucose is mainly there for calories and energy"
        correct: false
        feedback: "Here the glucose is cotransported with sodium through SGLT1; it is not primarily a fuel."
      - text: "The salt is only there to make it taste better"
        correct: false
        feedback: "Sodium is co-absorbed with glucose through SGLT1; it is essential to the mechanism."
