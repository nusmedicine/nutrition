id: appetite-weight-regulation-basics
title: "Quick check: appetite and weight regulation"
questions:
  - id: q-leptin-ghrelin
    stem: "Which pairing is correct?"
    options:
      - text: "Leptin signals fullness; ghrelin signals hunger."
        correct: true
        feedback: "Leptin, made by fat, is the long-term signal of fat stores that suppresses appetite; ghrelin, made by the stomach, is the short-term hunger hormone that rises before meals and falls after eating. The two are easily swapped."
      - text: "Leptin signals hunger; ghrelin signals fullness."
        correct: false
        feedback: "This reverses them. Leptin (from fat) suppresses appetite over the long term; ghrelin (from the stomach) drives hunger before meals."
      - text: "Both are made by the stomach and signal fullness."
        correct: false
        feedback: "Only ghrelin comes from the stomach, and it signals hunger; leptin is made by fat and is the long-term signal of fat stores."
  - id: q-mc4r
    stem: "MC4R mutations are the commonest single-gene cause of severe obesity. What does that show?"
    options:
      - text: "That appetite is a drive set by biology."
        correct: true
        feedback: "When the satiety signal cannot act at MC4R, people become relentlessly hungry, so appetite is a real drive set by a brain circuit. This is the biological basis for treating weight without blame."
      - text: "That obesity is always genetic in origin."
        correct: false
        feedback: "MC4R mutations explain only a small fraction (about 6%) of severe childhood-onset obesity. Their importance is what they show: appetite is a signalled biological drive."
      - text: "That people with obesity lack willpower."
        correct: false
        feedback: "A broken appetite circuit causes hunger regardless of willpower, so the finding points away from blame."
  - id: q-leptin-resistance
    stem: "Why doesn't giving leptin cure common obesity?"
    options:
      - text: "Their leptin is high, and the brain resists it."
        correct: true
        feedback: "More fat makes more leptin, but the brain stops responding (leptin resistance), so giving more does little. Recombinant leptin gave only modest, variable weight loss in common obesity, although it rescues the rare person with congenital deficiency."
      - text: "They lack leptin and need much larger doses."
        correct: false
        feedback: "Leptin deficiency is the rare congenital case. In common obesity leptin is high, and the problem is resistance, not deficiency."
      - text: "Leptin works only when combined with a diet."
        correct: false
        feedback: "Diet is not the missing ingredient: the brain ignores the high leptin already present (leptin resistance), so leptin therapy does not work for common obesity."
  - id: q-satiation-satiety
    stem: "You put your fork down, full, at the end of a meal. Which term describes what just ended the meal?"
    options:
      - text: "Satiation."
        correct: true
        feedback: "Satiation is the fullness that builds during a meal and ends it (it sets meal size); satiety is the later fullness that delays the next meal; hunger starts a meal."
      - text: "Satiety."
        correct: false
        feedback: "Satiety is the fullness after the meal that delays the next one. What ends the meal itself is satiation."
      - text: "Hunger."
        correct: false
        feedback: "Hunger starts a meal; satiation is what ends it."
  - id: q-liquid
    stem: "Two snacks contain the same 450 kcal: one as jelly beans (solid), one as soft drink (liquid). What tends to happen?"
    options:
      - text: "The liquid calories are poorly compensated for."
        correct: true
        feedback: "People eat less later to offset solid calories but not liquid ones, so liquid calories give weak satiety, poor compensation and weight gain. The same logic favours eating fruit over drinking it."
      - text: "Both are compensated for equally, as the calories match."
        correct: false
        feedback: "Identical calories were not handled identically: in the classic study, the same 450 kcal as soft drink produced no compensation and caused weight gain, unlike the jelly beans."
      - text: "The liquid is more filling, as it is absorbed faster."
        correct: false
        feedback: "Liquid calories empty from the stomach fast and give weak fullness, so they are poorly compensated for."
  - id: q-wanting-liking
    stem: "You intensely crave a food you don't even enjoy that much any more. Which brain process is driving the craving?"
    options:
      - text: "'Wanting', driven by dopamine."
        correct: true
        feedback: "Dopamine drives the pursuit (wanting), which is separate from liking, the actual pleasure; the two can come apart. The popular idea that dopamine is the pleasure chemical does not fit this evidence."
      - text: "'Liking', driven by dopamine."
        correct: false
        feedback: "Liking, the pleasure itself, depends on opioid hotspots; dopamine drives wanting. A person can want what they no longer like."
      - text: "Low blood glucose driving true hunger."
        correct: false
        feedback: "This is reward-driven (hedonic) wanting, not homeostatic hunger from low energy, and it is the dopamine-driven pursuit, distinct from pleasure."
  - id: q-defended
    stem: "A patient loses weight, then over the next year feels constantly hungry and regains most of it despite eating carefully. Why?"
    options:
      - text: "Hormonal and metabolic changes after weight loss favour regain."
        correct: true
        feedback: "Weight regain is the predicted output of body-weight regulation: leptin fell, hunger hormones rose (and stay raised for a year), and energy expenditure dropped more than body size predicts (metabolic adaptation). All three favour regaining the lost fat."
      - text: "The patient simply lacks the discipline to maintain the diet."
        correct: false
        feedback: "Discipline is not what failed: persistent hunger-hormone shifts plus adaptive thermogenesis actively oppose weight maintenance."
      - text: "The lost weight was only water, so it returned automatically."
        correct: false
        feedback: "Real fat was lost; the regain is driven by body-weight regulation (falling leptin, rising hunger hormones, adaptive thermogenesis)."
  - id: q-adaptation
    stem: "Is it true that dieting 'permanently wrecks your metabolism'?"
    options:
      - text: "No, adaptation is real but modest and largely reversible."
        correct: true
        feedback: "In ordinary dieters metabolic adaptation is modest and largely reversible. The 'permanent damage' story comes from an extreme outlier, the Biggest Loser study, and is better explained by sustained high activity than by damage. Adaptation makes maintenance harder but does not make weight loss impossible."
      - text: "Yes, every diet permanently lowers metabolism by about 500 kcal/day."
        correct: false
        feedback: "The figure of about 500 kcal/day comes from the Biggest Loser outlier (extreme, rapid loss plus very high activity). In ordinary dieters adaptation is modest and largely reversible."
      - text: "No, metabolism never changes with body weight."
        correct: false
        feedback: "Adaptive thermogenesis is real: expenditure does drop more than body size predicts. It is modest and largely reversible, not permanent damage."
  - id: q-glp1
    stem: "How do GLP-1 receptor agonists cause weight loss, and what happens when the drug is stopped?"
    options:
      - text: "They amplify satiety; weight returns on stopping."
        correct: true
        feedback: "They act on the same satiety circuit as the body's own GLP-1, shifting the arcuate nucleus toward POMC (satiety) activity and slowing gastric emptying, so hunger falls. Regain on stopping shows that obesity is a chronic, regulated condition."
      - text: "They permanently reset the defended range lower."
        correct: false
        feedback: "The drugs oppose the defended range while present but do not remove it, which is why weight returns when they are stopped."
      - text: "They block the absorption of calories from the gut."
        correct: false
        feedback: "GLP-1 receptor agonists work on appetite (central satiety and slower gastric emptying); they do not block absorption."
  - id: q-sleep
    stem: "How does short sleep affect appetite?"
    options:
      - text: "It raises ghrelin and lowers leptin, raising hunger."
        correct: true
        feedback: "Sleep loss tilts the same hormones toward hunger, especially hunger for calorie-dense foods, and on average adds about 385 kcal/day of intake with no matching rise in energy expenditure. It is a modifiable factor that 'eat less, move more' ignores."
      - text: "It suppresses appetite by raising leptin levels."
        correct: false
        feedback: "Short sleep lowers leptin and raises ghrelin, which increases hunger."
      - text: "It has no measurable effect on appetite hormones."
        correct: false
        feedback: "In a controlled experiment, two nights of short sleep lowered leptin, raised ghrelin and raised hunger, especially for calorie-dense foods."
