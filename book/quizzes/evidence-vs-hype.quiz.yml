id: evidence-vs-hype
title: "Quick check: evidence vs hype"
questions:
  - id: q1
    stem: "A patient shows you a headline: \"New study: turmeric cures arthritis.\" What should you do first to appraise it?"
    options:
      - text: "Find and judge the study behind it"
        correct: true
        feedback: "A claim can be appraised only once it has been traced to its source. Trace it from headline to study, design, outcome and applicability, then reach a verdict."
      - text: "Dismiss it, since turmeric is a fad"
        correct: false
        feedback: "Reflex cynicism ignores the evidence just as credulity does. Traced to its source, the conclusion might be 'weak' or 'modest but real'."
      - text: "Accept it, since it was a study"
        correct: false
        feedback: "\"A study\" could be a mouse experiment or an uncontrolled case series, so it has to be found and judged before it is believed."

  - id: q2
    stem: "Why do well-conducted cohort studies carry more weight in nutrition than they would for a new drug?"
    options:
      - text: "A diet often can't be blinded or trialled for decades"
        correct: true
        feedback: "Nutrition is a special case in the hierarchy of evidence: a diet often can't be blinded, there's no true 'no-food' placebo, and effects come from whole patterns over decades, so RCTs can't answer many dietary questions. Dismissing a finding because it has no RCT is usually a mistake here."
      - text: "Cohort studies are always more reliable than trials"
        correct: false
        feedback: "For a drug question the randomised trial is the stronger design. Nutrition is the special case, because diets are hard to blind and their effects build over decades."
      - text: "Nutrition research needs lower standards of evidence"
        correct: false
        feedback: "Nutrition needs good evidence as much as any field; the best feasible design for many dietary questions is a cohort, which is different from lowering the standard."

  - id: q3
    stem: "A supplement ad says it \"cuts your risk of a heart attack by 40%.\" What is the most important question to ask?"
    options:
      - text: "40% of what: what was the baseline absolute risk?"
        correct: true
        feedback: "A large relative reduction can be a tiny absolute one if the baseline risk was low: 40% off a 1-in-1,000 risk is very different from 40% off a 1-in-10 risk. Convert relative to absolute before judging."
      - text: "Nothing, since a 40% reduction is always clinically important"
        correct: false
        feedback: "Without the baseline (absolute) risk, a relative figure can greatly overstate the real benefit."
      - text: "Whether the advertisement itself is well designed"
        correct: false
        feedback: "An advertisement's polish is no guide to the evidence; whether the claim matters depends on the relative-versus-absolute distinction."

  - id: q4
    stem: "Time-restricted eating (16:8 fasting) has a genuine circadian rationale. What do the randomised trials show?"
    options:
      - text: "A modest effect, no better than ordinary calorie restriction"
        correct: true
        feedback: "The mechanism is plausible, but the trials found no metabolic 'reset': a plausible mechanism is not clinical proof. Time-restricted eating can be a useful eating structure for some people, judged by adherence."
      - text: "It resets the metabolism and beats every other diet"
        correct: false
        feedback: "Trials don't support that claim: its benefit comes largely from eating less, and it is no better than calorie restriction."
      - text: "It has no rationale and should be dismissed outright"
        correct: false
        feedback: "The circadian mechanism is real, so dismissing it over-corrects. Scepticism about the hype is different from dismissing the mechanism."

  - id: q5
    stem: "For which person is a supplement genuinely indicated?"
    options:
      - text: "A vegan with no reliable dietary source of vitamin B12"
        correct: true
        feedback: "A documented dietary need is a real indication, as are a deficiency and a life-stage need such as folate in pregnancy."
      - text: "A well-nourished adult who wants a multivitamin 'for general prevention'"
        correct: false
        feedback: "Supplements don't replace a balanced diet, and blanket prevention in a well-nourished person isn't supported."
      - text: "A smoker who wants beta-carotene 'antioxidants' to prevent cancer"
        correct: false
        feedback: "Beta-carotene supplements increased lung cancer in smokers, so taking it would be actively harmful. 'Natural' does not mean safe."

  - id: q6
    stem: "A widely shared 2024 trial reported that apple cider vinegar causes weight loss. What's the most important thing to check?"
    options:
      - text: "Whether the study has since been retracted"
        correct: true
        feedback: "Checking whether a study has been retracted is part of appraisal. That trial was retracted in 2025 when its analyses couldn't be reproduced, so it supports nothing, however viral the headline was."
      - text: "Nothing, since a randomised trial is reliable"
        correct: false
        feedback: "Design alone isn't enough: a randomised trial retracted for irreproducible analyses provides no support."
      - text: "Whether apple cider vinegar tastes acceptable"
        correct: false
        feedback: "Taste is beside the point: the evidence itself was withdrawn, and any real glycaemic effect is tiny compared with ordinary diet and activity."

  - id: q7
    stem: "A teenager asks whether cutting out dairy will clear her acne. What's the accurate, evidence-based answer?"
    options:
      - text: "The link is weak and does not justify cutting dairy"
        correct: true
        feedback: "The evidence is real but weak: the association is observational only (there are no randomised trials on dairy), and dermatology guidelines find insufficient evidence to recommend cutting any food. The stronger dietary link is high glycaemic load, and proven treatment is medication; a strict elimination diet is not justified, especially in a teenager."
      - text: "Yes, dairy definitely causes acne, so cut out all of it"
        correct: false
        feedback: "That overstates it: the evidence is a weak association from observational studies only; no trial shows dairy causes acne, and guidelines don't recommend cutting it."
      - text: "No, diet has nothing at all to do with acne"
        correct: false
        feedback: "Dairy does have a weak association with acne, and high glycaemic load a stronger one."
