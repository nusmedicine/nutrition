id: bone-health-osteoporosis
title: "Quick check: bone & joint health"
questions:
  - id: q1
    stem: "A patient asks how much of their bone strength is in their own hands. What's the accurate reply?"
    options:
      - text: "About 20–40% of peak bone mass is lifestyle-modifiable"
        correct: true
        feedback: "Peak bone mass is mostly inherited: only around 20–40% is modifiable by lifestyle (calcium and physical activity have the strongest evidence). That is a real but limited effect: build a high peak bone mass in youth, then slow its loss. A higher peak delays the onset of osteoporosis by years, which is not the same as a percentage cut in fractures."
      - text: "Essentially all of it; bone is purely a lifestyle matter"
        correct: false
        feedback: "The majority of peak bone mass is heritable; only about 20–40% is lifestyle-modifiable. Overselling it sets up false expectations."
      - text: "None of it; bone mass is entirely fixed at birth"
        correct: false
        feedback: "Bone mass is not fixed: about 20–40% is modifiable through the accrual years (calcium, activity), and the modifiable factors still matter across adulthood. Their effect is real but limited."
      - text: "It only becomes modifiable after menopause"
        correct: false
        feedback: "The main window is youth, when peak bone mass is built; menopause is when women lose bone fastest. The modifiable factors matter across the whole life course."

  - id: q2
    stem: "A patient says \"spinach is full of calcium, so it's great for my bones\". What's the accurate response?"
    options:
      - text: "Its calcium is oxalate-bound and barely absorbed (~5%)"
        correct: true
        feedback: "Calcium content is not the same as bioavailability: spinach's calcium is bound by oxalate and only about 5% is absorbed, versus roughly a quarter to a third from milk or calcium-set tofu, and about half from low-oxalate greens such as bok choy. Choose the well-absorbed sources."
      - text: "Yes, spinach is an excellent calcium source for bone"
        correct: false
        feedback: "This confuses content with availability. Spinach contains calcium, but oxalate binds it, so only ~5% is absorbed; it is a poor source of calcium for bone despite its calcium content."
      - text: "Only if cooked, which frees up the calcium"
        correct: false
        feedback: "Boiling leaches some oxalate into the water, but nothing shows it turns spinach into a well-absorbed calcium source; pick low-oxalate greens or calcium-set tofu instead."
      - text: "Yes, its calcium is absorbed better than from milk"
        correct: false
        feedback: "The opposite is true: spinach calcium (~5% absorbed) is far less available than milk's, because oxalate binds it."

  - id: q3
    stem: "Why is vitamin D deficiency common in sunny Singapore?"
    options:
      - text: "Indoor living, sun avoidance and skin pigmentation"
        correct: true
        feedback: "Behaviour and biology explain it: indoor lifestyles, cosmetic sun avoidance, covering and darker skin pigmentation all cut skin synthesis (which also falls with age). About 1 in 3 mid-life Singaporean women are deficient, and the burden is unequal: Indian and Malay women more than Chinese."
      - text: "The equatorial sun is actually too weak for the skin"
        correct: false
        feedback: "The tropical sun is ample. Deficiency arises because people avoid it (indoors, covered, sun-averse) and pigmentation reduces synthesis."
      - text: "Diet here contains dangerously little calcium"
        correct: false
        feedback: "Dietary calcium is a separate issue (intake below the requirement). Vitamin D deficiency here is driven by low sun exposure and pigmentation."
      - text: "It isn't; deficiency is impossible in the tropics"
        correct: false
        feedback: "It is common: roughly 1 in 3 mid-life women are deficient despite the sun, because of indoor life, covering and pigmentation."

  - id: q4
    stem: "What does vitamin D do for bone, and should we test everyone's level?"
    options:
      - text: "It enables calcium uptake; don't test everyone"
        correct: true
        feedback: "Vitamin D acts on bone indirectly: its active form drives intestinal calcium absorption, so a shortfall means calcium passes through unabsorbed and parathyroid hormone rises and mobilises it from bone. The Endocrine Society guideline also suggests against routine testing, and against empiric vitamin D above the recommended intake (the DRI) in healthy adults under 75; find and correct genuine shortfall in higher-risk people instead."
      - text: "It builds bone directly; test the whole population"
        correct: false
        feedback: "Vitamin D acts on bone indirectly, by regulating calcium absorption, and routine population testing is not advised; target higher-risk people."
      - text: "It replaces the need for dietary calcium entirely"
        correct: false
        feedback: "Vitamin D enables calcium absorption; it doesn't replace calcium. You need both the mineral (calcium) and the vitamin that drives its absorption (vitamin D)."
      - text: "It has no role in bone and needn't be considered"
        correct: false
        feedback: "Its role is to enable calcium absorption, so genuine deficiency matters. What is not advised is blanket testing and dosing of healthy adults."

  - id: q5
    stem: "An older patient avoids protein because they heard it \"leaches calcium from bone\". Best response?"
    options:
      - text: "With enough calcium, protein lowers fracture risk"
        correct: true
        feedback: "With adequate calcium, higher protein is associated with about 11% lower hip-fracture risk, and the extra urinary calcium after a protein meal comes from better absorption. The acid-ash idea that protein leaches calcium from bone is therefore contradicted by the evidence. Protein forms the collagen matrix and preserves fall-preventing muscle, so it is a bone nutrient."
      - text: "They're right; cutting protein protects the skeleton"
        correct: false
        feedback: "Cutting protein risks muscle loss and falls, and higher protein with adequate calcium is associated with fewer fractures. The acid-ash belief has the evidence the wrong way round."
      - text: "Protein has no effect on bone either way"
        correct: false
        feedback: "Protein does matter: it forms the collagen matrix, raises IGF-1, and maintains fall-preventing muscle. With adequate calcium it is associated with lower fracture risk."
      - text: "Only plant protein is safe; animal protein harms bone"
        correct: false
        feedback: "The evidence doesn't single out animal protein as harmful. Adequate protein of either kind, with enough calcium, supports bone."

  - id: q6
    stem: "Why is a low body weight a red flag for bone health?"
    options:
      - text: "A low BMI roughly doubles hip-fracture risk"
        correct: true
        feedback: "A low BMI (20 versus 25) nearly doubles hip-fracture risk, largely because it is associated with lower bone density, which is why low weight is built into fracture-risk tools like FRAX. Underweight patients and those with low energy intake, common in frail old age, have a red flag for bone health."
      - text: "Thin people always have unusually dense bones"
        correct: false
        feedback: "The reverse: low body weight is associated with lower bone density and nearly doubles hip-fracture risk."
      - text: "Body weight has no relationship to fracture risk"
        correct: false
        feedback: "It has a strong relationship: a low BMI nearly doubles hip-fracture risk, and it's used in FRAX for exactly that reason."
      - text: "It matters for fracture risk only in men"
        correct: false
        feedback: "Low body weight raises fracture risk in both sexes."

  - id: q7
    stem: "Who benefits from calcium and vitamin D supplements for fractures?"
    options:
      - text: "Only those who are genuinely deficient"
        correct: true
        feedback: "Supplements cut fractures in people who are genuinely deficient or institutionalised, but in already-replete community-dwelling adults large trials find no fracture benefit and a small rise in kidney stones. Correct real deficiency and otherwise go food-first."
      - text: "Every adult over 50, as a routine preventive measure"
        correct: false
        feedback: "Blanket supplementation of replete community adults doesn't prevent fractures and slightly raises kidney-stone risk. Benefit is confined to genuine deficiency."
      - text: "Only people who already eat plenty of dairy"
        correct: false
        feedback: "People who already meet their needs gain no fracture benefit from extra supplements. The benefit is for those who are genuinely deficient."
      - text: "No one; the supplements are never of any use"
        correct: false
        feedback: "They help the genuinely deficient or institutionalised. Already-replete community adults gain no fracture benefit."

  - id: q8
    stem: "An older woman's fragility fracture and low weight worry you. What is the generalist's role?"
    options:
      - text: "Give food-first advice, correct deficiency, refer"
        correct: true
        feedback: "The generalist delivers the food-first and loading advice, corrects genuine deficiency, recognises the red flags (a fragility fracture, low weight), and refers, using OSTA, FRAX and DXA to decide who needs assessment. Osteoporosis drugs and hormone therapy are specialist decisions."
      - text: "Start an osteoporosis drug and titrate it to the scan"
        correct: false
        feedback: "Prescribing and titrating osteoporosis drugs is specialist territory. The generalist's job is food-first advice, correcting deficiency, and referral."
      - text: "Prescribe the hormone therapy she clearly needs now"
        correct: false
        feedback: "Menopausal hormone therapy is a specialist decision (see the *Menopause & midlife health* chapter)."
      - text: "Reassure her that fractures at her age are normal"
        correct: false
        feedback: "A fragility fracture is a red flag: it defines osteoporosis and warrants referral."

  - id: q9
    stem: "A patient with knee osteoarthritis asks about glucosamine. What's the evidence-based answer?"
    options:
      - text: "No real benefit; guidelines advise against it"
        correct: true
        feedback: "Glucosamine and chondroitin are no better than placebo for knee-osteoarthritis pain or joint structure in the major independent trials, and ACR, OARSI, NICE and Singapore's ACE all advise against them. Glucosamine doesn't rebuild cartilage; the interventions that work are weight loss and exercise."
      - text: "It rebuilds cartilage and reverses the arthritis"
        correct: false
        feedback: "It does neither. Glucosamine doesn't rebuild cartilage or reverse osteoarthritis, and it's no better than placebo for pain or structure, which is why the guidelines advise against it."
      - text: "It works about as well as a knee replacement"
        correct: false
        feedback: "There's no comparison: glucosamine gives no meaningful benefit at all, whereas surgery is for end-stage disease. The evidence-based measures here are weight loss and activity."
      - text: "It's proven better than weight loss for the pain"
        correct: false
        feedback: "The opposite is true: weight loss (with exercise) is the most effective intervention for knee osteoarthritis, while glucosamine gives no meaningful benefit."

  - id: q10
    stem: "Which intervention has the best evidence for knee osteoarthritis?"
    options:
      - text: "Losing ~10% of body weight, with exercise"
        correct: true
        feedback: "In the IDEA trial, a diet-plus-exercise programme that produced about 10% weight loss improved pain and function, working through both reduced mechanical load on the joint and lower inflammation, with more loss giving more benefit. Weight loss and activity help more than supplements."
      - text: "Taking a daily cartilage supplement"
        correct: false
        feedback: "Supplements don't rebuild cartilage or meaningfully relieve osteoarthritis. The effective intervention is weight loss with exercise."
      - text: "Resting the joint and avoiding all activity"
        correct: false
        feedback: "Rest and de-conditioning worsen knee osteoarthritis. Appropriate activity and strengthening, alongside weight loss, are what help."
      - text: "Switching to a high-dose vitamin D pill"
        correct: false
        feedback: "Vitamin D showed no benefit for osteoarthritis pain or cartilage in a 2-year trial. Weight loss with exercise improves pain and function."

  - id: q11
    stem: "A patient with gout asks what to eat. Which advice is most accurate?"
    options:
      - text: "Cut beer and sugary drinks; medication is the main treatment"
        correct: true
        feedback: "Diet affects urate only modestly: beer and fructose or sugary drinks raise it, low-fat dairy and coffee are associated with lower risk, and purine-rich vegetables and total protein aren't the problem. The main treatment is a urate-lowering drug (allopurinol) titrated to a target urate level, with diet as a helpful adjunct. Gout is not the patient's fault."
      - text: "Cut out all seafood, all protein and all vegetables to be cured"
        correct: false
        feedback: "That's over-restriction. Purine-rich vegetables and total protein aren't associated with gout, and diet alone rarely reaches target; the effective treatment is urate-lowering medication. Don't starve the patient of protein and vegetables."
      - text: "Diet alone is enough; you don't need any medication"
        correct: false
        feedback: "Diet changes urate only modestly. For most gout patients, reaching target needs a urate-lowering drug, with diet as an adjunct."
      - text: "It's your own fault for eating too much; just eat less"
        correct: false
        feedback: "Gout is a metabolic disease of urate handling. Blaming diet leads clinicians to over-restrict patients and overlook the effective treatment: urate-lowering therapy to target."

  - id: q12
    stem: "Which pairing correctly matches each condition to its main dietary measure?"
    options:
      - text: "Osteoarthritis → weight loss; osteoporosis → calcium"
        correct: true
        feedback: "The two 'osteo' conditions need different dietary measures: osteoarthritis (worn cartilage) responds to weight loss and activity, while osteoporosis (low bone density) responds to calcium, vitamin D and protein. Mixing them up (calcium for arthritis, glucosamine for osteoporosis) is the classic error."
      - text: "Osteoarthritis → calcium; osteoporosis → glucosamine"
        correct: false
        feedback: "This swaps them. Calcium is for bone (osteoporosis), and glucosamine is for neither; for osteoarthritis, the main measure is weight loss."
      - text: "Gout → glucosamine; osteoarthritis → urate drugs"
        correct: false
        feedback: "Both are wrong: glucosamine helps neither condition, urate-lowering drugs are for gout (not osteoarthritis), and for osteoarthritis, the main measure is weight loss."
      - text: "Osteoporosis → weight loss; gout → high-dose vitamin D"
        correct: false
        feedback: "Weight loss is the main measure for osteoarthritis (not osteoporosis, which needs calcium, vitamin D and protein), and vitamin D doesn't treat gout; a urate-lowering drug does."
