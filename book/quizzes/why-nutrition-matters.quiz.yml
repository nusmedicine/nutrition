id: why-nutrition-matters
title: "Quick check: why nutrition matters"
questions:
  - id: q1
    stem: "Non-communicable diseases (NCDs) account for roughly what share of deaths worldwide?"
    options:
      - text: "About 25%"
        correct: false
        feedback: "This share would leave infection and injury as the main causes of death. They have been overtaken: NCDs are now the leading cause of death worldwide."
      - text: "About 75%"
        correct: true
        feedback: "NCDs caused about 75% of deaths worldwide in 2021, setting aside deaths from the COVID-19 pandemic, and most are driven by modifiable behaviours."
      - text: "About 95%"
        correct: false
        feedback: "Infectious disease, injury and maternal and neonatal causes still account for a substantial share of deaths, so 95% is too high."

  - id: q2
    stem: "Why is nutrition described as central to the six pillars of health?"
    options:
      - text: "Because diet is the only pillar that affects health"
        correct: false
        feedback: "All six pillars affect health, and nutrition is central because it connects to the other five."
      - text: "Because it links to the other five pillars in both directions"
        correct: true
        feedback: "Nutrition acts on, and is acted on by, physical activity, sleep, stress, social connection and alcohol, so the pillars tend to move together: short sleep raises appetite, and stress is thought to drive comfort eating."
      - text: "Because it can be treated in isolation from the others"
        correct: false
        feedback: "Its links to the other pillars are what make it central, so treating it in isolation tends to fall short: improving the diet often means addressing sleep and stress too."

  - id: q3
    stem: "A patient asks whether they should take up a 'superfood' to fix their diet. What does the evidence best support?"
    options:
      - text: "Whole dietary patterns matter more than single foods"
        correct: true
        feedback: "The overall dietary pattern, such as the Mediterranean or DASH pattern, predicts health better than any single nutrient or 'superfood'."
      - text: "One magic nutrient, maximised, will fix the diet"
        correct: false
        feedback: "Searching for one magic nutrient or superfood is single-nutrient reductionism; the evidence supports the overall dietary pattern."
      - text: "Diet has no measurable effect on disease risk"
        correct: false
        feedback: "Diet is among the largest modifiable contributors to early death: the Global Burden of Disease study attributes around 11 million deaths a year to dietary risks."

  - id: q4
    stem: "A colleague says: 'PREDIMED proves the Mediterranean diet prevents heart attacks.' What is the most accurate response?"
    options:
      - text: "Yes, it is a definitive trial with no important caveats"
        correct: false
        feedback: "Even landmark trials have limitations. PREDIMED's result comes from a 2018 re-analysis, and its benefit on the combined outcome came mainly from fewer strokes; the trial did not show a clear fall in heart attacks."
      - text: "It showed a benefit, but the claim needs important caveats"
        correct: true
        feedback: "The trial found a ~30% relative reduction in a combined measure of cardiovascular events, with the clearest reduction in strokes. That result comes from a 2018 re-analysis, published after the original was withdrawn over problems with how participants were assigned to groups."
      - text: "No, PREDIMED found no effect on any outcome"
        correct: false
        feedback: "PREDIMED did find a benefit, about 30% lower relative risk on a combined measure of cardiovascular events; the claim needs to be stated precisely, with its limitations."

  - id: q5
    stem: "According to the National Nutrition Survey 2022, roughly what proportion of Singapore residents exceed the recommended sodium limit?"
    options:
      - text: "About 1 in 10"
        correct: false
        feedback: "It is the reverse: only about 1 in 10 residents stay within the limit."
      - text: "About 9 in 10"
        correct: true
        feedback: "About 9 in 10 residents exceed the WHO sodium limit, and most of that sodium comes from sauces, broths and food eaten out."
      - text: "About 1 in 2"
        correct: false
        feedback: "The share is much higher, roughly 9 in 10; most sodium comes from sauces, broths and food eaten out."

  - id: q6
    stem: "How are the six pillars of health meant to be used?"
    options:
      - text: "Instead of drugs and surgery, replacing usual care"
        correct: false
        feedback: "The six pillars are evidence-based care used alongside drugs and surgery, and they do not replace usual care."
      - text: "Alongside drugs and surgery, as evidence-based care"
        correct: true
        feedback: "The six pillars (nutrition, physical activity, restorative sleep, stress management, positive social connection and avoidance of risky substances) are used to prevent, treat and sometimes reverse chronic disease, working with drugs and surgery."
      - text: "As general advice to 'eat better and exercise more'"
        correct: false
        feedback: "General advice gives a patient nothing concrete to act on. Advising across the six pillars is a structured, learnable clinical skill."
