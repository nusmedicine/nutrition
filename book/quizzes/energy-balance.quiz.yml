id: energy-balance-basics
title: "Quick check: energy balance & BMR"
questions:
  - id: q1
    stem: "Basal metabolic rate (BMR) typically accounts for what share of total energy expenditure?"
    options:
      - text: "About 10%"
        correct: false
        feedback: "About 10% is the thermic effect of food (TEF); BMR is far larger."
      - text: "60–70%"
        correct: true
        feedback: "BMR is the largest component of TEE for most people, typically 60–70%."
      - text: "Over 90%"
        correct: false
        feedback: "Physical activity and TEF together account for a substantial share of TEE, which leaves BMR at about 60–70%."

  - id: q2
    stem: "Which component of total energy expenditure varies *most* between individuals?"
    options:
      - text: "Basal metabolic rate"
        correct: false
        feedback: "BMR varies, but it is relatively stable for a given body composition."
      - text: "Physical activity"
        correct: true
        feedback: "Physical activity differs most between otherwise similar people, and NEAT alone varies widely from person to person."
      - text: "Thermic effect of food"
        correct: false
        feedback: "TEF is fairly constant at about 10% of TEE."

  - id: q3
    stem: "Which change would tend to *increase* BMR?"
    options:
      - text: "Greater fat-free (lean) mass"
        correct: true
        feedback: "Lean mass, whose muscle and organs are metabolically active, is the main determinant of BMR."
      - text: "Increasing age"
        correct: false
        feedback: "BMR tends to fall with age, partly because lean mass is lost."
      - text: "Lower thyroid hormone"
        correct: false
        feedback: "Reduced thyroid hormone lowers BMR instead of increasing it."

  - id: q4
    stem: "The Mifflin–St Jeor equation estimates BMR from which inputs?"
    options:
      - text: "Weight, height, age and sex"
        correct: true
        feedback: "These four inputs are all the equation uses, with a different constant for women and men."
      - text: "Weight and blood pressure"
        correct: false
        feedback: "Blood pressure is not an input to BMR estimation."
      - text: "Fasting glucose and BMI"
        correct: false
        feedback: "Fasting glucose and BMI are useful clinical measures, but neither is an input to the equation."

  - id: q5
    stem: "Two colleagues do the same 30-minute gym class. One also fidgets, takes the stairs and walks at lunch; the other sits the rest of the day. What best explains the first person's larger daily expenditure?"
    options:
      - text: "Non-exercise activity thermogenesis (NEAT)"
        correct: true
        feedback: "Everyday, non-exercise movement (NEAT) varies widely between people and, over a day, can outweigh a single formal workout."
      - text: "A higher thermic effect of food"
        correct: false
        feedback: "TEF depends on food intake, not incidental movement; it is roughly 10% of TEE and fairly constant."
      - text: "A higher BMR caused by the gym class"
        correct: false
        feedback: "One class doesn't meaningfully raise *resting* metabolism; the difference here is incidental daily movement (NEAT)."

  - id: q6
    stem: "A patient loses 10 kg on a diet, then finds the weight creeps back despite eating carefully. Which idea best explains why 'just eat less' so often fails?"
    options:
      - text: "Expenditure falls and appetite rises after weight loss"
        correct: true
        feedback: "Energy expenditure falls by more than the smaller body size predicts (adaptive thermogenesis) while hunger rises, so these compensatory responses favour regain. Energy balance is actively regulated (see the *Appetite and weight regulation* chapter)."
      - text: "Fat cannot be lost once it has been stored"
        correct: false
        feedback: "Fat is readily mobilised; the problem is compensation that makes it hard for weight to *stay* lower, not irreversibility."
      - text: "The Mifflin–St Jeor equation is simply inaccurate at lower weights"
        correct: false
        feedback: "Estimation error is not the point: after weight loss, expenditure falls (metabolic adaptation) and appetite rises."

  - id: q7
    stem: "Why is BMI treated as a screening tool and not a measure of body fat?"
    options:
      - text: "It uses only weight and height, not body composition"
        correct: true
        feedback: "Using only weight and height, BMI cannot distinguish muscle from fat, so a muscular person can have a high BMI with little fat. Waist circumference adds the central-fat information that BMI does not capture. (Asian cut-offs for overweight are set lower, because risk rises at a lower BMI in Asian populations.)"
      - text: "It can only be calculated from a DXA scan"
        correct: false
        feedback: "BMI is just weight ÷ height²; DXA is the accurate body-fat reference, not part of BMI."
      - text: "It measures visceral (central) fat directly"
        correct: false
        feedback: "Waist circumference captures central fat; BMI uses only weight and height."
