id: dietary-assessment
title: "Quick check: assessing diet & talking to patients"
questions:
  - id: q1
    stem: "You take a single 24-hour recall. What is its main limitation?"
    options:
      - text: "One day may not reflect habitual intake"
        correct: true
        feedback: "Day-to-day intake varies considerably, so a single recall estimates that day well but habitual intake poorly. Several non-consecutive recalls estimate habitual intake far better, and the method also relies on memory (recall bias)."
      - text: "It burdens the patient more than any other method"
        correct: false
        feedback: "A 24-hour recall is quick and low-burden for the patient; the food diary is the high-burden method."
      - text: "It changes what the patient eats while they record it"
        correct: false
        feedback: "Changing what one eats while recording it is reactivity, the characteristic bias of a prospective food diary, not of a retrospective recall."

  - id: q2
    stem: "A packaged drink lists 8 g of sugar per 100 ml. Under Nutri-Grade, what grade is that (on sugar)?"
    options:
      - text: "Grade C"
        correct: true
        feedback: "The sugar bands are A ≤1, B >1–5, C >5–10 and D >10 g per 100 ml, so 8 g falls in C. High saturated fat could pull it down further."
      - text: "Grade A"
        correct: false
        feedback: "Grade A needs ≤1 g sugar per 100 ml, and 8 g is well above that."
      - text: "Grade D"
        correct: false
        feedback: "At >10 g per 100 ml a drink is grade D; 8 g falls in the C band (>5–10 g), though high saturated fat could still downgrade it."

  - id: q3
    stem: "A bottled drink says \"11 g sugar per serving\" and \"2.5 servings per bottle.\" What should you check?"
    options:
      - text: "The per-100 ml figure and the whole-bottle amount"
        correct: true
        feedback: "Serving sizes on labels can be misleading. Most people drink the whole bottle, so the real intake is about 2.5 times the per-serving figure. The per-100 ml (or per-100 g) column compares products fairly and shows how much a realistic portion contains."
      - text: "Nothing; the per-serving sugar is the number that matters"
        correct: false
        feedback: "Per-serving figures can understate the real intake when the 'serving' is unrealistically small. Check per-100 ml and the whole-pack amount."
      - text: "Only the Nutri-Grade letter, ignoring the panel"
        correct: false
        feedback: "The grade is a useful quick guide, but it does not reveal the per-serving problem; reading the panel per 100 ml is the skill."

  - id: q4
    stem: "You've spotted that a patient drinks two bubble teas a day. What is the best way to start?"
    options:
      - text: "Ask permission, then suggest one concrete swap in plain language"
        correct: true
        feedback: "This is the opening of the 5 A's: assess, then advise with permission, e.g. \"Would it be alright if I shared one idea about your drinks?\" Asking permission makes the advice part of a two-way conversation."
      - text: "\"You need to stop bubble tea; it's full of free sugars over the limit.\""
        correct: false
        feedback: "Unasked-for, jargon-laden advice puts people on the defensive. Ask permission and use plain language ('sugary drinks')."
      - text: "Say nothing about it to avoid making them uncomfortable"
        correct: false
        feedback: "Avoiding the most important dietary issue helps no one. Raise it, with permission and without judgement."

  - id: q5
    stem: "During the history a young patient mentions skipping meals to \"make up\" for eating, and feeling guilty after meals. What is the safe next step?"
    options:
      - text: "Gently screen for disordered eating and consider referral"
        correct: true
        feedback: "Compensatory meal-skipping and guilt after eating are red flags. A brief screen (e.g. SCOFF) is appropriate, and weight- or restriction-focused advice could worsen an eating disorder: screen, be supportive, refer."
      - text: "Give a strict low-calorie plan to speed weight loss"
        correct: false
        feedback: "A restrictive plan could worsen a possible eating disorder, which is the harm to avoid. Recognise the red flags first."
      - text: "Reassure them it's normal and move on"
        correct: false
        feedback: "Dismissing these warning signs misses a chance to help safely. A brief screen and consideration of referral is the safe next step."

  - id: q6
    stem: "An 80-year-old has had unplanned weight loss and poor appetite over three months. Which way should your assessment go?"
    options:
      - text: "Toward undernutrition: recognise malnutrition risk and refer"
        correct: true
        feedback: "Unplanned weight loss with poor intake flags malnutrition risk, which a MUST-type screen captures; this is undernutrition, not a 'cut down' conversation. Recognise and refer."
      - text: "Toward weight loss advice, since losing weight is generally healthy"
        correct: false
        feedback: "In an older adult, unplanned weight loss is a warning sign of undernutrition, not a success."
      - text: "No action, since weight loss never needs assessment"
        correct: false
        feedback: "Unplanned weight loss with poor appetite is a red flag that warrants screening and referral."

  - id: q8
    stem: "You want to capture a patient's habitual eating pattern over months and rank them against others. Which method fits, and what's its limitation?"
    options:
      - text: "A food-frequency questionnaire, though poor at exact quantities"
        correct: true
        feedback: "The food-frequency questionnaire captures the long-term pattern with low burden and ranks people from high to low intake, but it is poor at pinning down absolute amounts."
      - text: "A single 24-hour recall, which measures habitual intake precisely"
        correct: false
        feedback: "A single recall captures one day, not the habitual pattern, and doesn't rank long-term intake well."
      - text: "A one-day weighed food diary, the least burdensome option"
        correct: false
        feedback: "Weighing food for a diary is the most burdensome method, and one day still doesn't capture months of habitual eating."

  - id: q7
    stem: "Which BMI cut-offs does Singapore use to flag overweight and obesity?"
    options:
      - text: "Overweight at BMI ≥23 and obese at ≥27.5 kg/m² (Asian cut-offs)"
        correct: true
        feedback: "Singapore uses lower Asian cut-offs because cardiometabolic risk rises at a lower BMI than the international ≥25/≥30. BMI still does not measure body composition."
      - text: "Overweight at ≥25 and obese at ≥30 kg/m² (the international cut-offs)"
        correct: false
        feedback: "Those are the international thresholds; Singapore uses the lower Asian cut-offs (≥23 / ≥27.5)."
      - text: "There are no BMI cut-offs for Asian populations"
        correct: false
        feedback: "Asian cut-offs exist: ≥23 for overweight and ≥27.5 for obese, used locally."
