id: pregnancy-lactation
title: "Quick check: pregnancy & lactation"
questions:
  - id: q1
    stem: "A woman at 10 weeks asks how much extra she should eat \"now that I'm eating for two\". Best answer?"
    options:
      - text: "Almost nothing extra yet; needs rise modestly and mainly later"
        correct: true
        feedback: "Energy needs rise only modestly and late: roughly nothing extra in the first trimester, about +340 kcal/day in the second and about +450 in the third, so the extra is a snack, not a second dinner. 'Eating for two' only nearly fits breastfeeding, which needs roughly 450–500 kcal/day net extra and draws partly on pregnancy fat stores. In pregnancy, quality matters more than quantity."
      - text: "She should roughly double her intake to support the baby"
        correct: false
        feedback: "'Eating for two' suggests doubling, but the energy cost of pregnancy is modest and back-loaded, and doubling intake mostly adds excess weight and GDM risk."
      - text: "She should eat less to avoid gaining too much weight"
        correct: false
        feedback: "Under-eating isn't the goal either: too little gain raises the risk of a small or preterm baby. The aim is adequate, good-quality intake and a weight-gain target set by pre-pregnancy BMI."

  - id: q2
    stem: "At 28 weeks Mrs Devi's haemoglobin has fallen from 12.5 to 10.8 g/dL. She feels well. What's the right first read?"
    options:
      - text: "Likely haemodilution; check ferritin before deciding on iron"
        correct: true
        feedback: "Plasma volume expands faster than red-cell mass, so a mid-pregnancy haemoglobin almost always falls by dilution. Use pregnancy-specific cut-offs and confirm true iron deficiency with ferritin instead of treating the number alone, remembering that real deficiency is common."
      - text: "Definite iron-deficiency anaemia; start high-dose iron now"
        correct: false
        feedback: "The dilutional fall is expected and physiological, so a low number alone does not prove deficiency. Check ferritin first, and treat if she is truly deficient."
      - text: "A dangerous drop that needs urgent transfusion"
        correct: false
        feedback: "A fall to about 10.8 g/dL in mid-pregnancy is common and usually dilutional, not an emergency."

  - id: q3
    stem: "A woman with severe, persistent vomiting, weight loss and ketosis is admitted. Which point is the critical safety step?"
    options:
      - text: "Give thiamine before any glucose or dextrose"
        correct: true
        feedback: "Prolonged vomiting depletes thiamine, and glucose given first to a depleted woman can precipitate Wernicke's encephalopathy, so thiamine goes in before glucose. Her severe, persistent vomiting, weight loss and ketosis mark hyperemesis gravidarum, which needs referral; small frequent meals, ginger and vitamin B6 are for ordinary nausea."
      - text: "Start IV dextrose first, and add vitamins later"
        correct: false
        feedback: "Correcting the energy deficit feels urgent, but this order is dangerous: glucose given first to a thiamine-depleted woman can trigger Wernicke's encephalopathy. Thiamine goes in before glucose."
      - text: "Reassure her that vomiting is normal and send her home"
        correct: false
        feedback: "Weight loss, dehydration and ketosis mark hyperemesis gravidarum, not ordinary morning sickness; it needs referral and admission, not reassurance."

  - id: q4
    stem: "Why does the calcium requirement barely rise in pregnancy, even though the foetal skeleton is forming?"
    options:
      - text: "Because the gut roughly doubles its calcium absorption"
        correct: true
        feedback: "Intestinal absorption adapts: the gut roughly doubles its calcium absorption in pregnancy, so the recommended intake barely changes and an adequate baseline is enough."
      - text: "Because the foetus doesn't actually need much calcium"
        correct: false
        feedback: "The foetal skeleton does need calcium, but the mother meets the need by absorbing dietary calcium more efficiently, not by eating more."
      - text: "Because calcium is stored in unlimited amounts in the mother's bones"
        correct: false
        feedback: "Bone stores are not the mechanism: intestinal calcium absorption roughly doubles in pregnancy, which is why the intake recommendation barely changes."

  - id: q5
    stem: "Which nutrient is the one where the pregnancy advice is a ceiling (avoid excess), not a target to reach?"
    options:
      - text: "Vitamin A, because high-dose preformed retinol is teratogenic"
        correct: true
        feedback: "Preformed retinol (supplements, liver) is teratogenic in excess, while plant β-carotene is safe, so check that a multivitamin is not over-dosed in retinol and skip liver."
      - text: "Folate, because more is better throughout pregnancy"
        correct: false
        feedback: "Folate is a floor to reach (about 400 µg/day, or 4–5 mg/day if high-risk), not a ceiling; the nutrient that is teratogenic in excess is preformed vitamin A."
      - text: "Iron, because extra iron is always beneficial"
        correct: false
        feedback: "Iron needs rise and deficiency is common; the nutrient with a teratogenic upper limit is preformed vitamin A."

  - id: q6
    stem: "Why does Singapore offer the glucose tolerance test to every pregnant woman instead of only to high-risk women?"
    options:
      - text: "Because risk-factor screening would miss about half of cases in Asian women"
        correct: true
        feedback: "In the local GUSTO cohort, risk factors predicted GDM poorly, and risk-based screening would have missed about half of cases. GDM is common (about 1 in 5) and often symptomless, so every pregnancy is offered the 75 g test at 24–28 weeks."
      - text: "Because only older, overweight women with a family history get GDM"
        correct: false
        feedback: "Restricting the test to women with these risk factors is risk-based screening, which would have missed about half of local cases; screening in Singapore is universal."
      - text: "Because women with GDM always have obvious symptoms"
        correct: false
        feedback: "GDM is usually symptomless, which is why universal screening is used instead of waiting for symptoms."

  - id: q7
    stem: "The newborn of a mother with GDM is at risk of hypoglycaemia in the first hours after birth. Why?"
    options:
      - text: "Foetal insulin, raised in the womb, stays high after birth"
        correct: true
        feedback: "In the womb, high maternal glucose drove high foetal insulin; when the maternal supply is cut at birth, that insulin is still high and lowers the baby's glucose. Macrosomia and neonatal hypoglycaemia are two ends of one chain: maternal glucose in, foetal insulin out, overgrowth, then hypoglycaemia once the supply stops."
      - text: "The baby has inherited diabetes from the mother"
        correct: false
        feedback: "The hypoglycaemia is transient: the baby's own insulin, raised in response to maternal glucose, stays high briefly after delivery, so it is not inherited diabetes."
      - text: "The baby is too small and underfed, so it runs out of sugar"
        correct: false
        feedback: "These babies are typically *large* (macrosomic); the hypoglycaemia comes from their own high insulin after the maternal glucose supply is cut."

  - id: q8
    stem: "A vegan mother is breastfeeding and feels perfectly well. What nutrition risk needs action?"
    options:
      - text: "Her milk can be critically low in vitamin B12 even while she feels fine"
        correct: true
        feedback: "Vitamin B12 is a diet-dependent milk nutrient. Iron, calcium and folate in milk are buffered from her stores, but B12, iodine, vitamin D and DHA depend on her intake, and low-B12 milk can harm the infant's developing brain. She needs B12 supplementation and a dietitian referral."
      - text: "Nothing, since if she feels well her milk is complete"
        correct: false
        feedback: "She can look healthy while producing B12-deficient milk. B12 is diet-dependent in milk, so a vegan mother must supplement it."
      - text: "Her calcium and iron will be dangerously low in the milk"
        correct: false
        feedback: "Calcium and iron are buffered, kept steady in milk at the mother's expense. The diet-dependent risk here is B12 (also iodine, vitamin D and DHA)."
