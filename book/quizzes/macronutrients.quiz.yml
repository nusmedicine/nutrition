id: macronutrients-quality
title: "Quick check: macronutrients & quality"
questions:
  - id: q1
    stem: "Match the energy yields. Which row is correct (kcal per gram)?"
    options:
      - text: "Carbohydrate ~4, protein ~4, fat ~9, fibre ~2"
        correct: true
        feedback: "Fat is the most energy-dense; fibre yields little because it is largely fermented by gut microbes, not digested for fuel."
      - text: "Carbohydrate ~9, protein ~4, fat ~4, fibre ~7"
        correct: false
        feedback: "This row swaps fat and carbohydrate: fat yields ~9 kcal/g and carbohydrate ~4, and ~7 kcal/g is alcohol, not fibre."
      - text: "All macronutrients yield ~4 kcal/g"
        correct: false
        feedback: "Fat yields ~9 kcal/g, roughly double carbohydrate or protein."

  - id: q2
    stem: "WHO defines free sugars as the carbohydrate to limit. Which of these counts as a free sugar?"
    options:
      - text: "The sugar naturally present inside a whole apple"
        correct: false
        feedback: "The sugar inside whole fruit is not a free sugar, so it is not the target of the WHO limit."
      - text: "Added sugar, plus the sugar in fruit juice"
        correct: true
        feedback: "Free sugars are added sugars plus those in honey, syrups and fruit juices; WHO caps them at <10% of energy."
      - text: "The starch in brown rice"
        correct: false
        feedback: "Starch is not a sugar; wholegrain starch is at the protective end of the carbohydrate spectrum."

  - id: q3
    stem: "Rank these fats from *most* to *least* harmful for cardiovascular risk."
    options:
      - text: "Trans → saturated → monounsaturated → polyunsaturated"
        correct: true
        feedback: "*Trans* fat has the clearest evidence of harm (WHO cap: <1% of energy), and unsaturated fats are the ones to favour."
      - text: "Polyunsaturated → monounsaturated → saturated → trans"
        correct: false
        feedback: "This order is reversed: polyunsaturated fats are the ones to favour, not avoid."
      - text: "Saturated → trans → polyunsaturated → monounsaturated"
        correct: false
        feedback: "Saturated fat raises LDL cholesterol, but *trans* fat has the clearest evidence of harm, so it ranks first."

  - id: q4
    stem: "The Reynolds 2019 meta-analyses found higher fibre and wholegrain intake is associated with better outcomes. What is the correct way to state this?"
    options:
      - text: "It proves fibre causes lower mortality"
        correct: false
        feedback: "The data are largely observational, of moderate certainty at best, so they show association, not proof of cause."
      - text: "It shows an association with lower mortality"
        correct: true
        feedback: "Most of the data come from prospective cohorts, so the benefit is reported with its caveat: an association that strengthens up to ~25–29 g fibre/day, not proof of cause."
      - text: "It found fibre makes no difference to health"
        correct: false
        feedback: "The meta-analyses found a consistent protective association; the caveat is about causation, not direction."

  - id: q5
    stem: "A patient wants to know 'the one ideal macronutrient ratio'. What does current guidance say?"
    options:
      - text: "There is no single ideal split; individualise"
        correct: true
        feedback: "Guidelines deliberately avoid one ratio; they emphasise food quality and patterns, and advise referral to a dietitian for individualised needs."
      - text: "Exactly 50% carbohydrate, 30% fat, 20% protein for everyone"
        correct: false
        feedback: "A fixed split for everyone does not exist; food source and pattern matter more."
      - text: "As little carbohydrate as possible, always"
        correct: false
        feedback: "This reflects the belief that carbohydrate is harmful; quality and food source, not blanket restriction, determine the effect."

  - id: q6
    stem: "On My Healthy Plate ('quarter, quarter, half'), what fills the half?"
    options:
      - text: "Fruit and vegetables"
        correct: true
        feedback: "Half the plate is fruit and vegetables, a quarter wholegrains and a quarter protein."
      - text: "Wholegrains"
        correct: false
        feedback: "Wholegrains are a quarter, not the half."
      - text: "Protein"
        correct: false
        feedback: "Protein is a quarter; the half is fruit and vegetables."
