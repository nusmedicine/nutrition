id: integrative-metabolism-basics
title: "Quick check: the fed and fasted body"
questions:
  - id: q-fat-to-glucose
    stem: "Can the body turn fat into glucose?"
    options:
      - text: "Only the glycerol backbone, not the fatty-acid carbons."
        correct: true
        feedback: "Only the glycerol backbone of a triglyceride can make glucose; the fatty-acid carbons cannot. Fatty acids become acetyl-CoA, and the step from pyruvate to acetyl-CoA (PDH) is irreversible, so fatty-acid carbon cannot go back to glucose."
      - text: "Yes, fat is readily converted to glucose whenever blood glucose is low."
        correct: false
        feedback: "The one-way PDH step means fatty-acid carbon cannot become glucose, which is why blood glucose must be maintained, and new glucose made, in a fast."
      - text: "No, no part of fat can ever contribute to glucose."
        correct: false
        feedback: "Glycerol, the backbone of a triglyceride, is glucogenic; only the fatty-acid carbons cannot become glucose."
  - id: q-muscle-glycogen
    stem: "Muscles hold most of the body's glycogen. Why can't that glycogen raise blood glucose during a fast?"
    options:
      - text: "Muscle lacks glucose-6-phosphatase, so it cannot release free glucose."
        correct: true
        feedback: "Only the liver and kidney have glucose-6-phosphatase. Muscle glycogen is trapped for local use; muscle helps blood glucose only indirectly, by sending lactate (Cori cycle) or alanine to the liver."
      - text: "Muscle glycogen is used up before a fast even begins."
        correct: false
        feedback: "Muscle keeps plenty of glycogen; what it lacks is the enzyme (glucose-6-phosphatase) to release free glucose to the blood."
      - text: "Muscle can raise blood glucose, just more slowly than the liver."
        correct: false
        feedback: "Without glucose-6-phosphatase, muscle cannot release any free glucose to the blood at all. Only the liver and kidney can."
  - id: q-insulin-anabolic
    stem: "Which statement about insulin is most accurate?"
    options:
      - text: "It is anabolic for all three macronutrients."
        correct: true
        feedback: "Insulin stores glucose and fat and builds protein, so it is anabolic across all three macronutrients; 'the sugar hormone' undersells it."
      - text: "Its only job is to lower blood glucose."
        correct: false
        feedback: "Lowering glucose is one effect; insulin also stores fat (and blocks its breakdown) and builds protein."
      - text: "It raises blood glucose in the fasted state."
        correct: false
        feedback: "Raising blood glucose in the fasted state is glucagon's job. Insulin and glucagon are reciprocal: insulin is the fed, storage signal."
  - id: q-glut
    stem: "After a meal, why does glucose uptake surge in muscle and fat but not in the liver?"
    options:
      - text: "Their GLUT4 needs insulin; liver GLUT2 does not."
        correct: true
        feedback: "Insulin brings GLUT4 to the cell surface, so a meal switches on uptake in muscle and fat. GLUT2 (liver) is insulin-independent and admits glucose in proportion to its concentration; insulin acts on the liver's enzymes, not its glucose transporter."
      - text: "The liver has no way to take up glucose."
        correct: false
        feedback: "The liver takes up glucose readily through GLUT2. That transporter does not need insulin, so uptake does not surge the way it does in GLUT4-dependent muscle and fat."
      - text: "The liver only takes up glucose during fasting."
        correct: false
        feedback: "After a meal the liver takes up glucose through GLUT2, and during fasting it releases glucose. GLUT2 is insulin-independent."
  - id: q-scot
    stem: "In a prolonged fast the liver makes large amounts of ketone bodies. Why does it export them instead of burning them itself?"
    options:
      - text: "The liver lacks the enzyme needed to use ketones."
        correct: true
        feedback: "Lacking the enzyme needed to use ketones, the liver ships its whole ketone output to the brain, muscle and heart and burns none itself."
      - text: "The liver has no use for energy during a fast."
        correct: false
        feedback: "During a fast the liver is very active, making glucose and ketones. It exports ketones because it lacks the enzyme to burn them."
      - text: "Ketones are toxic to the liver."
        correct: false
        feedback: "Ketones do not harm the liver; it exports them because it lacks the enzyme to use them."
  - id: q-ketosis-dka
    stem: "What actually distinguishes dangerous diabetic ketoacidosis (DKA) from the harmless ketosis of a ketogenic diet or a fast?"
    options:
      - text: "The acidosis: an acidic blood pH from uncontrolled insulin deficiency."
        correct: true
        feedback: "Deep nutritional ketosis and mild DKA can have overlapping ketone levels. What defines DKA is the acidosis, and the near-total lack of insulin behind it, not the ketone number alone."
      - text: "The ketone level alone, which is always far higher in DKA."
        correct: false
        feedback: "The ketone ranges overlap, so the number alone cannot separate the two; DKA is defined by the acidosis driven by uncontrolled insulin deficiency."
      - text: "Nothing; they are the same process at different sizes."
        correct: false
        feedback: "Same molecules, different regulatory context: nutritional ketosis is restrained by residual insulin at normal pH, whereas DKA is unrestrained insulin deficiency with acidosis. A healthy person on a ketogenic diet does not get DKA."
  - id: q-rq
    stem: "A person's respiratory quotient (RQ = CO₂ produced ÷ O₂ consumed) is measured at about 0.7. Which fuel are they mainly burning?"
    options:
      - text: "Mostly fat."
        correct: true
        feedback: "An RQ near 0.7 means mostly fat, and near 1.0 mostly carbohydrate; 0.7 fits someone well into a fast."
      - text: "Mostly carbohydrate."
        correct: false
        feedback: "Carbohydrate gives an RQ near 1.0; an RQ of 0.7 points to fat oxidation."
      - text: "Mostly protein."
        correct: false
        feedback: "Protein sits around 0.8. An RQ of 0.7 indicates mostly fat."
  - id: q-alcohol
    stem: "Someone drinks heavily on an empty stomach after skipping meals and becomes confused and sweaty. What's the most likely metabolic problem?"
    options:
      - text: "Hypoglycaemia: alcohol blocks gluconeogenesis and glycogen is already low."
        correct: true
        feedback: "Metabolising ethanol floods the liver with NADH, which blocks gluconeogenesis. With glycogen already spent from skipped meals, neither glycogenolysis nor gluconeogenesis can supply glucose, and the result is a dangerous hypoglycaemia that can be mistaken for drunkenness."
      - text: "Hyperglycaemia: alcohol is full of sugar and raises blood glucose."
        correct: false
        feedback: "Whatever sugar the drinks contain, alcohol blocks the liver's glucose production, so on an empty stomach it lowers blood glucose."
      - text: "Nothing metabolic: the symptoms are purely intoxication."
        correct: false
        feedback: "Tremor, sweating and confusion after drinking without eating should raise the possibility of alcohol-induced hypoglycaemia, which is treated with glucose."
  - id: q-glycolysis-o2
    stem: "Does glycolysis (splitting glucose to pyruvate) need oxygen?"
    options:
      - text: "No, it runs in the cytosol without oxygen."
        correct: true
        feedback: "Oxygen is used later, at oxidative phosphorylation. This is why red cells (no mitochondria) and sprinting muscle can still make ATP; when oxygen is short, pyruvate becomes lactate to keep glycolysis going."
      - text: "Yes, glycolysis is the step where oxygen is consumed."
        correct: false
        feedback: "Glycolysis is oxygen-independent; oxygen is consumed at oxidative phosphorylation, in the mitochondrion."
