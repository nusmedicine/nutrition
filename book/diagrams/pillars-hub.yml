# Data for the PillarsHub island (the Why Nutrition Matters chapter).
# A radial hub-and-spoke: nutrition at the centre, the five other pillars around it, each
# joined by a two-way link. Click a pillar to reveal how it and nutrition act on each other.
# No asset paths: pure content.
id: pillars-hub
title: "The six pillars, with nutrition at the centre"
hub:
  label: Nutrition
  note: >-
    Click a pillar to see how it and nutrition act on each other.
pillars:
  - id: activity
    label: Activity
    full: Physical activity
    link: "Diet and movement act together on weight and glucose; neither alone is as effective as both."
  - id: sleep
    label: Sleep
    full: Restorative sleep
    link: "Short sleep lowers insulin sensitivity and raises appetite, especially for energy-dense food, and energy intake; late eating is in turn linked to poorer sleep, so the two can reinforce each other."
  - id: stress
    label: Stress
    full: Stress management
    link: "Acute and chronic stress, acting through cortisol, are thought to drive comfort eating of palatable, energy-dense food."
  - id: social
    label: Social
    full: Positive social connection
    link: "Eating is social, through family meals, communal hawker eating and festive food, so social context can entrench or transform a diet."
  - id: substances
    label: Substances
    full: Avoidance of risky substances
    link: "Alcohol is itself part of the diet: it supplies empty calories and also disinhibits food choice."
credit: "The six pillars of health, after the American College of Lifestyle Medicine (ACLM) and other lifestyle-medicine frameworks."
