# Data for the BoneBank island (Bone & Joint Health chapter).
# The "build the bank, defend the balance" widget for the "Pathophysiology: bone remodelling" section. The learner
# moves three controls (peak bone mass built by ~30, a modifiable band over a heritable floor; the
# age-related loss rate; and menopause age), and the widget shows WHEN the life-course bone-density curve
# crosses the osteoporosis line, expressed as YEARS OF DELAY vs an average skeleton. Teaching point: a
# higher peak buys the most delay (after Hernandez 2003). The output is explicitly "years of delay, NOT a
# fracture-rate change". Illustrative model; the maths lives in the component. Pure content, no asset paths.
# Retrofit 2026-10-21: the caption was removed because it repeated the chapter paragraph directly below the
# island (the component renders the caption only when present), and the credit no longer restates the
# 10%/13-year figure that paragraph gives.
id: bone-bank
title: "Build peak bone mass, slow the loss"
intro: >-
  Adjust the three controls (peak bone mass, rate of bone loss, age at menopause) and watch when the life-course bone-density curve crosses the osteoporosis line.
# The age-related loss-rate options (label + a multiplier the component applies to the loss model).
lossOptions:
  - { id: slow, label: "Slow", mult: 0.88 }
  - { id: average, label: "Average", mult: 1.0 }
  - { id: fast, label: "Fast", mult: 1.12 }
credit: >-
  Illustrative life-course model after Hernandez 2003. A teaching aid, not a clinical calculator.
