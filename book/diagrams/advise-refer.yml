id: advise-refer
title: "Advise or refer?"
credit: "Scenarios are schematic teaching cases; the distinction between general advice and medical nutrition therapy follows the chapter."
scenarios:
  - patient: "A well 34-year-old office worker asks how to eat more healthily in general."
    verdict: advise
    why: "Universal guidance (My Healthy Plate, more vegetables, fewer sugary drinks) is safe for almost anyone and is part of your role."
  - patient: "Newly diagnosed type 2 diabetes with early kidney impairment (eGFR, an estimate of kidney filtration, 52), on three medicines, HbA1c 9.1%."
    verdict: refer
    why: "The complexity (diabetes plus early kidney impairment plus three medicines) needs an individualised carbohydrate and renal plan. That is medical nutrition therapy, a dietitian's work; give safe interim advice and refer."
  - patient: "Someone asks whether they should switch their usual Nutri-Grade D drink for something better."
    verdict: advise
    why: "A universal message you can and should give: move toward a Nutri-Grade A or B drink. No condition-specific plan is required."
  - patient: "An 82-year-old who has lost weight without trying and now eats very little."
    verdict: refer
    why: "Unintended weight loss and malnutrition risk is a clear referral trigger: screen, then refer to the dietitian for assessment."
  - patient: "A pregnant woman with gestational diabetes needs a structured eating plan to manage her glucose."
    verdict: refer
    why: "Pregnancy plus a condition needing individualised, glucose-directed nutrition is MNT, so refer while reinforcing safe general messages."
  - patient: "A patient wants to swap white rice for brown or mixed rice at home."
    verdict: advise
    why: "A general dietary-pattern shift anyone can act on, so encourage it; no individualised therapy is needed."
  - patient: "A young woman reveals she skips meals to 'make up' for eating and feels guilty about food."
    verdict: refer
    why: "These are eating-disorder red flags. Don't add another restriction: pause weight and portion advice, and refer for specialist support."
