# Data for the FuelDial island (Adulthood: working life & activity chapter).
# Schematic/qualitative: teaches that everyday active adults need ordinary food + water, not sports
# nutrition; you have to reach genuine endurance-athlete volume before special fuelling is earned.
id: fuel-dial
title: "Matching food to training: usually less is needed than expected"
proteinPerKg:
  active: [1.2, 1.6]   # g/kg/day illustrative range (Morton 2018 plateau ~1.6)
intensities:
  - { key: easy, label: "Easy", w: 0.5 }
  - { key: moderate, label: "Moderate", w: 1.0 }
  - { key: hard, label: "Hard", w: 1.5 }
# load = sessions x minutes x intensity weight; a session-week is placed in the first tier it fits.
tiers:
  - key: minimal
    max: 100
    label: "Barely active"
    fuel: "Ordinary healthy plate. No sports nutrition needed; this is most adults."
    drink: "Water."
    protein: "No extra protein beyond normal meals; a usual plate meets the need."
  - key: active
    max: 600
    label: "Regularly active (the everyday exerciser)"
    fuel: "Eat enough carbohydrate around training; normal meals cover it. Still no sports drink or powder."
    drink: "Water, even for a sweaty gym or park session."
    protein: "range"
  - key: endurance
    max: 1000000000
    label: "Endurance-athlete volume (the minority)"
    fuel: "Now the athlete guidance starts to apply: more carbohydrate, and fuelling during long sessions."
    drink: "Water for most sessions; on the longest sessions, carbohydrate and a planned fluid strategy begin to matter."
    protein: "range"
athleteNote: >-
  Athlete guidance: high day-to-day carbohydrate scaled to hours of training, carbohydrate during long
  sessions, and a planned hydration and electrolyte strategy. It is calibrated for serious endurance
  training; applying it to a few weekly sessions is the classic over-fuelling mistake.
tropicalNote: >-
  In Singapore's heat, sweat losses are higher for the same effort: drink to thirst and aim to lose
  under ~2% of body weight over a long session. Salt matters only for long sessions or heavy sweating.
credit: "Schematic: shows direction, not a prescription. Protein range 1.2–1.6 g/kg from Morton 2018; fuelling guidance from Thomas 2016; hydration from Sawka 2007."
