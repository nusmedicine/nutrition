# Data for the CarbSafetyCheck island (Type 2 Diabetes chapter).
# A "Is it safe to endorse a low-carb diet?" decision widget. The learner selects the
# glucose-lowering drugs a patient is on; the verdict is DRUG-CLASS-FIRST: if ANY high-risk
# (hypoglycaemia-causing) drug is on board, refer to the diabetes team to review medication
# BEFORE cutting carbohydrate; if only low-risk drugs (or none) are selected, a sensible
# lower-carbohydrate change is reasonable; still refer to a dietitian. Pure content: no asset paths.
# No intro or caption: the chapter paragraph and the static drug-class table beside the island carry
# that text (the component renders intro/caption only when present).
id: carb-safety-check
title: "Is it safe to endorse a lower-carbohydrate diet?"
# Each drug: label = the class; example = a representative agent (or a plain gloss); risk = high|low.
# HIGH-RISK = can cause hypoglycaemia on their own; LOW-RISK = do not cause hypoglycaemia used alone.
drugs:
  - id: insulin
    label: "Insulin"
    example: "any insulin"
    risk: high
    note: "The dose is set for the patient's usual carbohydrate intake, so after the carbohydrate is cut the same dose can drive glucose dangerously low. On a fixed dose, counsel carbohydrate consistency, not restriction."
  - id: sulfonylurea
    label: "Sulfonylurea"
    example: "gliclazide, glipizide"
    risk: high
    note: "Drives insulin release regardless of glucose, so it can cause hypoglycaemia when carbohydrate is cut, especially in older people."
  - id: meglitinide
    label: "Meglitinide"
    example: "repaglinide"
    risk: high
    note: "A short-acting insulin secretagogue (it stimulates insulin release) taken with meals, so taking the dose but skipping the carbohydrate risks hypoglycaemia."
  - id: metformin
    label: "Metformin"
    example: "first-line"
    risk: low
    note: "Does not cause hypoglycaemia on its own, so a sensible carbohydrate change is safe alongside it."
  - id: dpp4
    label: "DPP-4 inhibitor"
    example: "sitagliptin, linagliptin"
    risk: low
    note: "Acts in a glucose-dependent way, so it does not cause hypoglycaemia when used alone."
  - id: sglt2
    label: "SGLT2 inhibitor"
    example: "empagliflozin, dapagliflozin"
    risk: low
    note: "Does not cause hypoglycaemia used alone, but avoid a very-low-carbohydrate or ketogenic diet on it, because the combination can cause ketoacidosis."
  - id: glp1
    label: "GLP-1 receptor agonist"
    example: "semaglutide, liraglutide"
    risk: low
    note: "Acts in a glucose-dependent way, so it does not cause hypoglycaemia when used alone."
# The two verdict strings. `refer` fires when ANY high-risk drug is selected; `safe` otherwise.
verdicts:
  refer:
    label: "Refer to the diabetes team first"
    text: >-
      Cutting carbohydrate on this medication risks hypoglycaemia. Refer to the diabetes team to review
      the medication before the diet changes, not after.
  safe:
    label: "Reasonable to endorse a sensible change"
    text: >-
      A sensible lower-carbohydrate change is reasonable; still refer to a dietitian for the
      individualised plan.
# Prompt shown before any drug is selected.
prompt: "Select the patient's glucose-lowering medications to see the verdict."
credit: "Drug-class hypoglycaemia risk after ADA Standards of Care 2026 and ACE/AACE guidance."
