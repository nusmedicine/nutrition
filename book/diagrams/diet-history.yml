id: diet-history
title: "Take a diet history"
credit: "Diagram: Health in Medicine, CC BY-SA 4.0."

patient:
  name: "Wei, 24"
  line: >
    Office worker, BMI 26 (overweight by the Asian cut-off), gained about 5 kg in a year. Says
    she "eats quite normally" and wants "a diet" to lose the weight. Friendly, a little
    embarrassed. She will tell you what you ask about, and only what you ask about.

# probes = the diet-history skeleton. `yield` is how much of the intake picture the probe
# uncovers (intake probes sum to 100). `safety: true` marks the do-no-harm probe: it has no
# nutritional yield and is the check that must happen.
probes:
  - id: typical-day
    label: "Walk me through a typical day"
    yield: 15
    reveal: "\"I skip breakfast, grab economy rice or noodles for lunch near the office, and dinner is whatever's easy: hawker or something quick at home.\""
    picture: ["Skips breakfast", "Economy rice / noodles lunch", "Convenience dinners"]
    note: "The core question, on which the rest of the history builds. One recalled day is not necessarily a habitual day (the 24-hour recall's main bias), so ask whether it was typical."
  - id: meals
    label: "How many meals, and when?"
    yield: 8
    reveal: "\"Usually two: a late lunch and a late dinner. I'm often too rushed in the morning to eat.\""
    picture: ["2 main meals, both late"]
    note: "Meal timing and skipping shape appetite and later over-eating, so they are worth a brief question."
  - id: drinks
    label: "What do you drink through the day?"
    yield: 30
    hinge: true
    reveal: "\"Oh… I have bubble tea most days, sometimes twice, and kopi with condensed milk in the morning. I didn't think of drinks as food.\""
    picture: ["~2 bubble teas/day (high sugar)", "Sweet kopi"]
    note: "Often the most informative question locally, and the one most often skipped. In the 2022 national nutrition survey, sugary drinks were the single biggest source of sugar, about half of all sugar eaten. The question about drinks should also include a routine question about alcohol."
  - id: snacks
    label: "Anything between meals?"
    yield: 12
    reveal: "\"Biscuits or a snack at my desk in the afternoon, and cake when a colleague brings some.\""
    picture: ["Desk snacks", "Occasional cake"]
    note: "Grazing and 'invisible' snacks add up and are easy to under-report, so ask specifically."
  - id: eating-out
    label: "How often do you eat out or tapau?"
    yield: 15
    reveal: "\"Lunch is always bought: hawker or food court. Dinner maybe half the time.\""
    picture: ["Eats out ~10+ meals/week"]
    note: "Eating out tends to increase portion size, oil, salt and sugar and to reduce control over what is eaten, which makes it an informative question locally."
  - id: portions
    label: "Roughly how big are your portions?"
    yield: 12
    reveal: "\"Big, actually. I always ask for extra rice; it's the same price.\""
    picture: ["Large rice portions"]
    note: "Portion cues are rough but useful; people under-estimate their own portions, so use everyday reference objects (bowls, palms)."
  - id: who-cooks
    label: "Who shops and cooks at home?"
    yield: 5
    reveal: "\"I live alone and barely cook; it's just easier to buy something.\""
    picture: ["Lives alone, rarely cooks"]
    note: "The social and practical context (who buys and cooks, and eating alone) determines what change is feasible."
  - id: supplements
    label: "Any supplements or health products?"
    yield: 3
    reveal: "\"No, nothing regular.\""
    picture: ["No supplements"]
    note: "Quick to ask and occasionally important (mega-doses, interactions), so don't assume."
  - id: red-flags
    label: "How do you feel about your eating and weight?"
    safety: true
    reveal: "\"Sometimes I skip meals to 'make up' for a big day, and I feel guilty after eating. But it's not a big deal… right?\""
    picture: ["Skips meals to compensate", "Guilt after eating (a gentle flag)"]
    note: "This is the do-no-harm check: a gentle open question surfaces possible disordered eating before you suggest any restriction. If it raises concern, switch from 'cut down' to a supportive screen (SCOFF) and consider referral. Never advise dietary restriction for someone who may have an eating disorder."
