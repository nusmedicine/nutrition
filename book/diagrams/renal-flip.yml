# Data for the RenalFlip island (Chronic Kidney Disease chapter).
# The "advice that flips in CKD" widget for the "Potassium: the risk of hyperkalaemia" section.
# The learner toggles the patient between a healthy adult and someone with advanced CKD / on dialysis;
# each card's verdict changes from good (✓) to caution (⚠) or absolute-avoid (⛔), with a one-line why.
# One card ("cut back on added salt") is a deliberate control that does NOT change, so the lesson isn't
# "everything reverses." Pure content, no asset paths.
# `intro` is optional in RenalFlip.svelte and was removed in the house-style retrofit: the chapter
# paragraph beside the island already makes the point, and the sentence before it tells the reader
# how to use the panel.
id: renal-flip
title: "The advice that flips in CKD"
# The two toggle states. `short` is used in the aria-live "Advice for …" line.
contexts:
  - id: healthy
    label: "A healthy adult"
    short: "a healthy adult"
  - id: ckd
    label: "Advanced CKD / on dialysis"
    short: "someone with advanced CKD"
# Each item: a piece of standard advice with a verdict per context.
# verdict.kind = good | caution | avoid  (drives colour + icon: ✓ / ⚠ / ⛔)
items:
  - id: potassium
    advice: "Eat more potassium-rich fruit & veg"
    example: "bananas, oranges, leafy greens"
    verdicts:
      healthy:
        kind: good
        badge: "Protective"
        why: "More potassium helps lower blood pressure, and the WHO advises the public to eat more of it."
      ckd:
        kind: caution
        badge: "Hazard"
        why: >-
          The failing kidney can't clear a potassium load, risking hyperkalaemia. The WHO advice
          explicitly excludes CKD. These foods are not eaten freely: a dietitian individualises the
          amount to blood levels.
  - id: salt-substitute
    advice: "Switch to a low-sodium 'potassium salt' substitute"
    example: "potassium-chloride salt swaps"
    verdicts:
      healthy:
        kind: good
        badge: "Reasonable"
        why: "A real way to cut sodium; in a large trial it cut strokes and deaths."
      ckd:
        kind: avoid
        badge: "Dangerous"
        why: >-
          That trial excluded serious kidney disease and people taking potassium-sparing diuretics or potassium supplements; the
          potassium-chloride swap can precipitate life-threatening hyperkalaemia. Check first, and
          if unsure, don't.
  - id: dash
    advice: "Follow the DASH pattern"
    example: "lots of fruit, veg, low-fat dairy"
    verdicts:
      healthy:
        kind: good
        badge: "First-line"
        why: "A pattern designed to lower blood pressure, endorsed for the general public."
      ckd:
        kind: caution
        badge: "Adapt"
        why: >-
          DASH is deliberately loaded with potassium, which can be unsafe in advanced CKD. A renal
          dietitian tailors it.
  - id: star-fruit
    advice: "Enjoy star fruit or belimbing (bilimbi)"
    example: "as fruit or a cooling juice"
    verdicts:
      healthy:
        kind: good
        badge: "Fine"
        why: "Just another fruit for most people."
      ckd:
        kind: avoid
        badge: "Absolute avoid"
        why: >-
          Beyond their potassium, they carry a neurotoxin the failing kidney can't clear, which
          causes seizures and death. An absolute avoid, not a portion-controlled food.
  - id: sodium
    advice: "Cut back on added salt / sodium"
    example: "less soup, sauce and processed food"
    verdicts:
      healthy:
        kind: good
        badge: "Good advice"
        why: "Lowers blood pressure, which is good for everyone."
      ckd:
        kind: good
        badge: "Still good"
        why: >-
          Cutting sodium is the one piece of advice that does not reverse in CKD: it lowers blood
          pressure, reduces albuminuria and helps kidney-protective drugs work. It is the change a
          generalist can safely reinforce.
prompt: "Toggle the patient to see which advice reverses, and which holds."
caption: >-
  For the public, eating more potassium, using a potassium salt substitute and following the DASH
  pattern are all sound. In advanced CKD they can become hazardous, while cutting sodium stays good
  throughout; the quantities are a renal dietitian's to set.
credit: "After WHO 2012 (potassium), Neal 2021 (SSaSS), KDOQI 2020 and NKF Singapore."
