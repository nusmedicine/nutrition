# Data for the MetsCluster island (Obesity & Metabolic Syndrome chapter).
# A clustering wheel: insulin resistance + central fat sit at the hub, and the five
# harmonised metabolic-syndrome components orbit it. The learner toggles each component
# present/absent; >=3 of 5 meets criteria. Sleep loss and stress/cortisol feed the hub as
# modifiable levers. Pure content, no asset paths.
# No `intro` key: the chapter paragraph beside the island already states the definition, and the
# component's own hint line carries the toggle instruction (AUTHOR.md §11i item 8).
id: mets-cluster
title: "Metabolic syndrome: a cluster, not a single disease"
hub:
  label: "Insulin resistance"
  sub: "+ central fat"
  # No hub `note` key: it repeated the chapter sentence beside the island (decision 9); the
  # component then shows its built-in click prompt.
# The five harmonised (IDF/AHA/NHLBI) components. threshold = the harmonised cut-off;
# note = a one-line teaching gloss. Waist and HDL thresholds are sex-specific.
components:
  - id: waist
    label: "Central obesity"
    threshold: "Waist ≥90 cm (men) / ≥80 cm (women)"
    note: "Asian cut-offs. The waist reads visceral fat, the depot that drives the risk, not overall weight."
  - id: triglycerides
    label: "Raised triglycerides"
    threshold: "≥1.7 mmol/L"
    note: "Reflects the triglyceride the liver over-produces under insulin resistance; treatment for it also counts."
  - id: hdl
    label: "Low HDL cholesterol"
    threshold: "<1.0 mmol/L (men) / <1.3 mmol/L (women)"
    note: "The 'protective' cholesterol falls as the cluster forms; treatment for it also counts."
  - id: bp
    label: "Raised blood pressure"
    threshold: "≥130/85 mmHg"
    note: "Below the threshold for hypertension on its own, but it still counts here, as does treatment for it."
  - id: glucose
    label: "Raised fasting glucose"
    threshold: "≥5.6 mmol/L"
    note: "Impaired fasting glucose: an early signal, well before the diagnostic cut-off in the Type 2 Diabetes chapter."
# How many of the five must be present to meet the harmonised criteria.
threshold_count: 3
verdicts:
  meets: "Metabolic syndrome: meets criteria (≥3 of 5)"
  # {n} is replaced with the running count of toggled-on components.
  notyet: "{n} of 5: not yet"
# Modifiable levers that feed the hub. Rendered as badges with arrows pointing at the centre.
levers:
  caption: "Modifiable levers that feed the hub"
  items:
    - id: sleep
      label: "Sleep loss"
      note: "Short or poor sleep measurably raises energy intake and tracks with more central fat."
    - id: stress
      label: "Stress / cortisol"
      note: "Chronic stress raises cortisol, which biases eating toward energy-dense comfort food and channels fat to the abdomen."
# A short standing caption: the take-home the chapter paragraph does not already state.
caption: >-
  Care acts on the shared root (insulin resistance with central fat) and its modifiable levers,
  not by chasing one number.
credit: "Harmonised criteria after IDF / AHA / NHLBI (Alberti 2009); Asian waist cut-offs per IDF."
