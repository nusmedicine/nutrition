id: scfa-flow
title: "Fibre → short-chain fatty acids"
credit: "Diagram: Health in Medicine, CC BY-SA 4.0."
viewBox: "0 0 770 430"

# cargo colours (also used for the SCFA nodes and their fate arrows)
cargo:
  acetate: "#1f9d6b"
  propionate: "#b9691d"
  butyrate: "#8a6fc0"
  gas: "#7a8791"
  substrate: "#08503f"

nodes:
  - id: substrate
    label: "Fibre + resistant starch"
    sub: "escaped digestion"
    x: 100
    y: 215
    kind: substrate
    detail: "Dietary fibre, resistant starch and some oligosaccharides that human small-intestinal enzymes cannot break down travel undigested to the colon."
  - id: ferment
    label: "Anaerobic bacteria"
    sub: "ferment without oxygen"
    x: 265
    y: 215
    kind: ferment
    detail: "Colonic bacteria ferment the fibre without oxygen. Fermentation is bacterial metabolism, distinct from the host's digestion, which is why it happens in the colon and not the small intestine."
  - id: acetate
    label: "Acetate"
    sub: "~60%"
    x: 455
    y: 95
    kind: scfa
    pct: 60
    detail: "The most abundant SCFA. It is poorly extracted by the liver, so it travels systemically to peripheral tissues and also feeds other bacteria."
  - id: propionate
    label: "Propionate"
    sub: "~20%"
    x: 455
    y: 215
    kind: scfa
    pct: 20
    detail: "Taken up by the liver via the portal vein, where it is a substrate for gluconeogenesis (see the Integrative metabolism chapter)."
  - id: butyrate
    label: "Butyrate"
    sub: "~20%, least abundant"
    x: 455
    y: 335
    kind: scfa
    pct: 20
    detail: "The least abundant SCFA, but most of it is used locally as the main fuel of the colonocytes, supplying most of their energy and supporting the mucus barrier."
  - id: gas
    label: "Gas"
    sub: "H₂, CO₂, CH₄"
    x: 265
    y: 355
    kind: gas
    detail: "By-products of fermentation. A large load of fermentable substrate at once (undigested lactose, beans, onions, FODMAPs) means more gas, which is the cause of bloating. Methanogenic archaea turn H₂ into CH₄."
  - id: systemic
    label: "Systemic"
    sub: "peripheral tissues"
    x: 660
    y: 95
    kind: fate
    detail: "Acetate, the most far-travelling SCFA, reaches muscle, brain and other tissues, and other gut bacteria."
  - id: liver
    label: "Liver"
    sub: "gluconeogenesis"
    x: 660
    y: 215
    kind: fate
    detail: "Propionate arrives by the portal vein and feeds into glucose production."
  - id: colonocytes
    label: "Colonocytes"
    sub: "colon lining fuel"
    x: 660
    y: 335
    kind: fate
    detail: "Butyrate is oxidised here by the colonocytes, the cells lining the colon, as their main fuel."

edges:
  - { from: substrate,  to: ferment,     step: 1, kind: substrate }
  - { from: ferment,    to: acetate,     step: 2, kind: acetate }
  - { from: ferment,    to: propionate,  step: 2, kind: propionate }
  - { from: ferment,    to: butyrate,    step: 2, kind: butyrate }
  - { from: ferment,    to: gas,         step: 3, kind: gas, label: "+ gas" }
  - { from: acetate,    to: systemic,    step: 4, kind: acetate }
  - { from: propionate, to: liver,       step: 4, kind: propionate }
  - { from: butyrate,   to: colonocytes, step: 4, kind: butyrate }

steps:
  - title: "Fibre reaches the colon"
    caption: >
      Dietary fibre and resistant starch escape digestion in the small intestine and arrive intact
      in the colon, the main site of microbial fermentation.
  - title: "Bacteria ferment it into SCFAs"
    caption: >
      Anaerobic colonic bacteria ferment the fibre into three short-chain fatty acids, in an
      approximate ratio of 60:20:20 (acetate : propionate : butyrate) that varies with diet and site.
  - title: "…and gas"
    caption: >
      Fermentation also releases hydrogen, carbon dioxide and, in some people, methane. A large load
      of fermentable substrate at once means more gas and bloating. Gas is usually a sign that
      fermentation is proceeding normally.
  - title: "Each SCFA has a fate"
    caption: >
      Acetate travels systemically; propionate goes to the liver for gluconeogenesis; and butyrate,
      the least abundant, is oxidised locally as the colonocytes' main fuel.
