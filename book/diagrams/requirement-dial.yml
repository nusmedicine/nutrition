id: requirement-dial
title: "The requirement dial"
intro: "Values are schematic, relative to a non-pregnant baseline, and show the shape of each change."
credit: "Diagram: Health in Medicine, CC BY-SA 4.0."

stages: ["Not pregnant", "1st trimester", "2nd trimester", "3rd trimester", "Lactation"]

nutrients:
  - name: "Energy"
    kind: rising
    unit: "extra kcal/day above baseline"
    values: [0, 0, 340, 452, 500]
    why: "Modest in pregnancy and concentrated in the second and third trimesters. Lactation is highest, for milk production, but fat laid down in pregnancy covers part of the cost, so the net need is only a little above the third trimester's."

  - name: "Iron"
    kind: rising
    unit: "% of non-pregnant need (schematic)"
    values: [100, 105, 130, 150, 95]
    why: "The expanding red-cell mass and the foetus's own stores push the need up, peaking late, and it falls again in lactation."

  - name: "Folate"
    kind: rising
    unit: "% of non-pregnant need (schematic)"
    values: [100, 170, 160, 150, 130]
    why: "Highest around conception and early pregnancy, when the neural tube forms, which is why folic acid has to start before conception."

  - name: "Iodine"
    kind: rising
    unit: "% of non-pregnant need (schematic)"
    values: [100, 145, 150, 160, 190]
    why: "Rises to supply foetal thyroid hormone, which is needed for brain development, and is highest in lactation as it passes into the milk."

  - name: "Calcium"
    kind: flat
    unit: "% of non-pregnant need (schematic)"
    values: [100, 100, 100, 100, 100]
    why: "Physiologically the need barely rises: in pregnancy intestinal calcium absorption roughly doubles, and in lactation the mother's skeleton releases calcium for the milk, so the dial stays flat. Singapore's allowance still rises modestly, from 800 to 1,000 mg a day for adult women."

  - name: "Vitamin A"
    kind: ceiling
    unit: "requirement flat, with an upper limit"
    values: [100, 100, 100, 100, 100]
    why: "The requirement barely moves, but high-dose preformed retinol (supplements, liver) is teratogenic, so the advice sets an upper limit to stay below. Plant β-carotene is safe."

  - name: "DHA (omega-3)"
    kind: rising
    unit: "% of non-pregnant need (schematic)"
    values: [100, 115, 130, 145, 150]
    why: "Builds the foetal brain and eye and modestly lowers preterm birth, and the need continues in lactation as DHA passes into the milk. Two to three low-mercury fish meals a week cover it."

  - name: "Choline"
    kind: rising
    unit: "% of non-pregnant need (schematic)"
    values: [100, 110, 120, 130, 150]
    why: "Most pregnant women in surveys fall short of it. Small trials suggest it supports foetal brain development, and the need rises further in lactation."
