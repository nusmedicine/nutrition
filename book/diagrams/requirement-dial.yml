id: requirement-dial
title: "The requirement dial"
intro: "Values are schematic, relative to a non-pregnant baseline: they show the shape of each change, not exact amounts."
credit: "Diagram: Health in Medicine, CC BY-SA 4.0."

stages: ["Not pregnant", "1st trimester", "2nd trimester", "3rd trimester", "Lactation"]

nutrients:
  - name: "Energy"
    kind: rising
    unit: "extra kcal/day above baseline"
    values: [0, 0, 340, 452, 500]
    why: "Modest in pregnancy and concentrated in the second and third trimesters, and highest in lactation, for milk production. 'Eating for two' only nearly fits lactation."

  - name: "Iron"
    kind: rising
    unit: "% of non-pregnant need (schematic)"
    values: [100, 105, 130, 150, 95]
    why: "The expanding red-cell mass and the foetus's own stores push the need up, peaking late, and it falls again in lactation."

  - name: "Folate"
    kind: rising
    unit: "% of non-pregnant need (schematic)"
    values: [100, 170, 160, 150, 130]
    why: "Highest around conception and early pregnancy, when the neural tube forms, which is why folic acid has to start before conception."

  - name: "Iodine"
    kind: rising
    unit: "% of non-pregnant need (schematic)"
    values: [100, 145, 150, 160, 190]
    why: "Rises for the foetal thyroid hormone that builds the brain, and is highest in lactation as it passes into the milk."

  - name: "Calcium"
    kind: flat
    unit: "% of non-pregnant need (schematic)"
    values: [100, 100, 100, 100, 100]
    why: "The requirement barely rises, because intestinal calcium absorption roughly doubles. A good baseline intake is enough, with no special allowance."

  - name: "Vitamin A"
    kind: ceiling
    unit: "requirement flat, with an upper limit"
    values: [100, 100, 100, 100, 100]
    why: "The requirement barely moves, but high-dose preformed retinol (supplements, liver) is teratogenic, so the advice is an upper limit to respect, not a target to reach. Plant β-carotene is safe."

  - name: "DHA (omega-3)"
    kind: rising
    unit: "% of non-pregnant need (schematic)"
    values: [100, 115, 130, 145, 150]
    why: "Builds the foetal brain and eye and modestly lowers preterm birth, then carries on into the milk. Two to three low-mercury fish meals a week cover it."

  - name: "Choline"
    kind: rising
    unit: "% of non-pregnant need (schematic)"
    values: [100, 110, 120, 130, 150]
    why: "Most pregnant women fall short of it. It supports foetal brain development, and the need rises further in lactation."
