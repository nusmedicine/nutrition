id: trial-check
title: "Did the trial confirm the claim?"
intro: "For each claim, predict whether a randomised trial confirmed a benefit or found none, then check."
credit: "Trial results are summarised for teaching; see the chapter citations for the primary sources."
claims:
  - claim: "Cohort studies linked the MIND diet to about half the risk of Alzheimer's. Did the prevention trial confirm a benefit?"
    verdict: "null"
    why: "The 3-year MIND randomised trial found no cognitive benefit over a control group also nudged toward better eating. The impressive cohort number did not survive the trial."
  - claim: "Did intensive blood-pressure lowering reduce cognitive impairment in its trial?"
    verdict: confirmed
    why: "In SPRINT MIND, intensive blood-pressure control reduced mild cognitive impairment and the mild-impairment-or-dementia measure. The vascular lever is the one that holds up in a trial."
  - claim: "Did ginkgo biloba, the classic 'brain tonic', reduce dementia in its large trial?"
    verdict: "null"
    why: "The GEM trial, a definitive null, found that ginkgo did not reduce dementia at all over about 6 years. Ginkgo can also raise bleeding risk."
  - claim: "Did trials of high-dose vitamin E show a benefit for preventing dementia?"
    verdict: "null"
    why: "Trials found no benefit for preventing dementia or slowing mild impairment, and at high doses vitamin E has been linked to a small increase in death: a null result with a harm signal."
  - claim: "Did fish-oil (omega-3) capsules improve cognition in trials?"
    verdict: "null"
    why: "Randomised trials of omega-3 capsules show no cognitive benefit. Eat fish as part of a good pattern; the capsule is not the food."
