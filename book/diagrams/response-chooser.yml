id: response-chooser
title: "Choose your response"
credit: "Diagram: Health in Medicine, CC BY-SA 4.0."

patient: "Mr Tan, 52, taxi driver: borderline HbA1c (a blood marker of average blood-glucose control), two to three sweet kopi gao a day."

# response types (badge colour)
types:
  reflect:   { label: "Reflective listening", color: "#2f8f5b" }
  open:      { label: "Open question / permission", color: "#3a6ea5" }
  affirm:    { label: "Affirmation", color: "#1d9e75" }
  closed:    { label: "Closed question", color: "#c98a2b" }
  righting:  { label: "Righting reflex", color: "#cf5b4e" }

turns:
  - id: t1
    patient: "\"Doctor, it's my only pleasure driving all day. A couple of kopi gao keep me going.\""
    options:
      - type: righting
        tier: poor
        text: "\"You need to stop the sugar. It's what's pushing your blood sugar up.\""
        reaction: "(folds his arms) \"I know, I know. Everyone says that. But I can't just stop, my job is stressful.\""
        feedback: "The warning is accurate, but moving straight to fixing the problem provokes resistance. Resisting the urge to fix (the righting reflex) is a core principle of motivational interviewing."
      - type: reflect
        tier: good
        text: "\"The kopi keeps you going through the long shifts, and it sounds like the sugar worries you a little too.\""
        reaction: "\"Yeah… my father had diabetes, actually. Lost his foot in the end. So it's at the back of my mind.\""
        feedback: "Naming both sides of his feeling without pushing invites him to voice his own reasons to change (change talk)."
      - type: open
        tier: good
        text: "\"Would it be alright if we talked about your drinks for a moment?\""
        reaction: "\"Sure, doctor, go ahead. I know they're not great for me.\""
        feedback: "Asking permission keeps you partners rather than adversaries, and it is a safe, respectful way to raise the topic."
      - type: closed
        tier: ok
        text: "\"How many sugars do you take in each cup?\""
        reaction: "\"Two, sometimes three. And condensed milk.\""
        feedback: "Gathering a fact is fine, but a closed question doesn't open up his motivation. It is useful later, but it is not the best way to open the conversation."
  - id: t2
    patient: "\"My father had diabetes. I don't want to end up like him, but the kopi is such a habit.\""
    options:
      - type: righting
        tier: poor
        text: "\"Right, so you must cut it out now, before it's too late. Let me list the complications.\""
        reaction: "(sighs) \"Here we go… I came for my back, not a lecture.\""
        feedback: "He has just expressed real motivation, and the lecture overrides it. Rushing to warn and instruct turns his willingness to change back into resistance."
      - type: affirm
        tier: good
        text: "\"It took something to say that, and it shows how much you want to stay well for your family.\""
        reaction: "\"…yeah. My daughter's getting married next year. I'd like to be around and healthy for that.\""
        feedback: "Genuine, specific recognition of his values strengthens his own motivation, and he offers even more change talk."
      - type: reflect
        tier: good
        text: "\"So watching what happened to your dad makes this feel real for you.\""
        reaction: "\"Exactly. It's more than numbers on a report. I've seen where it goes.\""
        feedback: "Gently amplifying his change talk helps him hear his own reasons instead of supplying yours."
      - type: closed
        tier: ok
        text: "\"Do you know your latest HbA1c number?\""
        reaction: "\"Not really… the nurse said it was 'borderline'.\""
        feedback: "Not wrong, but a data question pulls the conversation back to numbers at the moment he was opening up emotionally. Reflect or affirm first; the number can wait."
  - id: t3
    patient: "\"Maybe I could cut down a bit. But I don't know if I can. It's just what I do.\""
    options:
      - type: righting
        tier: poor
        text: "\"Good. From tomorrow, no more kopi gao: switch to plain water.\""
        reaction: "\"Aiyoh, no. Plain water the whole day? That won't last a week.\""
        feedback: "The goal is too big and imposed by you, not chosen by him, so he disengages. A goal has to be his, and achievable, or it won't stick."
      - type: open
        tier: good
        text: "\"What's one small change you think you could actually stick to?\""
        reaction: "\"Maybe… order it siu dai, less sweet, for my morning cup? I could try that.\""
        feedback: "Letting him choose the change gives a small goal that is his own (kopi siu dai on workday mornings), a good basis for a SMART goal."
      - type: open
        tier: good
        text: "\"On a scale of 0 to 10, how confident are you that you could cut down? And what makes it that number and not lower?\""
        reaction: "\"Maybe a 4… I mean, I could ask for less sugar, that part's easy. It's the packet drink in the afternoon that's harder.\""
        feedback: "A scaling question surfaces what he can do (siu dai) and what's harder (the packet drink), so you build the goal on the achievable part."
      - type: closed
        tier: poor
        text: "\"Don't worry about it. Just try your best, okay?\""
        reaction: "\"…okay.\" (you can tell nothing will change)"
        feedback: "Vague reassurance ending in a yes/no 'okay?' misses the opportunity. He was ready to plan something concrete, so this is the point to help him agree on one small, specific goal, then arrange to follow it up."
