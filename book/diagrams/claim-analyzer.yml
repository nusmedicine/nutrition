id: claim-analyzer
title: "Run the appraisal funnel"
credit: "Diagram: Health in Medicine, CC BY-SA 4.0."

# the four fixed questions of critical appraisal (same for every claim)
steps:
  - { id: study,  label: "Find the study",   q: "What evidence supports the headline?" }
  - { id: design, label: "Judge the design", q: "Where does it rank in the hierarchy of evidence?" }
  - { id: outcome,label: "Read the outcome",  q: "What did it measure, and was the result reliable?" }
  - { id: apply,  label: "Check it applies",  q: "Who was studied, and does it fit your patient?" }

# verdict tiers (colour + label)
verdicts:
  proven:     { label: "Proven",              color: "#2f8f5b" }
  plausible:  { label: "Plausible, unproven", color: "#3a6ea5" }
  weak:       { label: "Weak association",    color: "#e0a13a" }
  disproven:  { label: "Disproven",           color: "#7a8791" }
  retracted:  { label: "Retracted",           color: "#cf5b4e" }
  harmful:    { label: "Harmful",             color: "#a32d2d" }

claims:
  - id: acv
    label: "\"Apple cider vinegar melts fat\""
    study: "The claim rests on a 2024 randomised trial that reported weight loss from a daily dose of apple cider vinegar."
    design: "A randomised trial, normally high on the hierarchy, but small, short and not registered in advance."
    outcome: "The reported effect was modest, and the study was retracted in 2025 when its analyses could not be reproduced."
    apply: "With the main study withdrawn, what's left is a few small, short trials: a possible fall in fasting glucose in type 2 diabetes, of limited certainty, and weight data that still include the retracted trial. Neither replaces ordinary diet and activity."
    verdict: retracted
    verdictText: "The main study was retracted, so the claim has no reliable support. A cheap condiment is not a weight-loss treatment."
  - id: coffee
    label: "\"Coffee protects your heart\""
    study: "Backed by a large 2017 umbrella review that pooled many observational studies of coffee and health."
    design: "Cohort (observational) evidence: broad and consistent, but not randomised."
    outcome: "Around 3–4 cups a day was associated with the lowest all-cause and cardiovascular mortality. Observational data cannot show whether coffee caused this."
    apply: "Coffee drinkers differ from non-drinkers (healthy-user bias), and unwell people cut back (reverse causation). An association in observational data does not justify advising people to start drinking coffee to protect the heart."
    verdict: weak
    verdictText: "Reassuring for people who already drink coffee, and moderate intake is safe. It gives a non-drinker no reason to start."
  - id: acne
    label: "\"Cutting out dairy clears acne\""
    study: "Rests on observational studies linking milk to acne, plus a plausible mechanism (milk modestly raises IGF-1 and insulin)."
    design: "Observational only: there are no randomised trials on dairy and acne (the trials are on high-glycaemic-load diets)."
    outcome: "A weak but reproducible association (strongest for skimmed milk), and an association from observational studies cannot prove that milk causes acne."
    apply: "The American Academy of Dermatology guidelines (2016 and 2024) both conclude there is insufficient evidence to recommend cutting any food to treat acne; proven treatment is medication."
    verdict: weak
    verdictText: "A real but weak association. A trial of a lower-sugar diet is reasonable. A strict dairy-elimination diet is not worth its nutritional cost, especially in a teenager."
  - id: tre
    label: "\"16:8 fasting resets your metabolism\""
    study: "Built on genuine circadian biology, then tested directly in randomised trials of time-restricted eating."
    design: "Randomised trials testing the claim directly: the strongest part of the evidence."
    outcome: "Weight loss was modest and not significantly better than ordinary calorie restriction, so the benefit comes from eating less. The trials found no metabolic 'reset'."
    apply: "It can be a useful eating structure for someone who finds that it helps them eat less and who can sustain it."
    verdict: plausible
    verdictText: "The mechanism is real and the claim overstated. It is a reasonable optional tool, and success depends on adherence and the overall diet."
  - id: sugar
    label: "\"Sugar makes children hyperactive\""
    study: "A near-universal belief, and one tested directly in blinded randomised trials decades ago."
    design: "Blinded randomised trials: the strongest design, and feasible for this question."
    outcome: "Children given sugar behaved no differently from those given a sugar-free substitute; the 'sugar high' is largely parental expectancy (observer bias)."
    apply: "Applies broadly. Excess added sugar is still unhealthy for teeth and weight."
    verdict: disproven
    verdictText: "Disproven as a behaviour effect. Added sugar is still worth cutting for its established harms."
  - id: betacarotene
    label: "\"Beta-carotene supplements prevent cancer\""
    study: "Tested directly in large randomised prevention trials, including beta-carotene given to smokers."
    design: "Large randomised trials: high-quality evidence, well suited to the question."
    outcome: "Beta-carotene supplements increased lung cancer in smokers; other big supplement trials (vitamin D, fish oil) found no benefit on their main endpoints either."
    apply: "Studied in smokers, where beta-carotene caused harm; elsewhere the benefit is simply absent. 'Natural' and 'sold in a pharmacy' don't mean safe or proven."
    verdict: harmful
    verdictText: "Harmful in one group (smokers), which is worse than merely unproven. Supplements are for documented needs."
